<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mo &amp; I Ching">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mo and I Ching</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jomolhari&display=swap">
<style>
/* Layout: one reading column (max 44rem). Mode switch on top, casting stage, the reading, then the journal. */
:root{
  --paper:#f7f2e6; --surface:#fffaf0; --ink:#211f1c; --muted:#6b655a; --rule:#d3c5ae;
  --seal:#851a1a;            /* cinnabar: I Ching accent, moving-line marks */
  --saffron:#9c5a0a;         /* Mañjuśrī gold: Mo accent */
  --coin:#b8934c; --coin-ink:#3a2a10;
  --good:#2f6b4f; --mixed:#8a6410; --bad:#8a2a2a;
  --display:"Cormorant Garamond","EB Garamond",Georgia,serif;
  --body:"EB Garamond",Georgia,"Times New Roman",serif;
  --zh:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --tib:"Jomolhari","Noto Serif Tibetan","Kailasa","Microsoft Himalaya",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#191512; --surface:#231d18; --ink:#ece3d2; --muted:#a59b8a; --rule:#40362d;
  --seal:#e07f6c; --saffron:#e3a84a; --coin:#b9965a; --coin-ink:#2a1e0c;
  --good:#7dbf9b; --mixed:#e0b25a; --bad:#e58f80; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#191512; --surface:#231d18; --ink:#ece3d2; --muted:#a59b8a; --rule:#40362d;
  --seal:#e07f6c; --saffron:#e3a84a; --coin:#b9965a; --coin-ink:#2a1e0c;
  --good:#7dbf9b; --mixed:#e0b25a; --bad:#e58f80; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.app{max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:22px;--accent:var(--seal)}
.app[data-mode="mo"]{--accent:var(--saffron)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

header h1{font-size:2.5rem;letter-spacing:.005em}
header p{color:var(--muted);max-width:36rem;margin-top:6px}

.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tabs button{background:transparent;border:0;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button + button{border-left:1px solid var(--rule)}
.tabs .t{font-family:var(--display);font-size:1.35rem;font-weight:600}
.tabs .s{font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--paper)}
.tabs button[aria-selected="true"] .s{color:var(--paper);opacity:.85}

.q{display:flex;flex-direction:column;gap:4px}
.q label{font-size:.95rem;color:var(--muted)}
.q input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;width:100%}

.panel{display:flex;flex-direction:column;gap:20px}
.stage{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px 18px;display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:620px){ .stage.ic{grid-template-columns:1fr 1fr;align-items:center} }
.cast{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.status{color:var(--muted);text-align:center;font-size:1rem;min-height:1.5em}
.primary{background:var(--accent);color:var(--paper);border:0;border-radius:999px;padding:12px 26px;font-size:1.1rem;font-weight:500}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:8px 16px;font-size:1rem}
.manual{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:.92rem;color:var(--muted)}
.manual button{background:transparent;border:1px solid var(--rule);border-radius:8px;min-width:40px;padding:5px 8px;font-variant-numeric:tabular-nums}
.manual button:disabled{opacity:.4;cursor:default}

/* coins */
.coins{display:flex;gap:16px;perspective:600px}
.coin{width:68px;height:68px;position:relative;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.2,.7,.2,1)}
.coin .face{position:absolute;inset:0;border-radius:50%;background:var(--coin);color:var(--coin-ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:.78rem;font-weight:600;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14)}
.coin .face::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);background:var(--surface);box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.coin .yin{transform:rotateX(180deg)}
.coin .yin::after{content:"";position:absolute;inset:9px;border-radius:50%;border:2px dotted var(--coin-ink);opacity:.55}
.sum{font-family:var(--display);font-size:1.25rem;font-weight:600;min-height:1.4em;text-align:center}

/* hexagram lines */
.build{display:flex;flex-direction:column-reverse;gap:9px;width:100%;max-width:17rem;margin:0 auto}
.row{display:grid;grid-template-columns:1.2rem 1fr 1.4rem;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row .val{color:var(--ink);font-weight:600;text-align:right}
.ln{position:relative;height:11px;display:flex;gap:16%}
.ln i{flex:1;background:var(--ink);border-radius:1px;display:block}
.ln.empty{border:1px dashed var(--rule);border-radius:2px}
.ln .mk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--seal);font-style:normal}
.ln .mk9{width:17px;height:17px;border-radius:50%;border:2.5px solid var(--seal);background:var(--surface)}
.ln .mk6{font-size:1.25rem;font-weight:700;line-height:1}
.fig{display:flex;flex-direction:column-reverse;gap:6px;width:86px;flex:none}
.fig .ln{height:9px}
.fig .ln .mk9{width:14px;height:14px;border-width:2px}
.fig .ln .mk6{font-size:1.05rem}

/* reading */
.reading{display:flex;flex-direction:column;gap:18px}
.hexcard{display:flex;gap:20px;align-items:flex-start;border-top:2px solid var(--ink);padding-top:16px}
.hexcard .meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.kicker{font-size:.95rem;color:var(--accent);font-style:italic}
.hexcard h3{font-size:1.9rem}
.hexcard h3 .zh{font-family:var(--zh);font-weight:500;margin-inline:.15em}
.hexcard .en{font-size:1.15rem}
.small{font-size:.95rem;color:var(--muted)}
.gist{max-width:34rem}
.pages{font-size:.98rem;border-left:2px solid var(--accent);padding-left:10px}
.pages b{font-weight:600;font-variant-numeric:tabular-nums}
.moving{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.moving h3{font-size:1.25rem}
.moving ul{margin:0;padding-left:1.1rem}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.interp{display:flex;flex-direction:column;gap:14px;max-width:40rem}
.interp h4{font-family:var(--display);font-size:1.2rem;font-weight:600;margin:0 0 2px;color:var(--accent)}
.interp p{margin:0}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.lines li{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;align-items:start}
.lines .no{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--accent);text-align:right}
.lines li.on .tx{background:var(--surface);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 8px 8px 0}
.lines .lab{display:block;font-size:.88rem;color:var(--muted);font-style:italic}
.cats{margin:0;display:flex;flex-direction:column;gap:10px;max-width:40rem}
.cats div{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:9px}
.cats dt{font-weight:600}
.cats dd{margin:0}
.lead{font-size:1.15rem;max-width:40rem}
.sign{font-style:italic;color:var(--muted)}
.lookup{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lookup select{font:inherit;font-size:1rem;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.note{font-size:.95rem;color:var(--muted);max-width:40rem}

/* Mo */
.dice{display:flex;gap:22px;justify-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.92rem;color:var(--muted)}
.die{width:92px;height:92px;border-radius:14px;background:var(--paper);border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.die .tib{font-family:var(--tib);font-size:2.3rem;line-height:1.35;color:var(--ink)}
.die .lat{font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.die.blank{border-style:dashed;border-color:var(--rule)}
.die.rolling{animation:wob .16s linear infinite}
@keyframes wob{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
.die.sm{width:58px;height:58px;border-radius:10px;border-width:1.5px}
.die.sm .tib{font-size:1.45rem}
.die.sm .lat{display:none}
.syl{font-family:var(--tib);font-size:1.3rem;line-height:1.3}
.mocard{border-top:2px solid var(--ink);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.mocard .big{font-family:var(--tib);font-size:2.6rem;line-height:1.4}
.mocard h3{font-size:1.9rem}
.pill{align-self:flex-start;border:1.5px solid currentColor;border-radius:999px;padding:1px 12px;font-size:.92rem;font-weight:600}
.pill.good{color:var(--good)} .pill.mixed{color:var(--mixed)} .pill.bad{color:var(--bad)}
.firm{display:flex;flex-wrap:wrap;align-items:center;gap:12px}

details{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-family:var(--display);font-size:1.15rem;font-weight:600}
details > *:not(summary){margin-top:10px}
details ol,details ul{padding-left:1.2rem;margin-bottom:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:600;color:var(--muted)}

.journal h2{font-size:1.45rem}
.journal{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule);padding-top:18px}
.jlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.jlist button{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:9px 0;display:grid;grid-template-columns:8.2rem 1fr;gap:10px}
.jlist .d{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.jlist .r{min-width:0}
.jlist .qq{display:block;color:var(--muted);font-style:italic;font-size:.95rem;overflow-wrap:anywhere}
footer{color:var(--muted);font-size:.92rem;border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:480px){ .cats div{grid-template-columns:1fr;gap:2px} .lines li{grid-template-columns:1.6rem 1fr} header h1{font-size:2.1rem} .hexcard{gap:14px} .fig{width:64px} .hexcard h3,.mocard h3{font-size:1.6rem} }
@media (prefers-reduced-motion:reduce){ .coin{transition:none} .die.rolling{animation:none} }
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.langsw{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex:none;margin-top:8px}
.langsw button{background:transparent;border:0;padding:4px 12px;font-size:.92rem;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>


<div class="app" id="app" data-mode="ic">
  <header>
    <div class="top">
      <h1>Mo &amp; I Ching</h1>
      <div class="langsw" role="group" aria-label="Language / Idioma">
        <button id="lang-pt" aria-pressed="false" lang="pt-BR">PT</button><button id="lang-en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
    <p data-t="intro"></p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-ic" aria-controls="panel-ic" aria-selected="true"><span class="t">I Ching</span><span class="s" data-t="tabIcSub"></span></button>
    <button role="tab" id="tab-mo" aria-controls="panel-mo" aria-selected="false"><span class="t">Mo</span><span class="s" data-t="tabMoSub"></span></button>
  </div>

  <div class="q">
    <label for="question" data-t="qLabel"></label>
    <input id="question" type="text" autocomplete="off" maxlength="200">
  </div>

  <!-- I CHING -->
  <section class="panel" id="panel-ic" role="tabpanel" aria-labelledby="tab-ic">
    <div class="stage ic">
      <div class="cast">
        <div class="coins" aria-hidden="true">
          <div class="coin"><span class="face yang">3</span><span class="face yin">2</span></div>
          <div class="coin"><span class="face yang">3</span><span class="face yin">2</span></div>
          <div class="coin"><span class="face yang">3</span><span class="face yin">2</span></div>
        </div>
        <p class="sum" id="ic-sum" aria-live="polite"></p>
        <button class="primary" id="ic-throw"></button>
        <p class="status" id="ic-status"></p>
        <div class="manual"><span data-t="icManual"></span>
          <button data-v="6">6</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button>
        </div>
      </div>
      <div class="build" id="ic-build"></div>
    </div>
    <div class="reading" id="ic-result" hidden></div>
    <details>
      <summary data-t="icLookSum"></summary>
      <div class="lookup"><label for="ic-sel" class="small" data-t="hexagram"></label><select id="ic-sel"></select><button class="ghost" id="ic-show" data-t="show"></button></div>
      <p class="small" data-t="icLookNote"></p>
    </details>
    <details>
      <summary data-t="howReadSum"></summary>
      <div data-t="howRead"></div>
    </details>
    <details>
      <summary data-t="coinsSum"></summary>
      <div data-t="coins"></div>
    </details>
  </section>

  <!-- MO -->
  <section class="panel" id="panel-mo" role="tabpanel" aria-labelledby="tab-mo" hidden>
    <details>
      <summary data-t="beforeSum"></summary>
      <div data-t="before"></div>
    </details>
    <div class="stage">
      <div class="cast">
        <div class="dice">
          <div class="slot"><div class="die blank" id="die-0"><span class="tib"></span><span class="lat"></span></div><span data-t="cast1"></span></div>
          <div class="slot"><div class="die blank" id="die-1"><span class="tib"></span><span class="lat"></span></div><span data-t="cast2"></span></div>
        </div>
        <button class="primary" id="mo-cast"></button>
        <p class="status" id="mo-status"></p>
        <div class="manual" id="mo-manual"><span data-t="moManual"></span></div>
        <p class="small" style="text-align:center" data-t="dieNums"></p>
      </div>
    </div>
    <div class="reading" id="mo-result" hidden></div>
    <details>
      <summary data-t="moLookSum"></summary>
      <div class="lookup"><select id="mo-sel-a"></select><select id="mo-sel-b"></select><button class="ghost" id="mo-show" data-t="show"></button></div>
      <p class="small" data-t="moLookNote"></p>
    </details>
    <details>
      <summary data-t="sylSum"></summary>
      <p class="small" data-t="sylNote"></p>
      <div class="tablewrap"><table id="syl-table"></table></div>
    </details>
  </section>

  <section class="journal" aria-labelledby="jh">
    <h2 id="jh" data-t="journal"></h2>
    <p class="small" id="j-empty" data-t="jEmpty"></p>
    <ul class="jlist" id="j-list"></ul>
    <div class="actions"><button class="ghost" id="j-clear" hidden></button></div>
  </section>

  <footer data-t="footer"></footer>
</div>

<script>
// I Ching: interpretations written for this app. j = Judgment, im = Image, l = lines 1 (bottom) to 6 (top).
// Oracle phrases are rendered afresh from the Chinese; commentary is original.
window.ICX={};var ICX=window.ICX;
ICX[1]={j:"Pure creative force, six unbroken lines. What you begin now has the power to carry through from its origin to its completion, on one condition: that you stay true to what is right and keep at it. Success here is not luck; it comes from strength used consistently.",
im:"Heaven's motion never pauses. Take it as a model: make yourself strong without let-up, through steady effort renewed every day rather than a single heroic push.",
l:["A dragon lying low in the deep; do not use it. The force is real but its time has not come. Do not act yet, and do not let impatience or others' opinions push you into showing yourself early.",
"A dragon seen in the fields; good to meet a great person. Your ability begins to be seen. Seek out someone of real stature, a person or a teaching to measure yourself against.",
"Busy and tireless from morning to dusk, and wary at night: risky, but no fault. Work and responsibility are growing, and with them the danger of being carried away. Staying alert and self-critical keeps you clear.",
"Perhaps it leaps, perhaps it stays in the depths: no fault. A real choice between stepping out into the world and withdrawing to deepen yourself. Either is right if it is true to your nature.",
"A dragon in flight across the sky; good to meet a great person. The high point: influence that is natural and visible, and those who belong together find each other.",
"A dragon that overreaches has cause for regret. Ambition that has lost touch with the ground, with others and with limits, ends alone. Know when to stop."],
all:"When all six lines change (all nines): a flock of dragons, none at the head. Strength that does not need to put itself first. Great power joined to gentleness brings good fortune."};
ICX[2]={j:"Pure receptive force, six open lines. The way now is that of the mare: strong, tireless, and willing to be guided. If you try to lead you lose your way; if you follow and respond, you find direction. Look for companions where the work is, and accept solitude where decisions are made. Calm constancy brings good fortune.",
im:"The ground is broad and carries everything, good and bad alike. Give yourself the same breadth, so that you can bear people and circumstances without being bent out of shape.",
l:["Treading on hoarfrost; hard ice will follow. A first small sign of decline or coldness. Read it now, while it can still be answered easily.",
"Straight, square and large; no practice needed, nothing goes amiss. Be simply what you are and do what the situation asks; no technique is required.",
"Holding one's brilliance inside; one can keep firm. If you serve a larger cause, do not seek the credit; just see the work through to the end.",
"A bag with its mouth tied: neither blame nor praise. A time for complete reserve. Say little, show little, and stay out of harm's way.",
"A yellow skirt: the greatest good fortune. Real worth worn discreetly, in a position that is not the first. Inner quality expressed through modesty.",
"Dragons battle on the open plain; their blood is black and yellow. The receptive has tried to rule instead of serve, and both sides are hurt. Do not turn a supporting role into a contest for the lead."],
all:"When all six lines change (all sixes): lasting constancy is favourable. Neither advancing nor giving way: the strength of endurance."};
ICX[3]={j:"Difficulty at the beginning: a shoot pushing through hard ground. The situation is full of possibility and still in disorder. Success comes through constancy, but do not try to go anywhere yet. Stay where you are, sort things out, and find helpers; do not attempt it alone.",
im:"Clouds above, thunder below: the storm before rain. Use this time to bring order out of confusion, sorting and joining the threads as one does when setting up a loom.",
l:["Hesitant, circling: good to stay put and keep steady; good to appoint helpers. Keep your goal in view without forcing the way, and approach people without superiority.",
"Stuck and turning back, horses wheeling. Not raiders but suitors. The young woman does not commit; after ten years she does. An offer of help arrives from an unexpected side and is not what it first seems. Do not bind yourself yet; the right connection comes in its own time.",
"Chasing deer with no forester to guide you, you only end up deep in the woods. Seeing the signs, it is wiser to give up than to press on into what you do not know.",
"Horses wheeling; seek the match. Going brings good fortune. You cannot manage alone, and an opening exists. Take the first step toward it, even at some cost to pride.",
"Difficulty in sharing out one's bounty. Your good intentions are not yet trusted. Work in small, steady ways; trying to force something large now ends badly.",
"Horses wheeling; tears of blood flowing. Someone stuck in the first difficulties who gives up. Do not stay there: this state should not be prolonged."]};
ICX[4]={j:"Youthful inexperience: a spring at the foot of a mountain, not yet knowing where it will flow. Inexperience is no fault, and it can succeed if it seeks a teacher in the right spirit. The teacher does not chase the pupil; the pupil comes. The first sincere question gets a clear answer. Asking again and again, out of doubt or wanting a different reply, is disrespect and gets none. Constancy, in learning and teaching, is favourable.",
im:"A spring wells up below the mountain. It escapes stagnation only by flowing on and filling every hollow in its path. In the same way character is built by doing everything thoroughly and skipping nothing.",
l:["Opening up the unformed: it helps to apply discipline, and then to take the shackles off. Clear limits, taken seriously. Discipline that turns into mere drill and goes on too long brings regret.",
"Bearing patiently with the inexperienced brings good fortune. Strength within, gentleness without; receiving what is weaker without contempt. Such a person can carry real responsibility, like a son able to run the household.",
"Do not take a woman who, seeing a rich man, loses hold of herself. A warning against throwing oneself at whatever looks strong or wealthy, or accepting someone who does. Nothing good comes of it.",
"Hemmed in by ignorance: regret. Clinging stubbornly to fantasies far from what is real. Sometimes the only teacher left is to feel the consequences.",
"Childlike openness: good fortune. Whoever, even in a high place, seeks instruction with an unassuming and open mind will certainly be helped.",
"Striking at ignorance: it does not help to act like a raider; it helps to ward off raiders. Correction is sometimes needed for someone who will not learn, but it must stay objective and limited to stopping the excess. Never in anger."]};
ICX[5]={j:"Waiting: clouds climb the sky and the rain will come when it comes. If you are trustworthy, inwardly certain of the goal and honest about how things stand, there is brightness and success. Constancy brings good fortune, and then it is right to cross the great river: the decisive step can be taken once the waiting has been done well.",
im:"Clouds rising to the sky. Eat, drink, stay cheerful and at ease. Do not interfere with what is ripening; strengthen body and mind so as to be ready.",
l:["Waiting in the open country; good to keep to the ordinary. Carry on with ordinary life as long as possible and waste no strength on early worry.",
"Waiting on the sandbank; a few words of reproach, in the end good fortune. Danger is closer and there is some friction. Stay calm and do not answer back.",
"Waiting in the mud draws the raiders near. You started too soon and are stuck somewhere exposed. Only great caution and seriousness prevent harm.",
"Waiting in blood; leave the hole. The danger is acute. No forcing: hold steady, let events take their course, and you come out of it.",
"Waiting over wine and food; constancy brings good fortune. A pause in the middle of the struggle. Enjoy it and gather strength without losing sight of the goal.",
"Into the hole; three guests arrive unasked. Treat them with respect and in the end there is good fortune. The waiting seems to have failed, and then help comes in a form you did not expect. Recognise it and receive it."]};
ICX[6]={j:"Conflict: heaven moves up, water down, and the two draw apart. You are sincere and still you meet obstruction. Pausing halfway, with caution, brings good fortune; pushing the quarrel to the bitter end brings misfortune, even if you are right. It helps to see a great person, an impartial arbiter. It does not help to cross the great river: begin nothing risky while divided.",
im:"Heaven and water go opposite ways. So in every undertaking, think the beginning through. Conflict is prevented at the outset, by making rights and duties clear before starting.",
l:["Not prolonging the matter; a few words, in the end good fortune. Drop the dispute while it is still small.",
"Unable to win, one goes back and slips away home. Withdrawing before a stronger opponent is no disgrace, and it spares those around you.",
"Living on long-held merit; constancy in danger, in the end good fortune. Hold to what you have honestly earned without claiming more. If you work for another, do not seek the prestige.",
"Unable to win, one turns back to what is fitting, changes course, and is at peace in constancy. Giving up a fight you might win, because it is not right: good fortune.",
"Bringing the case: great good fortune. Here the judge is strong and fair. If you are in the right, the matter can safely be put before such an arbiter.",
"Perhaps one is granted a sash of honour, and three times before the morning is out it is taken away. What is won by fighting to the end does not last; the conflict simply goes on."]};
ICX[7]={j:"The army: water held within the earth, strength stored in the mass of people. A collective effort needs discipline and a strong, mature person at its centre, trusted by those above and liked by those below. With that, good fortune and no fault. Force must have a just cause and a clear command.",
im:"Water inside the earth. Build your following by generosity toward people. The strength you will need in hard times is built in peace, by looking after those you depend on.",
l:["The troops go out according to rule; without good order, misfortune. Before anything else: a just cause and proper organisation.",
"In the middle of the troops: good fortune, no fault; the king confers honours three times. The leader shares the lot of those led, and earns recognition from above.",
"The troops perhaps cart home the dead: misfortune. Command taken over by those unfit for it, or by too many heads, leads to defeat.",
"The troops camp on the left: no fault. Before a superior force an orderly withdrawal is simply correct.",
"Game in the fields: good to seize it, no fault. The intrusion is real and action is justified. Let the experienced one lead; if the inexperienced take charge, it turns into a carnage.",
"The great ruler gives charge: to found states, to establish houses. Do not use small people. The effort has succeeded and rewards are due, but in the new order do not give power to the unworthy."]};
ICX[8]={j:"Holding together: water lying on the earth, flowing together wherever it can. Union brings good fortune. But consult again, that is, ask yourself honestly whether you have the breadth, constancy and steadiness to be a centre for others. If so, no fault. Those who are unsure gradually come. Whoever comes too late meets misfortune: there is a right moment for joining, and it passes.",
im:"Water over the earth. The ancient rulers set up separate states and kept close ties with their lords. Each part keeps its own character, and all are held by a common interest.",
l:["Hold to it with trust: no fault. Trust filling an earthen jar, and in the end good fortune comes from elsewhere. Sincerity matters more than form.",
"Holding together from within; constancy, good fortune. Respond from your own conviction, without courting favour or losing yourself.",
"Holding together with the wrong people. Take care about the company you are bound to.",
"Holding together outwardly; constancy, good fortune. Here it is right to show your allegiance openly to the one at the centre.",
"Holding together in the open. The king hunts with beaters on three sides and lets the game ahead go free; his people need no warning. Those who want to come, come; nobody is forced or courted.",
"Holding together with no head: misfortune. Without a right beginning there is no right end. Whoever keeps hesitating to commit misses the moment."]};
ICX[9]={j:"The small restrains: wind crossing the sky, dense clouds and still no rain from the western lands. Something strong is held back by something gentle. There is success, but only what small, friendly and persistent means can achieve. The time for the large stroke has not arrived; prepare and do not force.",
im:"Wind moving across the sky. When you cannot produce large effects in the world, refine what is within reach: manner, expression, the small details of your conduct.",
l:["Coming back by one's own path: what fault could there be? You pushed ahead, met resistance, and return to the way that suits you. Good fortune.",
"Drawn into coming back: good fortune. Seeing others like you turn back, you do not expose yourself needlessly.",
"The cart loses its wheel spokes; husband and wife glare at one another. An advance forced on the assumption that the obstacle was slight. It breaks down, with a quarrel that does credit to no one.",
"With trust, bloodshed is avoided and fear departs: no fault. A delicate position as adviser to someone powerful. Only disinterested truthfulness carries weight.",
"With trust, bound together; rich along with one's neighbour. Loyalty that is mutual: each completes what the other lacks, and the wealth is shared.",
"The rain has come, things settle; virtue has accumulated and is carried. Do not press for more now: the moon is almost full, and going further brings misfortune."]};
ICX[10]={j:"Treading: stepping on the tiger's tail without being bitten. You are dealing with something stronger or more dangerous than you, and it can go well, because good humour and proper conduct disarm even the irritable. Success comes through manner: pleasant, never presumptuous.",
im:"Sky above, lake below: a real difference of height that nobody resents because it is true. Distinguish high and low fairly and people's minds settle. Rank that follows inner worth creates order.",
l:["Going forward plainly: no fault. Not yet bound by obligations, you can follow your own bent, asking nothing of anyone. Stay content with simplicity.",
"Walking a smooth, even road; the one who lives apart is firm and fortunate. Withdrawn from the bustle, wanting nothing, challenging nobody.",
"One-eyed yet thinks he sees, lame yet thinks he walks: he treads on the tiger's tail and is bitten. Overrating your strength and rushing in regardless. Only justified for someone acting for a greater cause.",
"Treading on the tiger's tail, warily and with care: in the end good fortune. The undertaking is dangerous, and the strength for it is there, joined to caution.",
"Treading decisively; firm, though in danger. You must be resolute, and you must also know that resoluteness has its risk. Stay aware of it.",
"Look back over the path and examine the signs; if it has come full circle, great good fortune. Judge the work by its effects. If they were good, the outcome is good."]};
ICX[11]={j:"Peace: the sky has placed itself under the earth, and their forces meet and mingle. What is small leaves, what is great arrives: good fortune and success. A time of harmony and flourishing, when what is strong and good stands at the centre and what is weak comes under its influence, so that both are served.",
im:"Heaven and earth in communion. The ruler shapes and completes their course and assists what they produce, to support the people. Prosperity has to be given form: each thing in its season and place.",
l:["Pull up a rush and the roots come with it, clustered by kind; setting out brings good fortune. In good times a capable person who goes out draws like-minded people along.",
"Embracing the untamed, crossing the river without a boat, not neglecting what is far off, not forming cliques: one is praised for walking the middle. Broad tolerance, courage, attention to the distant, freedom from faction.",
"No level ground that does not slope, no going without return. Firm in hardship, no fault. Do not fret over this certainty; there is still good fortune to enjoy. Everything changes. Remember it while things are good.",
"Fluttering down, not relying on wealth, together with the neighbours; trusting without needing warnings. In times of trust, high and low meet simply, without calculation.",
"The king gives his younger sister in marriage: blessing and great good fortune. A union of high and low in which the one of higher rank adapts with modesty.",
"The rampart falls back into the moat. Do not send out the troops; give your orders only within your own town. The turn that was foretold has come. Do not resist by force: hold your own circle together and accept it."]};
ICX[12]={j:"Standstill: the sky draws away above, the earth sinks below, and they no longer meet. What is great leaves, what is small arrives. The wrong people are in the way, and it is not a time in which constancy can prosper openly. Communication is cut and nothing grows from joint effort. Do not be drawn in; stay true to your principles and wait.",
im:"Heaven and earth out of contact. Withdraw into your own worth to avoid the trouble, and do not let yourself be rewarded with position or income. Accept no favours that would compromise you.",
l:["Pull up a rush and the roots come with it, clustered by kind; constancy, good fortune, success. Withdraw together with those of like mind.",
"Enduring and accommodating: for lesser people, good fortune; for the great person, standstill, and success through it. Accept the standstill without mingling with flatterers.",
"Carrying shame. Those who rose by crooked means begin to feel inside that they are not equal to it. A first turn for the better.",
"Acting on a mandate: no fault; companions share the blessing. The standstill nears its end. Whoever is truly called, and not self-appointed, can now act.",
"The standstill gives way: good fortune for the great person. 'It may yet fail, it may yet fail': tie it to a thicket of mulberry. Anxious care at the moment of transition is what makes the success firm.",
"The standstill is overturned: first stopped, afterwards glad. It does not end of itself; it takes the right person's effort to bring it down."]};
ICX[13]={j:"Fellowship: fire rising toward the sky. Fellowship in the open country brings success, and it is right to cross the great river. True community rests on shared concerns that are universal, not on private interest or clique. It needs someone clear within and strong without, who keeps the aim in view.",
im:"Sky and fire together. Organise people by kinship and distinguish things by their kinds. Fellowship is not a blur: it has structure, and each person has a place.",
l:["Fellowship at the gate: no fault. A beginning in the open, before any private arrangements exist. Everyone stands on equal ground.",
"Fellowship within the clan: regret. Narrowing the bond to one's own faction on personal grounds.",
"Troops hidden in the undergrowth, a climb to the high hill; for three years no rising. Mistrust: each watches the other and holds something back. Fellowship becomes ambush, and nothing comes of it.",
"Mounted on the wall, yet unable to attack: good fortune. The quarrel is near, and the difficulty of fighting brings you to your senses. That is the fortunate part.",
"Fellowship: first crying out, then laughing; the great armies succeed in meeting. Two people kept apart outwardly and united inwardly. The obstacles cause grief, and they are overcome.",
"Fellowship in the outskirts: no regret. Joining with whoever happens to be near. Not universal fellowship, but nothing to regret either."]};
ICX[14]={j:"Great possession: fire high in the sky, lighting everything. Fundamental success. A single yielding line in the place of honour holds all the strong ones: abundance and power gathered through modesty and clarity. What is held this way is held rightly.",
im:"Fire up in the sky. Check what is harmful, encourage what is good, in keeping with heaven's benign order. Great means bring a duty to put things in order.",
l:["No dealings with what harms: not a fault. Remember the difficulty and there will be none. Wealth just beginning and not yet tested. Do not grow careless or proud.",
"A large wagon for carrying loads; there is somewhere to go, no fault. Resources that can actually be moved and used, and able helpers to carry them.",
"A lord presents an offering to the Son of Heaven; a petty person cannot. What you have is not for you alone; put it at the service of the whole.",
"Not flaunting one's abundance: no fault. Among the rich and powerful, do not compete or envy; keep your eyes on your own work.",
"His trustworthiness meets with response; dignified: good fortune. Sincerity wins people, but kindness alone invites insolence. It needs dignity to keep familiarity within bounds.",
"Help from heaven: good fortune, nothing unfavourable. At the height of possession, still modest and honouring the wise. Such a person is helped from every side."]};
ICX[15]={j:"Modesty: a mountain hidden inside the earth. It brings success, and the noble person carries things through to the end. It is a law of things that the full is emptied and the modest is filled; the high is lowered and the low raised. Modesty does not mean thinking little of yourself. It means not making a display of what you are.",
im:"A mountain within the earth. Take from where there is too much and add where there is too little; weigh things and make them even. Modesty in practice is the work of balancing.",
l:["Modest about one's modesty, the noble person can cross the great river: good fortune. A hard task goes easily when you make no claims or conditions.",
"Modesty that makes itself heard; constancy, good fortune. What is in the heart shows of itself in word and manner, and has its effect unhindered.",
"Modesty with real achievement: the noble person sees it through, good fortune. Someone who achieves much and is not dazzled by it, and so keeps everyone's support.",
"Nothing unfavourable; display modesty in action. Modesty is not an excuse for avoiding responsibility. It shows in the care you put into your work.",
"Not enriching oneself at the neighbour's expense; good to invade and subdue, nothing unfavourable. Modesty is not weak good nature. When things are out of order, act firmly, objectively and without personal offence.",
"Modesty that makes itself heard; good to set the troops in motion, to bring one's own town and land to order. When something is wrong, begin by disciplining yourself and your own circle rather than blaming others."]};
ICX[16]={j:"Delight, enthusiasm: thunder breaking out of the earth. Good to appoint helpers and set the troops moving. One strong line moves and the others follow gladly, because the movement goes with their nature, along the easy path. That is how people are gathered for an undertaking.",
im:"Thunder bursting forth from the ground. The ancient kings composed music to honour merit and offered it to the Most High, with the ancestors as companions. Enthusiasm becomes something more when it is given form and joined to what is sacred.",
l:["Delight that announces itself: misfortune. Boasting of one's connections from a low position. Enthusiasm is only justified when it unites people, never as self-display.",
"Firm as stone, not waiting out the day; constancy, good fortune. Someone not dazzled by the mood, who sees the first sign of a turn and acts on it at once.",
"Delight that looks upward for approval brings regret; tarrying brings regret too. Do not wait for a signal from above before you move. The moment has to be taken by you.",
"The source of delight: great gains. Do not doubt; friends gather like hair caught in a clasp. Someone sure of themselves and free of suspicion draws others naturally.",
"Constantly ill, yet not dying. Enthusiasm obstructed under steady pressure. The pressure itself keeps you from spending yourself in empty excitement.",
"Delight in the dark; if the course is changed once it is complete, no fault. Carried away by a false excitement, a sober awakening is still possible, and it sets things right."]};

ICX[17]={j:"Following: thunder resting within the lake. Fundamental success; constancy is favourable; no fault. To be followed you must first know how to follow, adapting to what the time asks. A following obtained by cunning or force only breeds resistance. And following must stay consistent with what is right, or it is mere going along.",
im:"Thunder sunk in the lake. As dusk falls, go in and rest. Adapting to the time includes stopping: nothing is gained by pushing against the hour.",
l:["The post one holds shifts; constancy, good fortune. Going out of one's gate to mix with others brings results. Be ready to hear other views, even from outside your own party, without losing your footing.",
"Tied to the small child, one loses the grown man. You cannot keep both the lesser and the better company. A choice has to be made.",
"Tied to the grown man, one lets the small child go. Following, one gains what is sought; it is good to stay steady. Something is given up, and what you actually need is gained.",
"Following brings gains, and holding to it is risky. With trust in the way and clear sight, what fault could there be? Those who attach themselves to you may have their own ends in view. Go your way sincerely and with open eyes.",
"Trust placed in what is excellent: good fortune. Everyone needs something to follow. Whoever follows the good and the beautiful with conviction is on firm ground.",
"Held fast, then bound still closer; the king makes offering on the Western Mountain. A sage who had withdrawn is drawn back by a follower's devotion, and the bond is made lasting."]};
ICX[18]={j:"Repairing what has decayed: wind low beneath the mountain, a bowl in which worms have bred. What has spoiled through neglect can be put right, so there is fundamental success, and it is right to cross the great river. Three days before the start, three days after: understand the causes carefully before you begin, and watch carefully afterwards that the new way holds.",
im:"Wind under the mountain. Rouse people and nourish their resolve. Stagnation is cured by stirring things up, and then by feeding what is good.",
l:["Mending the father's decay. With a capable son, the late father is free of fault. Risk, then good fortune. Rigid habit has caused decay; it is not yet deep and can be mended, though reform always carries some risk.",
"Mending the mother's decay. Do not be too rigid about it. A fault that came from weakness needs gentle handling, not a hard hand.",
"Mending the father's decay. A little regret, no great fault. Proceeding somewhat too forcefully. There are small frictions, but too much energy is better than too little.",
"Indulging the father's decay. Going on so, one meets regret. Too weak to act against a decay that is just beginning, and it will run its course.",
"Mending the father's decay, and earning praise for it. Not able to do it alone, but with capable helpers you bring about a thorough repair.",
"Not serving kings or lords; holding one's own work in high regard. There is a withdrawal that is not idleness: working on oneself, for values that belong to the future."]};
ICX[19]={j:"Approach: earth bending down over the lake, the light pressing upward. Fundamental success; constancy favourable. A time of joyful, hopeful advance, like early spring. Use it with determination. But by the eighth month misfortune: the tide turns. If you meet the reverse before it shows, you can master it.",
im:"Earth above the lake. Be tireless in teaching and boundless in bearing with and protecting people. The one who is above turns toward those below.",
l:["Approaching together; constancy, good fortune. The good begins to prevail and finds a response in influential places. Join the upward movement without being carried away by it.",
"Approaching together; good fortune, nothing that does not help. The impulse comes from higher up, and you have the strength to answer it. The future need not worry you.",
"A honeyed approach: nothing helps. Once you are troubled by it, no fault. Things go well and one turns easy-going and careless. Seeing it and correcting yourself clears you.",
"Approaching fully: no fault. Someone in a high position draws a capable person into their circle, regardless of rank.",
"Approaching with wisdom, as befits a great ruler: good fortune. Knowing how to choose able people and then leaving them free to do the work.",
"Approaching with generous sincerity: good fortune, no fault. A sage who had left the world comes back to it, to teach and to help."]};
ICX[20]={j:"Viewing, contemplation: wind passing over the earth; a tower seen from far off. The hands are washed and the offering not yet made, and all look on with trust and reverence. The moment of deepest concentration in a rite, before anything is done. What is contemplated with that seriousness affects those who see it. To contemplate, and to be an example that others contemplate: the hexagram means both.",
im:"Wind going over the land. The ancient kings toured the regions, observed the people, and set out their teaching. Look widely and directly, and let what you see shape what you teach.",
l:["A child's way of looking: for small people no fault; for the noble person, regret. Seeing things from afar without grasping how they connect.",
"Peeping through a gap: fine for a woman kept indoors. A narrow, self-referring view. Enough for a private life, not for anyone who must act in the world.",
"Looking at the course of my own life to decide whether to go forward or back. No longer looking outward, but at the effects your own life produces, to know which way to go.",
"Viewing the brilliance of the realm; it is good to be a guest of the king. Someone who understands how a community flourishes should be given an honoured, independent place, and not be used as a tool.",
"Looking at my own life: for the noble person, no fault. Someone others look up to must keep examining themselves by the effects they have. If those are good, they are clear.",
"Looking at his life: for the noble person, no fault. Looking at life apart from the self altogether: the sage outside worldly affairs, asking only whether they are free of fault."]};
ICX[21]={j:"Biting through: something caught between the teeth, thunder and lightning together. Success; it is right to apply the law. Something stands between and prevents union: a slander, a betrayal, a deliberate obstruction. It will not go away by itself. Bite through it with energy, in the right measure of clarity and firmness.",
im:"Thunder with lightning. The ancient kings made the penalties clear and the laws firm. Clarity about what is wrong, and a response that is proportionate and certain.",
l:["Feet locked in the stocks, the toes hidden: no fault. A first offence, a mild penalty. Checked this early, it goes no further.",
"Biting into soft flesh, the nose disappears into it: no fault. Right and wrong are easy to tell, and one goes a little too far in indignation. The penalty is still just.",
"Biting into dried meat and meeting poison: small regret, no fault. An old matter, and you lack the authority to settle it; it stirs up resentment. Still, the action was needed.",
"Biting into dried meat on the bone and finding a bronze arrowhead. Good to be firm in hardship: good fortune. Powerful opponents and a very hard task. Hard as metal and straight as an arrow: that is how it is won.",
"Biting into dried meat and finding gold. Firm, though in danger: no fault. The case is clear but not easy. Your nature inclines to leniency; stay impartial and remember what is at stake.",
"Wearing the cangue, the ears hidden: misfortune. Someone incorrigible, deaf to every warning."]};
ICX[22]={j:"Adornment, grace: fire below the mountain, lighting and beautifying it. Success; some small benefit in having somewhere to go. Form and beauty are needed and bring things to a pleasing order, but they are ornament, not substance. Use them in minor matters; important questions are not settled this way.",
im:"Fire beneath the mountain. Use clarity to put everyday affairs in order, but do not presume to settle grave disputes by it. The light does not reach far.",
l:["Adorning one's feet; leaving the carriage and going on foot. A beginner in a low place. Decline the easy ride of doubtful origin and go forward on your own feet.",
"Adorning the beard. Form cared for for its own sake, moving only as the chin moves, is vanity.",
"Adorned and glistening; lasting constancy, good fortune. A charmed, mellow moment. Enjoy it without sinking into comfort.",
"Adorned or plain? A white horse, as if winged. Not a raider; a suitor. Torn between seeking brilliance and returning to plainness. The answer comes from outside: a sincere bond with a friend.",
"Adornment among the hills and gardens; a meagre bolt of silk. Regret, in the end good fortune. Turning from the show of the lowlands to a simpler person you would like as a friend. What you have to offer looks slight; your sincerity is what counts.",
"Plain white adornment: no fault. At the highest stage ornament is dropped. Form no longer hides content; it lets it show completely."]};
ICX[23]={j:"Stripping away: the mountain resting on the earth, one last firm line above five that are giving way. It does not help to go anywhere. The lesser forces are undermining what is strong, gradually and from below. This is a matter of the time, not of anyone's cowardice. Submit and keep still; to act now is to act against the moment.",
im:"A mountain set upon the earth. Those above secure their place only by being generous to those below. A mountain stands firm when its base is broad.",
l:["The couch is stripped at the leg; constancy is destroyed: misfortune. The undermining starts from below, with slander and intrigue against loyal people. Nothing to do but wait.",
"The couch is stripped at the frame; constancy is destroyed: misfortune. The danger comes closer and there is no help from above or below. Step aside; stubbornly holding your position leads to ruin.",
"Stripping, and parting from them: no fault. Placed among people of ill will, you keep an inner tie with someone better, and that gives you the footing to break away.",
"The couch is stripped down to the skin: misfortune. It has reached the person. The harm can no longer be turned aside.",
"A string of fish; the palace women bring favour; nothing unfavourable. The dark force changes near the strong line above and submits of its own accord, bringing the rest along.",
"A large fruit left uneaten. The noble person gains a carriage; the petty person's hut is stripped. The stripping is over. The seed falls to the ground and good grows again; harm consumes itself."]};
ICX[24]={j:"Return, the turning point: thunder inside the earth, one light line coming back from below. Success. Out and in without harm; friends arrive and there is no fault. The way turns back on itself, and in seven days the return comes. Good to have somewhere to go. After the dark has done its work the light returns by itself. Nothing needs forcing: the movement is natural, and the old is let go without harm.",
im:"Thunder within the earth. On the solstice the ancient kings closed the passes; merchants did not travel and the ruler did not tour the land. What is just returning is tender. Rest protects it.",
l:["Coming back before going far: no need for regret, great good fortune. A small straying, noticed and corrected at once.",
"A calm return: good fortune. Returning takes a decision, and it is easier in good company. Put pride aside and follow the example of those who do well.",
"Return again and again: danger, but no fault. Turning away and turning back repeatedly out of an unsteady will. Risky, but since you are not lost in the wrong, no fault.",
"Walking in the middle of the group, one turns back alone. Surrounded by people of a lesser sort, you hold an inner tie to a strong friend and turn back by yourself.",
"Returning wholeheartedly: no regret. When the time to turn has come, look honestly at yourself, admit the fault, and decide. Nobody regrets that.",
"Missing the return: misfortune, disaster within and without. Troops sent out this way end in great defeat, and for ten years there is no recovery. Obstinately missing the moment to turn."]};
ICX[25]={j:"Without falsehood, the unexpected: thunder moving under the sky. Fundamental success; constancy favourable. Whoever is not upright meets disaster, and it does not help them to go anywhere. To act from one's original nature, with no hidden motive and no thought of reward, is to be in accord with heaven. But instinct that is not truly upright only brings trouble.",
im:"Thunder rolling everywhere under the sky, and each thing is given its own unfeigned nature. The ancient kings, in step with the seasons, cared for all beings. Each thing nurtured according to its nature and time.",
l:["Going forward without guile: good fortune. The first impulse of the heart is good. Follow it with confidence.",
"Ploughing without counting on the harvest, clearing land without counting on its yield: then it helps to go somewhere. Do each piece of work for its own sake, without an eye on the result.",
"Unlooked-for misfortune: an ox tethered by someone becomes a passer-by's gain and the villagers' loss. Sometimes harm comes from outside through no fault of yours. Adapt to it.",
"One can stay steady: no fault. What truly belongs to you cannot be lost, even if you throw it away. Stay true to your nature and do not listen to others.",
"An illness that is not of your making: take no medicine, and there will be joy. An ill that comes from outside and has no hold in your nature needs no outward remedy. Let it pass.",
"Acting without guile even now brings trouble; nothing helps. When the time is not ripe for going further, wait quietly. Pushing on regardless, against fate, fails."]};
ICX[26]={j:"Great restraint, great accumulation: the sky held inside the mountain. Constancy is favourable. Not eating at home brings good fortune; it is right to cross the great river. Great strength is being held, stored and fed, and that takes someone who renews their character daily. With such reserves it is right to take a public role and to attempt even difficult things.",
im:"Heaven contained within the mountain. Learn many words of the ancients and many deeds of the past, and so nourish your character. Study the past so that it becomes living substance in you, not mere learning.",
l:["There is danger; better to stop. You want to go forward and circumstances stand in the way. Forcing it brings misfortune; compose yourself and wait.",
"The cart has its axle-block removed. The restraining force is far stronger. You accept it, take the wheels off yourself, and wait. Energy builds up this way.",
"Fine horses in pursuit; good to be firm in hardship. Drill daily with chariot and defence; good to have somewhere to go. The way opens, and you advance with others of like will. Keep both the goal and your safety in view.",
"A guard-board on a young bull's horns: great good fortune. Wild force is best restrained before the horns have grown. Prevention at the outset.",
"The tusks of a gelded boar: good fortune. Dangerous force is tamed indirectly, by changing its nature at the root, not by fighting the tusk.",
"Open as the highway of heaven: success. The time of restraint is past. The stored-up energy breaks through and achieves great things."]};
ICX[27]={j:"Nourishment, the jaws: mountain above, thunder below, the shape of an open mouth. Constancy brings good fortune. Watch what nourishes and what a person seeks to put in their own mouth. To know someone, see whom and what they feed, and which part of themselves they cultivate.",
im:"Thunder beneath the mountain. Be careful with your words, and moderate with food and drink. What leaves the mouth and what enters it: restraint at both.",
l:["You set aside your spirit tortoise and gape at me with your jaw hanging: misfortune. You could live free and self-sufficient, and instead you stare with envy at those who seem better off.",
"Seeking food upside-down, straying from the rule to seek it from the hill: going on brings misfortune. Able to provide for yourself, you accept support from above through weakness. It is unworthy and leads nowhere good.",
"Going against nourishment; constancy brings misfortune; for ten years do not act so, nothing helps. Seeking food that does not feed: from craving to gratification and back to craving.",
"Seeking food upside-down: good fortune. The tiger stares intently, its hunger unbroken: no fault. From a high place you look for able helpers in order to do good, not for yourself.",
"Straying from the rule; staying steady brings good fortune; do not cross the great river. Aware of a lack in yourself, you turn to someone wiser. Good, so long as you do not then try great things alone.",
"The source of nourishment: risk, and good fortune; good to cross the great river. A sage from whom nourishment flows, aware of the weight of that. Great and difficult work may be undertaken."]};
ICX[28]={j:"Great excess: the lake rises over the trees. The roof-beam bows. Good to have somewhere to go; success. Too much weight in the middle and too little support at the ends: an exceptional state that cannot last. Find a way through quickly and gently, by understanding the situation. Force would only bring the roof down.",
im:"The lake floods over the trees. Standing alone, be without fear; withdrawing from the world, be without gloom. The tree stands firm in the flood.",
l:["A mat of white rushes laid underneath: no fault. For an exceptional undertaking, exceptional care at the very beginning. It may look excessive. It is not a mistake.",
"An old willow puts out new shoots; an old man gets a young wife: nothing unfavourable. An unusual renewal by turning toward what is below and simple. Growth starts again.",
"The roof-beam bows: misfortune. Someone who insists on pushing ahead and takes no advice. Nobody supports them, and the weight increases.",
"The roof-beam is propped up: good fortune; if there is something else in view, regret. Through good ties with those below you become equal to the situation. Do not turn that support to private advantage.",
"An old willow puts out flowers; an old woman gets a young husband: no fault, no praise. Flowers on a dry tree exhaust it. Renewing ties above while neglecting those below restores nothing.",
"Wading across, the water closes over the head: misfortune, no fault. Some things matter more than life. A person goes on, knowing the cost, and cannot be blamed for it."]};
ICX[29]={j:"The abyss, water doubled: danger upon danger, a ravine with water running through. Hold to sincerity, and the heart gets through; action is honoured. Water sets the example: it flows on without pause, fills every hollow before moving on, and loses none of its nature anywhere. Stay true to yourself in the same way, go through thoroughly, and do not linger in danger.",
im:"Water flowing on and on. Keep virtue constant, and practise teaching. Consistency and repetition: that is how one both learns and teaches.",
l:["Pit within pit; falling into a hollow inside the pit: misfortune. Grown used to danger, one lets it become part of oneself and loses the way.",
"The pit holds danger; seek only small gains. Do not try to get out all at once. Be content for now with not being overcome.",
"Coming and going, pit after pit; danger, and the hold is not firm. Falling into the hollow inside the pit: do not act. Every step leads into danger. Keep still until a way out shows itself.",
"A cup of wine and a bowl of grain, plain earthenware, passed in through the window: in the end no fault. In danger, ceremony falls away. Plain sincerity is enough, and help passes by the shortest way.",
"The pit does not overflow; it is only filled level: no fault. Do not aim too high. Water rises only to the lowest point of the rim and then flows out; take the easiest way.",
"Bound with black cords, set among thorns; for three years no way out: misfortune. Someone lost entirely in extreme danger and tangled in their own faults."]};
ICX[30]={j:"Clinging, radiance, fire doubled: brightness that depends on what it burns. Constancy is favourable; success. Tending a cow brings good fortune. Whatever gives light is conditioned and lasts only by holding to something. Clarity comes from accepting dependence on what is right, and from a docile, receptive mind.",
im:"Light arising twice. The great person, keeping the brightness going, lights up the four directions. Clarity kept alive and handed on.",
l:["Footsteps going every way; attend to them with respect: no fault. Early morning, with impressions crowding in. Keep composure at the very start and the rest follows.",
"Yellow radiance: great good fortune. Midday; the colour of the centre. The highest culture is moderation.",
"The light of the declining sun: not drumming on the jar and singing, but groaning over old age: misfortune. Neither forced gaiety nor lament. Cultivate yourself and accept what comes.",
"Suddenly it arrives, blazes, dies, is cast aside. A brilliance that rises fast and consumes itself. A restless, excitable nature has no lasting effect.",
"Tears streaming, sighing and grieving: good fortune. The summit of life, where one sees the vanity of things. Real change of heart comes from that grief.",
"The king sends him out on campaign; he takes the chief and spares the rank and file: no fault. In correcting, remove the root of the trouble and spare what is merely habit. Too strict a discipline fails."]};
ICX[31]={j:"Influence, mutual attraction: the lake on top of the mountain, the strong placing itself below the gentle. Success; constancy favourable. Taking a wife brings good fortune. A mutual attraction between different natures, steady within and glad without. It keeps within what is right, and so it is courtship and not seduction.",
im:"A lake upon the mountain. Receive others by keeping yourself empty. The mountain is hollow at the top, and so it holds a lake. Keep the mind humble and open to advice.",
l:["Feeling it in the big toe. A stirring before it is real. As long as it has no visible effect, it is neither good nor harmful.",
"Feeling it in the calves: misfortune; staying put brings good fortune. The calf moves only because the foot does. Wait until you are moved by something real.",
"Feeling it in the thighs, clinging to whatever it follows: going on brings regret. Running after every impulse of the heart, or after whoever is being followed. Learn restraint; it is the basis of freedom.",
"Constancy, good fortune, regret vanishes. Restless, going back and forth, only your own friends follow your thinking. The heart. Influence that comes from the whole person works on everyone; calculated influence reaches few and tires you.",
"Feeling it in the back of the neck: no regret. A firm will that does not get confused. But whoever cannot be moved cannot move others much either.",
"Feeling it in the jaws, cheeks and tongue. Mere talk. Nothing stands behind it, and it remains without significance."]};
ICX[32]={j:"Constancy, duration: thunder and wind, each strengthening the other. Success; no fault; steadiness favourable; good to have somewhere to go. Duration is not standing still. It is movement that keeps its own law, like the heavenly bodies, completing one cycle and beginning the next. Change in manner, constancy in direction.",
im:"Thunder with wind. Take your stand and do not shift your course. Mobile like both, and for that very reason constant: the direction is inner.",
l:["Digging deep for permanence; constancy brings misfortune; nothing helps. What lasts is made slowly. Whoever demands too much at once gets nothing.",
"Regret disappears. Strength of character greater than the means at hand. Holding back from excess leaves nothing to regret.",
"Not keeping one's character constant, one may be dealt disgrace; steadiness here brings regret. Moods ruled by hope and fear of the outside world. Trouble arrives from sides one had not thought of.",
"No game in the field. Persisting in seeking in the wrong place. Persistence is not enough; what is not sought rightly is not found.",
"Keeping one's character constant: good fortune for the one who follows, misfortune for the one who must lead. Lifelong adherence to one line is right where following is the task. Where the task is to decide, one must stay flexible and do what the moment requires.",
"Agitation that never settles: misfortune. Perpetual hurry, without inner composure, especially in someone at the top."]};

ICX[33]={j:"Retreat: the mountain under the sky, which draws back out of reach. Success; small constancy is still favourable. The lesser forces are advancing, and withdrawing in good time is the strong move, not a defeat. It is done deliberately and from strength, without hatred, and it is different from running away. From the new distance, small things can still be done.",
im:"A mountain beneath the sky. Keep petty people at a distance, not with hostility but with reserve. Dignity is the barrier; hostility would only tie you to them.",
l:["Retreating at the tail: danger; do not go anywhere. You are the last to withdraw and closest to what pursues. Keep still and attempt nothing.",
"Bound with the hide of a yellow ox, so that nothing can loosen it. Someone holds to what is right, or to a person above them, with a will so firm that they reach what they seek.",
"A retreat that is tied up: illness and danger. Keeping servants and maids brings good fortune. You are held back by people who depend on you. Keeping them on your own terms is the way through, but nothing great can be done with them.",
"Retreat by choice: good fortune for the noble person, ruin for the petty one. Leaving on friendly terms and without inner struggle. The one who suffers is the one left behind.",
"A graceful retreat; constancy, good fortune. You see the right moment and leave courteously, without argument. Stay firm and do not be talked out of it.",
"A free and easy retreat: nothing unfavourable. Complete inner detachment. No doubt remains about leaving, and the road is open."]};
ICX[34]={j:"Great strength: thunder up in the sky. Constancy is favourable. Great strength moving upward, with the time behind it. The only question is whether it stays joined to what is right. Power that parts from justice is only force.",
im:"Thunder above heaven. Do not take any step that is not in keeping with propriety. True greatness shows in mastery of oneself.",
l:["Strength in the toes; marching on brings misfortune, surely. Advancing by force from a low position, on strength alone.",
"Constancy brings good fortune. The gates are opening and resistance gives way. This is the moment for quiet steadiness, not exuberance.",
"The petty person uses strength; the noble person uses it as if it were nothing. A ram charging a fence tangles its horns. Showing strength entangles you. Know that you have it and leave it unused.",
"Constancy, good fortune, regret vanishes. The fence gives way and does not catch; strength lies in the axle of a great cart. Quiet, continuous work removes obstacles. The less the force shows, the greater its effect.",
"Losing the ram at the border: no regret. The hard, butting attitude is no longer needed; you can let it go without loss.",
"The ram has charged the fence and can go neither back nor forward; nothing helps. Hardship recognised brings good fortune. Having pushed too far, you are stuck. Recognise it and stop struggling; the knot loosens."]};
ICX[35]={j:"Advance: the bright sun climbing out of the earth. A lord who brings peace is given many horses and received three times in a day. Easy, swift progress, in which someone capable serves a clear-sighted leader and is recognised for it. The light is your own; the rise depends on staying attached to what is greater than you.",
im:"Light emerging above the earth. Make your own bright virtue shine. The light is there by nature; it only needs to be kept clear of what clouds it.",
l:["Advancing and being held back; constancy, good fortune. Not trusted? Stay open-handed: no fault. Do not try to force confidence; keep doing what is right.",
"Advancing, but sorrowfully; constancy, good fortune. A great blessing will come from the grandmother. Kept from the person you need to reach. Stay steady; recognition comes, warmly and deservedly.",
"All agree: regret vanishes. You advance with others and by their support. It is no shame that you could not have done it alone.",
"Advancing like a rat; constancy is dangerous. Accumulating in a high place by doubtful means. Such things always come to light.",
"Regret vanishes; do not worry about losing or gaining. Going forward brings good fortune; nothing unfavourable. In a strong position, gentle and reserved. You may miss some advantage. It does not matter.",
"Advancing with the horns, only to subdue one's own town: danger, good fortune, no fault; constancy brings regret. Aggressive energy is right only toward your own errors and those of your own people."]};
ICX[36]={j:"Brightness hidden: the sun has gone down into the earth. In hardship, constancy is favourable. Someone of dark nature holds power and can harm the capable. Do not be swept along, and do not provoke. Keep your light inside, covered, and be yielding outwardly. Inner clarity with outward reserve gets through the worst.",
im:"The light has entered the earth. Live among the many, keep your brightness veiled, and it still shines. Do not try to know everything about others or expose their faults; let much pass.",
l:["The bright bird in flight droops its wings. On the road three days without eating; there is somewhere to go, and the hosts make remarks. You try to rise above the obstacle, meet hostility, and withdraw. Staying true costs comfort and draws talk.",
"Brightness hidden, wounded in the left thigh; rescued by a strong horse: good fortune. Hurt but not disabled. You think of the others in danger and do all you can for them.",
"Brightness hidden on a hunt in the south: the great chief is taken. Do not be hasty in setting things right. As if by chance, the one behind the disorder falls into your hands. Old habits still cannot be undone at once.",
"Entering the left side of the belly, one grasps the heart of the darkness, and leaves by the gate. Seen from close by, there is no hope of improvement. That knowledge lets you leave before the storm breaks.",
"Brightness hidden, as with the Prince of Ji: constancy is favourable. You cannot leave your post. With unbreakable firmness inside and doubled caution outside, even feigning incomprehension, you keep your conviction intact.",
"No light, only gloom. First it rose to the sky, then it went down into the earth. The darkness reaches its peak and consumes itself. What wounded so many falls by its own nature."]};
ICX[37]={j:"The household: wind arising from fire, influence that spreads outward from a warm centre. Constancy of the woman is favourable. The household rests on each person truly filling their own place, and on loyalty and care at its centre. What holds here holds in any community: order begins at home and works outward.",
im:"Wind coming out of fire. Let your words have substance and your conduct have constancy. Words carry only when they rest on something real and are borne out by what you do.",
l:["Setting boundaries within the household: regret vanishes. Clear order from the beginning, before habits form. Rules set early spare regret later.",
"Not pursuing anything; at the centre, preparing the food. Constancy, good fortune. Staying at the centre and doing what is in front of you, without reaching for anything by force.",
"In the household, harsh scolding: regret and danger, yet good fortune. Wife and children giggling and frivolous: in the end, regret. Between strictness and indulgence, strictness is the safer error.",
"Enriching the household: great good fortune. The one who keeps income and expense in balance: the well-being of the whole depends on that faithful stewardship.",
"The king reaches out to his household; do not worry: good fortune. A generous, large-hearted head of the house. People govern themselves out of affection, not fear.",
"Trustworthy and commanding respect: in the end good fortune. Order in a household rests finally on the character of the one responsible. Take that on willingly."]};
ICX[38]={j:"Opposition, estrangement: fire above moves up, the lake below moves down. In small matters, good fortune. People are estranged and wills diverge, so no great common work is possible. Proceed gently in small things, and do not make it worse by being brusque. Opposition is also useful: it is what makes things distinct, and the ground on which they can meet.",
im:"Fire over the lake. Be one with others while remaining distinct. Be with people without being absorbed by them.",
l:["Regret vanishes. A lost horse: do not chase it; it comes back by itself. Meet the hostile person, and no fault. Do not run after what belongs with you, and do not drive away what does not. Both resolve themselves.",
"Meeting the lord in an alley: no fault. Misunderstanding has made a proper meeting impossible. An informal, accidental one does the work.",
"The cart is dragged, the ox held back; the driver is branded and his nose cut. No good start, but a good finish. Everything seems to conspire against you. Hold to the one you know you belong with, and it ends well.",
"Estranged and alone, one meets a good companion and they trust each other: danger, no fault. Trust between two people overcomes the isolation.",
"Regret vanishes. The kinsman bites through the skin; going to him, what fault could there be? You fail at first to recognise a sincere friend through the general estrangement. They break through it. Go to meet them.",
"Estranged and alone, one sees a pig caked in mud, a cart loaded with ghosts. First the bow is drawn, then set down. Not a raider; a suitor. Going on, one meets rain: good fortune. Mistrust has distorted your view of your best friend. The tension breaks as rain breaks sultry weather, and the misunderstanding ends."]};
ICX[39]={j:"Obstruction: dangerous water ahead, a steep mountain behind. The south-west is favourable, the north-east is not. It helps to see a great person; constancy brings good fortune. An obstacle that cannot be met head-on. Pull back, join with friends, and put yourself under the guidance of someone equal to the situation. Difficulty that turns you inward is of real use.",
im:"Water upon the mountain. Turn back to yourself and cultivate virtue. The ordinary person blames circumstances. Look for the error within, and the obstacle becomes a means of growth.",
l:["Going leads into difficulty; coming back earns praise. At the first sight of the obstacle, do not push blindly on. Step back and wait for the right moment.",
"The king's minister meets obstacle after obstacle, and not for his own sake. Normally one avoids the obstacle. Here duty requires going straight at it for another's sake, and no fault attaches.",
"Going leads into difficulty; he comes back home. Others depend on you. Do not plunge into danger alone. Returning is welcomed by those who belong to you.",
"Going leads into difficulty; coming back, he finds allies. You could not manage it alone. Hold back and gather people you can trust.",
"In great difficulty, friends arrive. The one called on in an emergency does not avoid it. Their spirit draws helpers, and together they overcome it.",
"Going leads into difficulty; coming back brings great good fortune; it helps to see a great person. Someone who has left the world is called back by its trouble. Their experience and inner freedom bring something great to completion."]};
ICX[40]={j:"Release: thunder and rain, and the tension breaks. The south-west is favourable. If nothing remains to be done, coming back brings good fortune; if something remains, acting early brings good fortune. The knot is coming undone. Return to ordinary life as soon as you can, and do not push the victory further than needed. What remains to be settled, settle quickly.",
im:"Thunder and rain arrive. Pardon errors and be lenient with offences. A storm clears the air. Do not dwell on faults: let errors go, and even what was deliberate.",
l:["No fault. The obstruction is past. Few words: rest and recover in the quiet.",
"Taking three foxes on the hunt, and gaining a yellow arrow; constancy, good fortune. The sly flatterers are removed. The means are measure and straightness, not excess.",
"Carrying a load on one's back while riding in a carriage invites robbers; constancy brings regret. Risen out of need into ease, someone settles comfortably into a position that does not suit their nature.",
"Untie your big toe; a friend arrives, and then there is trust. Inferior people attach themselves in hard times and become almost indispensable. Free yourself from them, or those who share your aims will stay away.",
"Only the noble person can release it: good fortune; it proves sincere even to petty people. Release needs an inner resolve. Breaking with what is inferior in your mind is enough; they see it and withdraw.",
"The lord shoots a falcon on top of the high wall and takes it: nothing unfavourable. A powerful obstacle in a high place remains. Prepared, with the means ready, you remove it at the right moment."]};
ICX[41]={j:"Decrease: the lake below the mountain gives up its water to what is above. With sincerity, great good fortune and no fault; one can hold to it and there is somewhere to go. How should it be done? Two simple bowls are enough for the offering. A time of less. There is nothing shameful in it. Simplicity is exactly right, and inner truth makes up for what is lacking outwardly.",
im:"The lake beneath the mountain. Curb anger and hold desire in check. What is to be reduced: the passions that waste strength.",
l:["Leaving promptly once the work is done: no fault. Consider how much to take from others. Help selflessly, then leave without fuss. The one helped must consider how much to accept.",
"Constancy is favourable; marching out brings misfortune. Benefit others without diminishing yourself. Serve without throwing yourself away. Giving up your dignity for another's sake helps nobody.",
"Three travelling together lose one; one travelling alone finds a friend. Three is one too many for closeness; the one who is alone finds their complement.",
"Lessening one's ailment lets the other come quickly with gladness: no fault. Your failings keep well-meaning people away. Reduce them, and people come to you gladly.",
