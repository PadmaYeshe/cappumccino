ICX_PT[4]={j:"Inexperiência juvenil: uma nascente ao pé da montanha, que ainda não sabe para onde correrá. A inexperiência não é falta e pode ter êxito, se buscar um mestre com a atitude certa. O mestre não corre atrás do discípulo; o discípulo vem. A primeira pergunta sincera recebe uma resposta clara. Perguntar de novo e de novo, por dúvida ou por querer outra resposta, é desrespeito e não recebe nenhuma. A constância, no aprender e no ensinar, é favorável.",
im:"Uma nascente brota sob a montanha. Ela só escapa da estagnação seguindo adiante e enchendo cada cavidade do caminho. Do mesmo modo, o caráter se forma fazendo tudo com cuidado, sem pular nada.",
l:["Abrir o que ainda não tem forma: ajuda aplicar disciplina, e depois tirar os grilhões. Limites claros, levados a sério. A disciplina que vira mero adestramento e dura demais traz arrependimento.",
"Suportar com paciência os inexperientes traz boa fortuna. Força por dentro, brandura por fora; receber o que é mais fraco sem desprezo. Alguém assim pode carregar responsabilidade real, como um filho capaz de dirigir a casa.",
"Não tome uma mulher que, ao ver um homem rico, perde o domínio de si. Advertência contra lançar-se ao que parece forte ou rico, ou aceitar quem o faz. Nada de bom resulta disso.",
"Cercado pela ignorância: arrependimento. Apegar-se teimosamente a fantasias distantes do real. Às vezes o único mestre que resta é sentir as consequências.",
"Abertura infantil: boa fortuna. Quem, mesmo numa posição elevada, busca instrução com mente simples e aberta será certamente ajudado.",
"Golpear a ignorância: não ajuda agir como salteador; ajuda afastar os salteadores. A correção às vezes é necessária para quem não quer aprender, mas deve ser objetiva e limitar-se a deter o excesso. Nunca com raiva."]};
ICX_PT[5]={j:"A espera: nuvens sobem ao céu, e a chuva virá quando vier. Se você é digno de confiança, interiormente certo do objetivo e honesto sobre como as coisas estão, há clareza e êxito. A constância traz boa fortuna, e então é certo atravessar o grande rio: o passo decisivo pode ser dado depois de a espera ter sido bem feita.",
im:"Nuvens subindo ao céu. Coma, beba, mantenha-se alegre e tranquilo. Não interfira no que está amadurecendo; fortaleça corpo e mente para estar pronto.",
l:["Esperar no campo aberto; é bom manter o habitual. Siga a vida comum tanto quanto possível e não gaste forças com preocupações antecipadas.",
"Esperar no banco de areia; algumas palavras de censura, no fim boa fortuna. O perigo está mais perto e há certo atrito. Mantenha a calma e não responda.",
"Esperar na lama atrai os salteadores. Você começou cedo demais e está preso num lugar exposto. Só grande cautela e seriedade evitam o dano.",
"Esperar no sangue; saia do buraco. O perigo é agudo. Nada de forçar: mantenha-se firme, deixe os acontecimentos seguirem seu curso, e você sai disso.",
"Esperar diante do vinho e da comida; constância, boa fortuna. Uma pausa no meio da luta. Aproveite-a e recupere forças, sem perder de vista o objetivo.",
"Dentro do buraco; chegam três hóspedes não convidados. Trate-os com respeito e no fim há boa fortuna. A espera parece ter falhado, e então a ajuda vem de uma forma que você não esperava. Reconheça-a e acolha-a."]};
ICX_PT[6]={j:"O conflito: o céu sobe, a água desce, e os dois se afastam. Você é sincero e mesmo assim encontra obstrução. Parar a meio caminho, com cautela, traz boa fortuna; levar a disputa até o amargo fim traz infortúnio, mesmo que você tenha razão. Ajuda ver uma grande pessoa, um árbitro imparcial. Não ajuda atravessar o grande rio: não comece nada arriscado enquanto houver divisão.",
im:"Céu e água seguem caminhos opostos. Em todo empreendimento, pense bem o começo. O conflito se previne na origem, deixando claros direitos e deveres antes de começar.",
l:["Não prolongar o assunto; algumas palavras, no fim boa fortuna. Abandone a disputa enquanto ainda é pequena.",
"Sem poder vencer, volta-se e retira-se para casa. Recuar diante de um adversário mais forte não é desonra, e poupa os que estão ao seu redor.",
"Viver do mérito antigo; constância no perigo, no fim boa fortuna. Mantenha-se no que você ganhou honestamente, sem reclamar mais. Se trabalha para outro, não busque o prestígio.",
"Sem poder vencer, volta-se ao que é adequado, muda de rumo e encontra paz na constância. Desistir de uma luta que talvez pudesse vencer, porque não é justa: boa fortuna.",
"Apresentar a causa: grande boa fortuna. Aqui o juiz é forte e justo. Se você tem razão, a questão pode ser levada com segurança a tal árbitro.",
"Talvez se receba uma faixa de honra, e três vezes antes do fim da manhã ela é retirada. O que se ganha lutando até o fim não dura; o conflito simplesmente continua."]};
ICX_PT[7]={j:"O exército: água contida na terra, força armazenada na massa das pessoas. Um esforço coletivo precisa de disciplina e de uma pessoa forte e madura no centro, que tenha a confiança dos de cima e a afeição dos de baixo. Com isso, boa fortuna e nenhuma falta. A força deve ter causa justa e comando claro.",
im:"Água dentro da terra. Aumente o número dos que o apoiam pela generosidade para com as pessoas. A força de que você precisará em tempos difíceis se constrói na paz, cuidando daqueles de quem você depende.",
l:["As tropas saem segundo a regra; sem boa ordem, infortúnio. Antes de tudo: causa justa e organização adequada.",
"No meio das tropas: boa fortuna, nenhuma falta; o rei concede honras três vezes. Quem lidera partilha a sorte dos liderados, e é reconhecido pelos de cima.",
"As tropas talvez tragam mortos na carroça: infortúnio. O comando tomado por quem não está apto, ou por cabeças demais, leva à derrota.",
"As tropas acampam à esquerda: nenhuma falta. Diante de uma força superior, uma retirada ordenada é simplesmente correta.",
"Há caça nos campos: é bom apanhá-la, nenhuma falta. A invasão é real e a ação se justifica. Deixe a pessoa experiente liderar; se os inexperientes assumirem, vira carnificina.",
"O grande soberano dá encargos: fundar estados, estabelecer casas. Não use pessoas mesquinhas. O esforço teve êxito e as recompensas são devidas, mas na nova ordem não dê poder aos indignos."]};
ICX_PT[8]={j:"A união: água sobre a terra, confluindo onde pode. A união traz boa fortuna. Mas consulte de novo, isto é, pergunte-se honestamente se você tem a largueza, a constância e a firmeza para ser um centro para os outros. Se sim, nenhuma falta. Os inseguros vêm aos poucos. Quem chega tarde demais encontra infortúnio: há um momento certo para unir-se, e ele passa.",
im:"Água sobre a terra. Os antigos reis fundaram estados distintos e mantiveram laços estreitos com seus senhores. Cada parte conserva seu caráter, e todas são unidas por um interesse comum.",
l:["Una-se com confiança: nenhuma falta. Confiança que enche um jarro de barro, e no fim a boa fortuna vem de outro lugar. A sinceridade importa mais do que a forma.",
"União vinda de dentro; constância, boa fortuna. Responda a partir da própria convicção, sem buscar favores nem se perder.",
"União com as pessoas erradas. Cuidado com a companhia a que você se liga.",
"União também exterior; constância, boa fortuna. Aqui é certo mostrar abertamente a sua adesão a quem está no centro.",
"União às claras. O rei caça com batedores só em três lados e deixa a caça da frente ir livre; seu povo não precisa de advertência. Vem quem quer vir; ninguém é forçado nem cortejado.",
"União sem cabeça: infortúnio. Sem um começo certo não há fim certo. Quem continua hesitando em comprometer-se perde o momento."]};
ICX_PT[9]={j:"O pequeno contém: vento cruzando o céu, nuvens densas e ainda nenhuma chuva das terras do oeste. Algo forte é contido por algo brando. Há êxito, mas só o que meios pequenos, amáveis e persistentes podem alcançar. O tempo do grande golpe ainda não chegou; prepare-se e não force.",
im:"Vento movendo-se pelo céu. Quando você não pode produzir grandes efeitos no mundo, refine o que está ao seu alcance: maneiras, expressão, os pequenos detalhes da conduta.",
l:["Voltar pelo próprio caminho: que falta poderia haver? Você avançou, encontrou resistência e volta ao caminho que lhe convém. Boa fortuna.",
"Levado a voltar: boa fortuna. Vendo outros como você voltarem, não se expõe sem necessidade.",
"A carroça perde os raios da roda; marido e mulher se olham com raiva. Um avanço forçado na suposição de que o obstáculo era pequeno. Ele fracassa, com uma briga que não honra ninguém.",
"Com confiança, evita-se o sangue e o medo se vai: nenhuma falta. Posição delicada de conselheiro de alguém poderoso. Só a veracidade desinteressada tem peso.",
"Com confiança, unidos; rico junto com o vizinho. Lealdade mútua: cada um completa o que falta ao outro, e a riqueza é partilhada.",
"A chuva veio, as coisas assentam; a virtude se acumulou e é levada adiante. Não exija mais agora: a lua está quase cheia, e ir além traz infortúnio."]};
ICX_PT[10]={j:"A conduta: pisar na cauda do tigre sem ser mordido. Você lida com algo mais forte ou mais perigoso do que você, e pode dar certo, porque o bom humor e a conduta adequada desarmam até os irritadiços. O êxito vem pela maneira: agradável, nunca presunçosa.",
im:"Céu em cima, lago embaixo: uma diferença real de altura que ninguém ressente, porque é verdadeira. Distinga com justiça o alto e o baixo, e a mente das pessoas se aquieta. A posição que corresponde ao valor interior cria ordem.",
l:["Avançar com simplicidade: nenhuma falta. Ainda sem obrigações, você pode seguir sua própria inclinação, sem pedir nada a ninguém. Contente-se com a simplicidade.",
"Caminhar por uma estrada lisa e plana; quem vive à parte é firme e afortunado. Recolhido da agitação, sem desejar nada, sem desafiar ninguém.",
"Caolho, julga que enxerga; coxo, julga que anda: pisa na cauda do tigre e é mordido. Superestimar a própria força e lançar-se sem cuidado. Só se justifica a quem age por uma causa maior.",
"Pisar na cauda do tigre, com cautela e cuidado: no fim boa fortuna. O empreendimento é perigoso, e a força para ele existe, unida à prudência.",
"Pisar com decisão; firme, embora em perigo. Você precisa ser resoluto e também saber que a resolução tem seu risco. Mantenha-se consciente dele.",
"Olhe para trás o caminho percorrido e examine os sinais; se ele se completou, grande boa fortuna. Julgue a obra pelos seus efeitos. Se foram bons, o resultado é bom."]};
ICX_PT[11]={j:"A paz: o céu pôs-se sob a terra, e suas forças se encontram e se misturam. O pequeno parte, o grande chega: boa fortuna e êxito. Tempo de harmonia e florescimento, em que o forte e bom está no centro e o fraco fica sob sua influência, de modo que ambos são servidos.",
im:"Céu e terra em comunhão. O soberano dá forma e completa o curso deles e auxilia o que produzem, para sustentar o povo. A prosperidade precisa de forma: cada coisa em sua estação e lugar.",
l:["Arranque-se um junco e as raízes vêm junto, agrupadas por espécie; partir traz boa fortuna. Em tempos bons, uma pessoa capaz que sai arrasta consigo os que pensam como ela.",
"Acolher o rude, atravessar o rio sem barco, não negligenciar o distante, não formar facções: é-se louvado por andar pelo meio. Ampla tolerância, coragem, atenção ao que está longe e liberdade de partidarismo.",
"Não há planície sem declive, nem ida sem volta. Firme na dificuldade, nenhuma falta. Não se aflija com essa certeza; ainda há boa fortuna a desfrutar. Tudo muda. Lembre-se disso enquanto as coisas vão bem.",
"Descendo esvoaçante, sem contar com a riqueza, junto com os vizinhos; confiando sem precisar de advertências. Em tempos de confiança, o alto e o baixo se encontram com simplicidade, sem cálculo.",
"O rei dá em casamento a irmã mais nova: bênção e grande boa fortuna. Uma união do alto e do baixo em que o de posição mais alta se adapta com modéstia.",
"A muralha desaba de volta no fosso. Não envie as tropas; dê ordens apenas dentro da sua cidade. A virada anunciada chegou. Não resista pela força: mantenha unido o seu círculo e aceite-a."]};
ICX_PT[12]={j:"A estagnação: o céu afasta-se em cima, a terra afunda embaixo, e já não se encontram. O grande parte, o pequeno chega. As pessoas erradas estão no caminho, e não é tempo em que a constância possa prosperar abertamente. A comunicação está cortada e nada cresce do esforço comum. Não se deixe envolver; mantenha-se fiel aos seus princípios e espere.",
im:"Céu e terra sem contato. Recolha-se ao próprio valor para escapar do problema, e não se deixe recompensar com cargos ou rendimentos. Não aceite favores que o comprometam.",
l:["Arranque-se um junco e as raízes vêm junto, agrupadas por espécie; constância, boa fortuna, êxito. Retire-se junto com os que pensam como você.",
"Suportar e acomodar-se: para os pequenos, boa fortuna; para a grande pessoa, estagnação, e êxito por meio dela. Aceite a estagnação sem misturar-se com bajuladores.",
"Carregar a vergonha. Os que subiram por meios tortos começam a sentir por dentro que não estão à altura. Uma primeira virada para melhor.",
"Agir por um mandato: nenhuma falta; os companheiros partilham a bênção. A estagnação se aproxima do fim. Quem é chamado de verdade, e não por si mesmo, pode agir agora.",
"A estagnação cede: boa fortuna para a grande pessoa. 'Ainda pode falhar, ainda pode falhar': amarre-a a um maciço de amoreiras. O cuidado ansioso no momento da transição é o que firma o êxito.",
"A estagnação é derrubada: primeiro parada, depois alegria. Ela não termina por si; é preciso o esforço da pessoa certa para pô-la abaixo."]};
ICX_PT[13]={j:"A comunidade: fogo subindo ao céu. A comunidade em campo aberto traz êxito, e é certo atravessar o grande rio. A verdadeira comunidade repousa em preocupações partilhadas que são universais, não em interesse particular ou panelinha. Precisa de alguém claro por dentro e forte por fora, que mantenha o objetivo à vista.",
im:"Céu e fogo juntos. Organize as pessoas por parentesco e distinga as coisas por suas espécies. Comunidade não é indistinção: tem estrutura, e cada pessoa tem seu lugar.",
l:["Comunidade à porta: nenhuma falta. Um começo às claras, antes que existam acordos particulares. Todos estão em pé de igualdade.",
"Comunidade dentro do clã: arrependimento. Estreitar o vínculo à própria facção, por motivos pessoais.",
"Tropas escondidas no mato, subida ao monte alto; por três anos nada se levanta. Desconfiança: cada um vigia o outro e guarda algo para si. A comunidade vira emboscada, e nada resulta.",
"Sobe-se à muralha, mas não se pode atacar: boa fortuna. A briga está perto, e a dificuldade de lutar o traz de volta ao bom senso. Essa é a parte afortunada.",
"Comunidade: primeiro gritos, depois risos; os grandes exércitos conseguem encontrar-se. Duas pessoas separadas por fora e unidas por dentro. Os obstáculos causam dor e são superados.",
"Comunidade nos arredores: nenhum arrependimento. Unir-se a quem está por perto. Não é a comunidade universal, mas também não há o que lamentar."]};
ICX_PT[14]={j:"Grande posse: fogo alto no céu, iluminando tudo. Êxito fundamental. Uma única linha maleável no lugar de honra sustenta todas as fortes: abundância e poder reunidos pela modéstia e pela clareza. O que se possui assim, possui-se com justiça.",
im:"Fogo no alto do céu. Contenha o que é nocivo, encoraje o que é bom, em harmonia com a ordem benévola do céu. Grandes meios trazem o dever de pôr as coisas em ordem.",
l:["Nenhum trato com o que prejudica: não é falta. Lembre-se da dificuldade e não haverá nenhuma. Riqueza que apenas começa, ainda não testada. Não se torne descuidado nem orgulhoso.",
"Uma grande carroça para levar cargas; há para onde ir, nenhuma falta. Recursos que podem de fato ser movidos e usados, e ajudantes capazes para carregá-los.",
"Um senhor oferece um presente ao Filho do Céu; uma pessoa mesquinha não pode fazê-lo. O que você tem não é só seu; ponha-o a serviço do todo.",
"Não ostentar a própria abundância: nenhuma falta. Entre ricos e poderosos, não compita nem inveje; mantenha os olhos no seu próprio trabalho.",
"Sua confiabilidade encontra resposta; com dignidade: boa fortuna. A sinceridade conquista as pessoas, mas a bondade sozinha convida à insolência. Precisa de dignidade para manter a familiaridade dentro dos limites.",
"Ajuda do céu: boa fortuna, nada desfavorável. No auge da posse, ainda modesto e honrando os sábios. Alguém assim é ajudado de todos os lados."]};
ICX_PT[15]={j:"A modéstia: uma montanha oculta dentro da terra. Traz êxito, e a pessoa nobre leva as coisas até o fim. É lei das coisas que o cheio se esvazie e o modesto se encha; o alto é rebaixado e o baixo elevado. Modéstia não é pensar pouco de si. É não fazer alarde do que se é.",
im:"Uma montanha dentro da terra. Tire de onde há demais e acrescente onde há de menos; pese as coisas e iguale-as. A modéstia na prática é o trabalho de equilibrar.",
l:["Modesto quanto à própria modéstia, a pessoa nobre pode atravessar o grande rio: boa fortuna. Uma tarefa difícil corre bem quando você não faz exigências nem impõe condições.",
"Modéstia que se faz ouvir; constância, boa fortuna. O que está no coração aparece por si nas palavras e nas maneiras, e tem efeito sem obstáculos.",
"Modéstia com mérito real: a pessoa nobre leva até o fim, boa fortuna. Alguém que realiza muito e não se deixa deslumbrar, e por isso mantém o apoio de todos.",
"Nada desfavorável; mostre modéstia na ação. A modéstia não é desculpa para fugir da responsabilidade. Ela se vê no cuidado que você põe no trabalho.",
"Não se enriquecer à custa do vizinho; é bom invadir e submeter, nada desfavorável. Modéstia não é bondade fraca. Quando as coisas estão fora da ordem, aja com firmeza, objetividade e sem ofensa pessoal.",
"Modéstia que se faz ouvir; é bom pôr as tropas em marcha, pôr em ordem a própria cidade e terra. Quando algo está errado, comece disciplinando a si mesmo e ao seu círculo em vez de culpar os outros."]};
ICX_PT[16]={j:"O entusiasmo: o trovão irrompe da terra. É bom nomear ajudantes e pôr as tropas em movimento. Uma linha forte se move e as outras a seguem de bom grado, porque o movimento acompanha a natureza delas, pelo caminho fácil. É assim que as pessoas se reúnem para um empreendimento.",
im:"O trovão rompe do chão. Os antigos reis compunham música para honrar o mérito e a ofereciam ao Altíssimo, com os ancestrais por companhia. O entusiasmo torna-se algo mais quando recebe forma e se une ao sagrado.",
l:["Entusiasmo que se anuncia: infortúnio. Gabar-se das próprias relações a partir de uma posição baixa. O entusiasmo só se justifica quando une as pessoas, nunca como exibição de si.",
"Firme como pedra, sem esperar o fim do dia; constância, boa fortuna. Alguém não deslumbrado pelo clima geral, que vê o primeiro sinal de mudança e age de imediato.",

"O rei o envia em campanha; ele captura o chefe e poupa a tropa: nenhuma falta. Ao corrigir, remova a raiz do problema e poupe o que é mero hábito. Uma disciplina rígida demais fracassa."]};
ICX_PT[31]={j:"A influência, atração mútua: o lago no alto da montanha, o forte pondo-se abaixo do brando. Êxito; a constância é favorável. Tomar esposa traz boa fortuna. Uma atração mútua entre naturezas diferentes, firme por dentro e alegre por fora. Mantém-se dentro do que é correto, e por isso é corte, não sedução.",
im:"Um lago sobre a montanha. Receba os outros mantendo-se vazio. A montanha é côncava no alto, e por isso guarda um lago. Mantenha a mente humilde e aberta ao conselho.",
l:["Sentir no dedão do pé. Um movimento antes de ser real. Enquanto não tem efeito visível, não é bom nem nocivo.",
"Sentir nas panturrilhas: infortúnio; ficar parado traz boa fortuna. A panturrilha só se move porque o pé se move. Espere até ser movido por algo real.",
"Sentir nas coxas, agarrando-se ao que segue: continuar traz arrependimento. Correr atrás de cada impulso do coração, ou de quem está sendo seguido. Aprenda a contenção; ela é a base da liberdade.",
"Constância, boa fortuna, o arrependimento desaparece. Inquieto, indo e vindo, só os seus próprios amigos seguem o seu pensamento. O coração. A influência que vem da pessoa inteira age sobre todos; a influência calculada alcança poucos e cansa.",
"Sentir na nuca: nenhum arrependimento. Uma vontade firme, que não se confunde. Mas quem não pode ser movido também não move muito os outros.",
"Sentir nas mandíbulas, bochechas e língua. Mera conversa. Nada a sustenta, e fica sem importância."]};
ICX_PT[32]={j:"A duração: trovão e vento, cada um fortalecendo o outro. Êxito; nenhuma falta; a firmeza é favorável; é bom ter para onde ir. Duração não é ficar parado. É movimento que segue sua própria lei, como os astros, completando um ciclo e começando o seguinte. Mudança nas maneiras, constância na direção.",
im:"Trovão com vento. Tome posição e não mude de rumo. Móvel como ambos, e por isso mesmo constante: a direção é interior.",
l:["Cavar fundo em busca da permanência; a constância traz infortúnio; nada ajuda. O que dura se faz devagar. Quem exige demais de uma vez não obtém nada.",
"O arrependimento desaparece. A força de caráter é maior do que os meios disponíveis. Abster-se do excesso não deixa nada a lamentar.",
"Quem não mantém constante o caráter pode receber desonra; insistir assim traz arrependimento. Humores governados pela esperança e pelo medo do mundo exterior. Os problemas chegam por lados em que não se pensava.",
"Nenhuma caça no campo. Persistir em buscar no lugar errado. A persistência não basta; o que não se busca do modo certo não se encontra.",
"Manter constante o caráter: boa fortuna para quem segue, infortúnio para quem deve liderar. Aderir a uma única linha a vida toda é certo onde a tarefa é seguir. Onde a tarefa é decidir, é preciso flexibilidade e fazer o que o momento pede.",
"Agitação que nunca assenta: infortúnio. Pressa perpétua, sem compostura interior, sobretudo em quem está no topo."]};

ICX_PT[33]={j:"A retirada: a montanha sob o céu, que se afasta fora de alcance. Êxito; uma pequena constância ainda é favorável. As forças inferiores avançam, e retirar-se a tempo é o gesto forte, não uma derrota. Faz-se deliberadamente e a partir da força, sem ódio, e é diferente de fugir. Da nova distância, coisas pequenas ainda podem ser feitas.",
im:"Uma montanha sob o céu. Mantenha as pessoas mesquinhas à distância, não com hostilidade, mas com reserva. A dignidade é a barreira; a hostilidade só o prenderia a elas.",
l:["Retirar-se na cauda: perigo; não vá a lugar nenhum. Você é o último a sair e o mais próximo de quem persegue. Fique quieto e não tente nada.",
"Amarrado com couro de boi amarelo, de modo que nada o solta. Alguém se apega ao que é correto, ou a uma pessoa acima de si, com vontade tão firme que alcança o que busca.",
"Uma retirada amarrada: doença e perigo. Manter servos e criadas traz boa fortuna. Você é retido por pessoas que dependem de você. Mantê-las nos seus próprios termos é a saída, mas nada de grande se faz com elas.",
"Retirada por escolha: boa fortuna para a pessoa nobre, ruína para a mesquinha. Partir em bons termos e sem luta interior. Quem sofre é quem fica.",
"Uma retirada elegante; constância, boa fortuna. Você vê o momento certo e parte com cortesia, sem discussão. Mantenha-se firme e não se deixe dissuadir.",
"Uma retirada livre e serena: nada desfavorável. Desapego interior completo. Não resta dúvida sobre partir, e o caminho está aberto."]};
ICX_PT[34]={j:"O poder do grande: trovão no alto do céu. A constância é favorável. Grande força movendo-se para cima, com o tempo a seu favor. A única questão é se ela permanece unida ao que é justo. O poder que se separa da justiça é só força bruta.",
im:"Trovão acima do céu. Não dê nenhum passo que não esteja de acordo com o que é adequado. A verdadeira grandeza se mostra no domínio de si.",
l:["Força nos dedos dos pés; avançar traz infortúnio, com certeza. Avançar pela força a partir de uma posição baixa, só com a força.",
"A constância traz boa fortuna. Os portões se abrem e a resistência cede. É o momento de firmeza tranquila, não de exuberância.",
"O mesquinho usa a força; a pessoa nobre a usa como se não fosse nada. Um carneiro que investe contra a cerca prende os chifres. Mostrar a força o enreda. Saiba que a tem e deixe-a sem uso.",
"Constância, boa fortuna, o arrependimento desaparece. A cerca cede e não prende; a força está no eixo de uma grande carroça. O trabalho tranquilo e contínuo remove os obstáculos. Quanto menos a força aparece, maior seu efeito.",
"Perder o carneiro na fronteira: nenhum arrependimento. A atitude dura e agressiva já não é necessária; você pode deixá-la ir sem perda.",
"O carneiro investiu contra a cerca e não pode ir nem para trás nem para frente; nada ajuda. Reconhecer a dificuldade traz boa fortuna. Tendo ido longe demais, você está preso. Reconheça e pare de lutar; o nó se desfaz."]};
ICX_PT[35]={j:"O progresso: o sol claro subindo da terra. Um senhor que traz a paz recebe muitos cavalos e é recebido três vezes num só dia. Progresso fácil e rápido, em que alguém capaz serve a um líder lúcido e é reconhecido por isso. A luz é sua; a ascensão depende de permanecer ligado ao que é maior do que você.",
im:"A luz surgindo sobre a terra. Faça brilhar a sua própria virtude luminosa. A luz existe por natureza; só precisa ser mantida livre do que a obscurece.",
l:["Avançar e ser contido; constância, boa fortuna. Sem confiança? Mantenha-se generoso: nenhuma falta. Não tente forçar a confiança; continue fazendo o que é certo.",
"Avançar, mas com tristeza; constância, boa fortuna. Uma grande bênção virá da avó. Impedido de chegar a quem você precisa alcançar. Mantenha-se firme; o reconhecimento vem, caloroso e merecido.",
"Todos concordam: o arrependimento desaparece. Você avança com os outros e pelo apoio deles. Não é vergonha não ter conseguido sozinho.",
"Avançar como um rato; a constância é perigosa. Acumular num lugar elevado por meios duvidosos. Essas coisas sempre vêm à tona.",
"O arrependimento desaparece; não se preocupe com perder ou ganhar. Avançar traz boa fortuna; nada desfavorável. Numa posição forte, brando e reservado. Você pode perder alguma vantagem. Não importa.",
"Avançar com os chifres, só para disciplinar a própria cidade: perigo, boa fortuna, nenhuma falta; insistir traz arrependimento. A energia agressiva só é certa contra os próprios erros e os da própria gente."]};
ICX_PT[36]={j:"Obscurecimento da luz: o sol desceu para dentro da terra. Na dificuldade, a constância é favorável. Alguém de natureza sombria detém o poder e pode prejudicar os capazes. Não se deixe arrastar e não provoque. Guarde a sua luz por dentro, coberta, e seja maleável por fora. Clareza interior com reserva exterior atravessa o pior.",
im:"A luz entrou na terra. Viva no meio de muitos, mantenha o seu brilho velado, e ele ainda assim brilha. Não tente saber tudo dos outros nem expor suas faltas; deixe passar muita coisa.",
l:["A ave luminosa em voo baixa as asas. Três dias na estrada sem comer; há para onde ir, e os anfitriões fazem comentários. Você tenta elevar-se acima do obstáculo, encontra hostilidade e se retira. Manter-se fiel custa conforto e atrai falatório.",
"Luz obscurecida, ferido na coxa esquerda; socorrido por um cavalo forte: boa fortuna. Ferido, mas não incapacitado. Você pensa nos outros em perigo e faz tudo o que pode por eles.",
"Luz obscurecida numa caçada ao sul: o grande chefe é capturado. Não se apresse em pôr tudo em ordem. Como por acaso, quem está por trás da desordem cai em suas mãos. Velhos hábitos, porém, não se desfazem de uma vez.",
"Entrando pelo lado esquerdo do ventre, apreende-se o coração das trevas e sai-se pela porta. Visto de perto, não há esperança de melhora. Esse conhecimento permite partir antes que a tempestade caia.",
"Luz obscurecida, como a do Príncipe de Ji: a constância é favorável. Você não pode deixar o seu posto. Com firmeza inquebrantável por dentro e cautela redobrada por fora, chegando a fingir não entender, você mantém intacta a sua convicção.",
"Nenhuma luz, só escuridão. Primeiro subiu ao céu, depois desceu para dentro da terra. A escuridão chega ao auge e se consome. O que feriu tantos cai por sua própria natureza."]};
ICX_PT[37]={j:"A família: vento que nasce do fogo, influência que se espalha a partir de um centro aquecido. A constância da mulher é favorável. A casa repousa em que cada um ocupe de fato o seu lugar, e na lealdade e no cuidado em seu centro. O que vale aqui vale para qualquer comunidade: a ordem começa em casa e se estende para fora.",
im:"Vento saindo do fogo. Que suas palavras tenham substância e sua conduta, constância. As palavras só têm peso quando repousam em algo real e são confirmadas pelo que você faz.",
l:["Estabelecer limites dentro de casa: o arrependimento desaparece. Ordem clara desde o início, antes que os hábitos se formem. Regras postas cedo poupam arrependimentos depois.",
"Sem buscar nada; no centro, preparando a comida. Constância, boa fortuna. Ficar no centro e fazer o que está diante de você, sem buscar nada pela força.",
"Em casa, repreensões duras: arrependimento e perigo, e no entanto boa fortuna. Mulher e filhos rindo e frívolos: no fim, arrependimento. Entre severidade e indulgência, a severidade é o erro mais seguro.",
"Enriquecer a casa: grande boa fortuna. Quem mantém em equilíbrio entradas e saídas: o bem-estar do todo depende dessa administração fiel.",
"O rei se aproxima da sua família; não tema: boa fortuna. Um chefe de casa generoso e magnânimo. As pessoas se governam por afeição, não por medo.",
"Digno de confiança e inspirando respeito: no fim boa fortuna. A ordem de uma casa repousa, por fim, no caráter de quem é responsável. Assuma isso de bom grado."]};
ICX_PT[38]={j:"A oposição, o estranhamento: o fogo em cima sobe, o lago embaixo desce. Em coisas pequenas, boa fortuna. As pessoas estão afastadas e as vontades divergem, por isso nenhuma grande obra comum é possível. Proceda com brandura em coisas pequenas e não piore a situação sendo brusco. A oposição também é útil: é o que torna as coisas distintas, e o chão em que podem se encontrar.",
im:"Fogo sobre o lago. Esteja unido aos outros e continue distinto. Esteja com as pessoas sem ser absorvido por elas.",
l:["O arrependimento desaparece. Um cavalo perdido: não corra atrás dele; volta sozinho. Encontre a pessoa hostil, e nenhuma falta. Não persiga o que lhe pertence e não afaste o que não lhe pertence. Ambos se resolvem.",
"Encontrar o senhor num beco: nenhuma falta. Um mal-entendido tornou impossível um encontro formal. Um encontro informal, por acaso, resolve.",
"A carroça é arrastada, o boi é detido; o condutor é marcado e tem o nariz cortado. Nenhum bom começo, mas um bom fim. Tudo parece conspirar contra você. Mantenha-se junto de quem você sabe que lhe pertence, e termina bem.",
"Afastado e só, encontra-se um bom companheiro e confiam um no outro: perigo, nenhuma falta. A confiança entre duas pessoas supera o isolamento.",
"O arrependimento desaparece. O parente morde através da pele; indo até ele, que falta poderia haver? A princípio você não reconhece um amigo sincero por causa do estranhamento geral. Ele o atravessa. Vá ao seu encontro.",
"Afastado e só, vê-se um porco coberto de lama, uma carroça cheia de fantasmas. Primeiro arma-se o arco, depois ele é abaixado. Não é salteador; é pretendente. Seguindo, encontra-se a chuva: boa fortuna. A desconfiança deformou a sua visão do melhor amigo. A tensão se desfaz como a chuva desfaz o tempo abafado, e o mal-entendido termina."]};
ICX_PT[39]={j:"O obstáculo: água perigosa à frente, montanha íngreme atrás. O sudoeste é favorável, o nordeste não. Ajuda ver uma grande pessoa; a constância traz boa fortuna. Um obstáculo que não se pode enfrentar de frente. Recue, una-se aos amigos e ponha-se sob a orientação de alguém à altura da situação. A dificuldade que o volta para dentro tem verdadeira utilidade.",
im:"Água sobre a montanha. Volte-se para si mesmo e cultive a virtude. A pessoa comum culpa as circunstâncias. Procure o erro dentro de você, e o obstáculo se torna meio de crescimento.",
l:["Ir leva à dificuldade; voltar traz louvor. Ao primeiro sinal do obstáculo, não avance às cegas. Recue e espere o momento certo.",
"O ministro do rei encontra obstáculo após obstáculo, e não por causa de si. Normalmente se evita o obstáculo. Aqui o dever exige ir direto a ele, por causa de outro, e nenhuma falta se atribui.",
"Ir leva à dificuldade; ele volta para casa. Outros dependem de você. Não se lance sozinho ao perigo. A volta é bem recebida pelos que lhe pertencem.",
"Ir leva à dificuldade; voltando, encontra aliados. Você não conseguiria sozinho. Contenha-se e reúna pessoas em quem possa confiar.",
"Na grande dificuldade, chegam amigos. Quem é chamado numa emergência não a evita. Seu ânimo atrai ajudantes, e juntos superam o obstáculo.",
"Ir leva à dificuldade; voltar traz grande boa fortuna; ajuda ver uma grande pessoa. Alguém que deixara o mundo é chamado de volta pelos problemas dele. Sua experiência e liberdade interior levam algo grande à conclusão."]};
ICX_PT[40]={j:"A libertação: trovão e chuva, e a tensão se desfaz. O sudoeste é favorável. Se nada resta a fazer, voltar traz boa fortuna; se algo resta, agir cedo traz boa fortuna. O nó está se desatando. Volte à vida normal assim que puder e não leve a vitória além do necessário. O que falta resolver, resolva depressa.",
im:"Chegam o trovão e a chuva. Perdoe os erros e seja indulgente com as ofensas. A tempestade limpa o ar. Não se demore nas faltas: deixe passar os erros, e até o que foi deliberado.",
l:["Nenhuma falta. O obstáculo passou. Poucas palavras: descanse e recupere-se no silêncio.",
"Apanhar três raposas na caçada e ganhar uma flecha amarela; constância, boa fortuna. Os bajuladores astutos são afastados. Os meios são a medida e a retidão, não o excesso.",
"Carregar um fardo nas costas viajando de carruagem atrai ladrões; insistir traz arrependimento. Saído da necessidade para o conforto, alguém se acomoda numa posição que não condiz com a sua natureza.",
"Solte o seu dedão; chega um amigo, e então há confiança. Pessoas inferiores se ligam a nós em tempos difíceis e tornam-se quase indispensáveis. Liberte-se delas, ou os que partilham dos seus objetivos ficarão longe.",
"Só a pessoa nobre pode libertar-se: boa fortuna; mostra-se sincera até aos mesquinhos. A libertação pede uma resolução interior. Romper com o que é inferior na sua mente basta; eles percebem e se retiram.",
"O senhor atira num falcão no alto da muralha e o abate: nada desfavorável. Resta um obstáculo poderoso num lugar alto. Preparado, com os meios à mão, você o remove no momento certo."]};
ICX_PT[41]={j:"A diminuição: o lago sob a montanha cede sua água ao que está acima. Com sinceridade, grande boa fortuna e nenhuma falta; pode-se manter, e há para onde ir. Como fazê-lo? Duas tigelas simples bastam para a oferenda. Tempo de menos. Não há vergonha nisso. A simplicidade é exatamente o certo, e a verdade interior compensa o que falta por fora.",
im:"O lago sob a montanha. Contenha a raiva e refreie o desejo. O que deve ser diminuído: as paixões que desperdiçam a força.",
l:["Partir prontamente assim que a obra está feita: nenhuma falta. Pondere quanto tirar dos outros. Ajude sem interesse e depois parta sem alarde. Quem é ajudado deve ponderar quanto aceitar.",
"A constância é favorável; partir em campanha traz infortúnio. Beneficie os outros sem diminuir a si mesmo. Sirva sem se descartar. Abrir mão da própria dignidade por causa de outro não ajuda ninguém.",
"Três que viajam juntos perdem um; um que viaja só encontra um amigo. Três é um a mais para a intimidade; quem está só encontra o seu complemento.",
"Diminuir a própria doença faz o outro vir depressa e com alegria: nenhuma falta. As suas falhas mantêm afastadas as pessoas bem-intencionadas. Diminua-as, e as pessoas vêm a você com alegria.",
"Talvez alguém acrescente: uma carapaça de tartaruga preciosa que não se pode recusar. Grande boa fortuna. Sorte destinada; nada se opõe e nada há a temer.",
"Acrescentar sem tirar de ninguém: nenhuma falta; constância, boa fortuna; há para onde ir. Ganham-se ajudantes, já não se tem uma casa só sua. Uma bênção que beneficia a todos. O que você ganha é posto a serviço de todos."]};
ICX_PT[42]={j:"O aumento: vento e trovão, cada um amplificando o outro. É bom ter para onde ir; é bom atravessar o grande rio. Os de cima abrem mão de algo pelos de baixo, um sacrifício que fortalece o todo. Esse tempo não dura. Use-o enquanto está aqui, mesmo para coisas difíceis e arriscadas.",
im:"Vento com trovão. Quando vir o bem, vá em sua direção; quando tiver uma falta, mude-a. O aumento mais seguro é o de si mesmo.",
l:["Bom para empreender grandes obras: grande boa fortuna, nenhuma falta. A ajuda de cima lhe dá uma força que você não tinha. Use-a em algo grande e sem interesse próprio.",
"Talvez alguém acrescente: uma carapaça de tartaruga preciosa que não se pode recusar. A constância duradoura traz boa fortuna; o rei faz oferenda ao Soberano do Alto. O aumento verdadeiro vem quando você cria em si as condições para ele: receptivo e amando o bem.",
"Aumento que vem pelo infortúnio: nenhuma falta, se há sinceridade, se se anda pelo meio e se informa o senhor levando uma insígnia de jade. Até a adversidade se torna vantagem para quem age na verdade.",
"Andando pelo meio e informando, o senhor segue; é bom ser a pessoa de confiança para mudar a capital. O intermediário que garante que os benefícios cheguem de fato ao povo. Confiável para os dois lados, e necessário nos grandes empreendimentos.",
"Com um coração verdadeiramente bondoso, não é preciso perguntar: grande boa fortuna. Os outros confiarão na minha bondade. A bondade verdadeira não procura agradecimento, e é reconhecida.",
"Ninguém lhe acrescenta; alguém pode até golpeá-lo. Sua mente não se fixa em nada duradouro: infortúnio. Os de cima que deixam de dar perdem o apoio de todos e ficam expostos."]};
ICX_PT[43]={j:"A resolução, a ruptura: o lago subiu ao céu, e um aguaceiro está para cair. Proclame-o na corte do rei; anuncie com sinceridade, consciente do perigo. Informe a sua própria cidade; não ajuda pegar em armas; ajuda ter para onde ir. Um elemento inferior permanece num lugar alto. Remova-o às claras e com decisão, sem concessões e sem violência: nomeando-o, e começando por si mesmo. Combater o mal diretamente só o enreda nele; a melhor defesa é o progresso firme no bem.",
im:"O lago subiu ao céu. Partilhe a sua riqueza com os de baixo e não descanse sobre os seus méritos. O que só se acumula desaba. Distribua à medida que reúne, e continue examinando-se.",
l:["Força nos dedos dianteiros dos pés; ir sem estar à altura é falta. Ansioso por avançar logo no início, com a resistência ainda forte. Meça primeiro a sua força.",
"Gritos de alarme; homens armados ao entardecer e à noite; não há o que temer. A prontidão é tudo. Quem é vigilante e pensou no que pode vir não se assusta.",
"Força que aparece nas maçãs do rosto: infortúnio. A pessoa nobre está resolvida, anda só, encontra a chuva, fica encharcada e malvista: nenhuma falta. Você mantém um laço com alguém inferior quando todos estão contra ele, e é mal julgado. Fiel a si mesmo, está livre de falta.",
"Nádegas sem pele, caminhar hesitante. Conduzido como um carneiro, o arrependimento sumiria, mas as palavras são ouvidas e não acreditadas. Obstinação inquieta: querer avançar a qualquer custo e ser surdo aos conselhos.",
"Beldroega no jardim: corte-a com decisão; andando pelo meio, nenhuma falta. A erva daninha volta sempre, e está perto de você. Não se deixe desviar.",
"Nenhum grito: no fim infortúnio. A vitória parece ganha e só resta um resquício. Julgá-lo inofensivo é o perigo: do que resta, o mal cresce de novo. Termine a obra."]};
ICX_PT[44]={j:"O encontro: vento sob o céu. Uma mulher de grande força; não a tome em casamento. Algo sombrio, expulso de cima, volta inesperadamente por baixo e se oferece. Parece pequeno e inofensivo, e é por isso que o deixam entrar. Não se prenda a ele. Mas a mesma figura também mostra o que há de bom no encontro: quando dois que se pertencem vão um ao encontro do outro, livres de segundas intenções, grandes coisas se seguem.",
im:"Vento sob o céu. O soberano emite decretos e os faz conhecer nas quatro direções. Uma influência de cima que alcança toda parte, como o vento.",
l:["Preso a um freio de metal: constância, boa fortuna. Seguindo, vê-se infortúnio; um porco magro está fadado a se agitar e a devastar. Uma coisa pequena e inferior se insinuou. Detenha-a agora e com firmeza. Ela não continuará fraca.",
"Peixe no embrulho: nenhuma falta; não deve ser partilhado com hóspedes. Mantenha a coisa contida com brandura, sob seus cuidados, e não deixe que chegue aos outros.",
"Nádegas sem pele, caminhar hesitante: perigo, mas nenhuma grande falta. Tentado a ceder, e felizmente impedido. Indecisão dolorosa; se você a vê com clareza, nenhum erro grave.",
"Nenhum peixe no embrulho: surge o infortúnio. Tendo se mantido distante das pessoas comuns, você não encontra ninguém quando precisa. Obra sua.",
"Folhas de salgueiro envolvendo uma cabaça; uma beleza oculta. Algo cai do céu. Proteger os que estão aos seus cuidados sem ostentação nem sermões, apenas pelo valor interior. O resultado amadurece e cai em suas mãos.",
"Encontrar com os chifres: arrependimento, nenhuma falta. Recolhido do mundo e brusco com o que é inferior. As pessoas acham isso orgulho. Você já não vive no mundo, e pode suportá-lo."]};
ICX_PT[45]={j:"A reunião: o lago acima da terra, a água se juntando. Êxito. O rei vai ao templo dos ancestrais. Ajuda ver uma grande pessoa; êxito, com constância. Grandes oferendas trazem boa fortuna; há para onde ir. As pessoas se reúnem em torno de um centro, e a reunião precisa de alguém recolhido em si mesmo e de uma reverência partilhada. Onde muitos se reúnem, esteja pronto também para o imprevisto.",
im:"O lago sobre a terra. Mantenha em bom estado os instrumentos de defesa, para estar pronto para o imprevisto. Onde as coisas se acumulam, podem surgir conflito e perda. Esteja preparado.",
l:["Uma confiança que não vai até o fim: ora confusão, ora reunião. Chame, e um único aperto de mão a transforma em riso. Não se preocupe; ir não é falta. As pessoas querem unir-se e hesitam. Um chamado ao líder, e a aflição acaba.",
"Ser atraído: boa fortuna, nenhuma falta. Com sinceridade, mesmo uma pequena oferenda de primavera é bem-vinda. Há forças ocultas que reúnem os que se pertencem. Ceda a essa atração.",
"Reunião entre suspiros; nada ajuda. Ir não é falta; pequeno arrependimento. O grupo já está formado e você se sente excluído. Ligue-se a alguém próximo do centro que possa trazê-lo para dentro.",
"Grande boa fortuna: nenhuma falta. Alguém que reúne as pessoas em nome de outro, não em proveito próprio. A obra é coroada de êxito.",
"Reunião com uma posição: nenhuma falta. Alguns ainda não confiam; com constância fundamental e duradoura, o arrependimento desaparece. Alguns vêm só por causa da sua influência. Conquiste a confiança real deles pela dedicação firme à tarefa.",
"Suspiros e choro, lágrimas e soluços: nenhuma falta. Você quis unir-se e foi mal compreendido. A sua dor pode fazer o outro cair em si."]};
ICX_PT[46]={j:"A ascensão: uma árvore crescendo dentro da terra. Êxito fundamental. Vá ver a grande pessoa; não se preocupe. Partir para o sul traz boa fortuna. Uma subida que nasce do esforço e da vontade, pela modéstia e adaptabilidade, não pela força. Não encontra obstrução. Vá ver as pessoas que importam, sem ansiedade, e depois mãos à obra.",
im:"A madeira cresce dentro da terra. Acumule coisas pequenas, pouco a pouco, até que se tornem algo alto e grande. Constante, ininterrupta, contornando os obstáculos.",
l:["Subir, sendo bem recebido: grande boa fortuna. Bem embaixo, com força tirada da raiz, e com a confiança dos de cima.",
"Com sinceridade, mesmo uma pequena oferenda de primavera é bem-vinda: nenhuma falta. Você é forte e um tanto brusco, e não se encaixa bem no ambiente. Como é reto, as pessoas respondem assim mesmo.",
"Subir para uma cidade vazia. Toda obstrução cai e você avança com facilidade. Não é hora de hesitações; aproveite a abertura.",
"O rei faz oferenda no Monte Qi: boa fortuna, nenhuma falta. Você alcança o objetivo: admitido entre os que sustentam as coisas, e com lugar duradouro entre eles.",
"Constância, boa fortuna: subir os degraus. Subindo mais, não deixe que o êxito lhe suba à cabeça. Degrau por degrau, sem pular nenhum.",
"Subir no escuro; é bom manter-se firme sem cessar. O avanço cego só conhece o ir em frente e se esgota. Mantenha-se escrupuloso e coerente para evitar perdas."]};
ICX_PT[47]={j:"A opressão, o esgotamento: o lago secou e nada resta nele. Êxito. Para a grande pessoa, a constância traz boa fortuna e nenhuma falta. As palavras ditas não são acreditadas. Tempo de adversidade em que os fortes são cercados pelos fracos. Quem se mantém alegre sob pressão, curvando-se sem quebrar, sai mais forte. As palavras não conseguem nada agora; seja forte por dentro e econômico no falar.",
im:"Um lago sem água. Dê a vida, se preciso, para cumprir o seu propósito. Quando o destino não pode ser mudado, aceite-o e permaneça fiel a si mesmo.",
l:["Nádegas presas sob um toco nu; entrando num vale escuro, por três anos sem ver ninguém. Entregar-se à adversidade, afundar sob ela. O problema é a cegueira interior.",
"Oprimido em meio ao vinho e à comida; o homem de veste cerimonial vermelha está para chegar. É bom fazer oferendas; partir traz infortúnio, nenhuma falta. Por fora tudo vai bem, e por dentro você está cansado do ordinário. A ajuda vem de cima. Prepare-se por dentro; não aja antes da hora.",
"Oprimido pela rocha, apoiando-se em cardos; ao entrar em casa, a esposa não está: infortúnio. Inquieto e indeciso: batendo contra paredes e apoiando-se em coisas que não sustentam.",
"Vindo devagar, oprimido numa carruagem de bronze: arrependimento, mas chega ao fim. Alguém bem situado quer ajudar os de baixo e é contido pelo próprio círculo. Sua natureza corrige as coisas no fim.",
"Nariz e pés cortados; oprimido pelo homem de veste cerimonial carmesim. Aos poucos há alívio; é bom fazer oferendas. Querendo o bem dos outros e bloqueado por cima e por baixo. Aos poucos as coisas viram. Enquanto isso, compostura e oração.",
"Oprimido por trepadeiras, instável e inquieto. Dizendo 'mover-se traz arrependimento', arrepende-se; partir traz boa fortuna. Laços que se romperiam facilmente. Só o medo deixado por fracassos passados o prende. Decida, e vá."]};
ICX_PT[48]={j:"O poço: a madeira desce até a água e a traz para cima. As cidades podem mudar de lugar; o poço não muda. Nunca se esgota e nunca transborda; as pessoas vão e vêm e tiram dele. Se a corda não chega bem até a água, ou o jarro se quebra pouco antes de chegar à superfície, infortúnio. A fonte inesgotável sob toda forma de vida, a mesma em todas as épocas. Duas coisas são necessárias: descer aos verdadeiros fundamentos, e não ser descuidado no último momento, quando a água já está quase em cima.",
im:"Água sobre a madeira. Encoraje as pessoas no trabalho e incentive-as a ajudar-se mutuamente. O todo se organiza de modo que cada parte sirva às outras, como numa planta.",
l:["Um poço lamacento, impróprio para beber; um poço velho que nenhum animal visita. Alguém que se deixou ir, afundado nas partes baixas da vida. Ninguém mais o procura.",
"Atirar em peixinhos no fundo do poço; o jarro está rachado e vaza. Boas qualidades negligenciadas, em má companhia, até que nada mais se possa fazer com elas.",
"O poço foi limpo, e ninguém bebe: isso entristece o meu coração, pois se poderia tirar dele. Um rei lúcido partilharia a bênção com todos. Há uma pessoa capaz e ela não é aproveitada. Quem sabe disso se entristece.",
"Revestir o poço com tijolos: nenhuma falta. Enquanto se trabalha, o poço não pode ser usado. Tempo de pôr-se em ordem: nada para os outros agora, e mais depois.",
"O poço está límpido; uma fonte fria para beber. Há qualidade real aqui, disponível. Basta tirar dela e pô-la em prática.",
"Tira-se do poço, deixado descoberto; digno de confiança: grande boa fortuna. O poço está aí para todos, e quanto mais pessoas tiram dele, maior a sua riqueza."]};

ICX_PT[49]={j:"A revolução, a muda: fogo dentro do lago, duas forças que se destruiriam mutuamente. Só quando chega o seu dia há confiança. Êxito fundamental, a constância é favorável; o arrependimento desaparece. Uma mudança radical, como o animal que troca de pele. Só se justifica quando é de fato necessária e não resta outro caminho; deve vir no momento certo, ser conduzida por alguém livre de fins egoístas e responder a uma necessidade real. Então as pessoas passam a confiar nela, depois.",
im:"Fogo no meio do lago. Mantenha um calendário exato e torne claras as estações. A mudança tem os seus tempos. Conhecendo-os, você pode preparar-se para o que cada um pede.",
l:["Amarrado firmemente com couro de boi amarelo. É cedo demais para fazer qualquer coisa. Mantenha-se firme, contido, e não tente nada por ora.",
"Quando o dia chega, então mudar; partir traz boa fortuna, nenhuma falta. Todas as reformas foram tentadas. Prepare-se a fundo e então aja, com a pessoa certa à frente.",
"Partir traz infortúnio; a constância é arriscada. Quando o apelo à mudança foi ouvido três vezes, há confiança. Nem se apresse, nem se retraia por mero conservadorismo. Ouça as queixas que voltam sempre e têm fundamento.",
"O arrependimento desaparece; há confiança; mudar o mandato traz boa fortuna. Uma mudança radical exige autoridade interior além da posição exterior. As pessoas só apoiam o que sentem ser justo.",
"A grande pessoa se transforma como um tigre; confia-se nela antes de qualquer consulta. As grandes linhas da mudança são evidentes para todos, como as listras do tigre, e conquistam adesão espontânea.",
"A pessoa nobre se transforma como um leopardo; o mesquinho apenas muda de expressão. Partir traz infortúnio; manter-se firme traz boa fortuna. Depois da grande mudança vêm os pequenos refinamentos. Não force mais: contente-se com o que pode ser alcançado."]};
ICX_PT[50]={j:"O caldeirão: fogo ardendo sobre a madeira, o recipiente em que se cozinha o alimento para os sábios e se oferece ao que é mais elevado. Grande boa fortuna; êxito. Se o poço era a fonte para todos, o caldeirão é a cultura: o que é cru é transformado, e o visível é posto a serviço do invisível. Uma pessoa encontra a sua verdadeira vocação quando a sua obra é oferecida desse modo.",
im:"Fogo sobre a madeira. Ocupe com retidão o seu lugar, e assim firme o seu destino. A vida e o destino em acordo, como a madeira que alimenta a chama.",
l:["O caldeirão virado, os pés para o ar: bom para tirar o que está estragado. Tomar uma segunda esposa por causa de um filho: nenhuma falta. Num tempo de alta cultura, qualquer pessoa de boa vontade pode encontrar lugar, por mais baixo que comece, uma vez livre do que a entope.",
"O caldeirão tem comida. O meu rival está doente e não pode me alcançar: boa fortuna. A realização verdadeira atrai inveja. Fique com a obra em si, e a inveja não o atinge.",
"As alças do caldeirão foram alteradas, e não se pode carregá-lo; a rica carne de faisão fica sem ser comida. Quando vem a chuva, o arrependimento se esvai; no fim, boa fortuna. Bons dons não são reconhecidos nem usados. Se a substância é real, a tensão se resolve.",
"A perna do caldeirão quebra; o cozido do senhor se derrama e o encharca: infortúnio. Tarefa pesada, caráter fraco, pouco saber e ajudantes inaptos. Termina em desonra.",
"O caldeirão tem alças amarelas e argolas de bronze; a constância é favorável. Alguém com autoridade, acessível e modesto, encontra ajudantes fortes e capazes.",
"O caldeirão com vara de jade: grande boa fortuna, tudo favorável. Conselho dado com a dureza e o brilho suave do jade: firme, brando e puro."]};
ICX_PT[51]={j:"O incitar, o trovão dobrado: abalo sobre abalo. Êxito. O trovão vem, há susto, depois risos e conversa. O trovão alarma a terra por cem léguas, e quem faz a oferenda não derrama a concha do vinho ritual. Um susto que vem de algo maior do que nós e faz a pessoa examinar-se. Quem aprendeu a reverência interior permanece composto quando ele irrompe, e a alegria segue o medo.",
im:"Trovão duas vezes. Com temor e tremor, ponha em ordem a sua vida e examine-se. O abalo é aproveitado: para buscar em si o que vai contra o que é correto.",
l:["O trovão vem, há susto, depois risos e conversa: boa fortuna. Você o sente primeiro e mais do que os outros, e depois fica melhor por isso.",
"O trovão vem com perigo; riquezas incontáveis se perdem; sobe-se alto nas colinas. Não corra atrás delas; em sete dias voltam. Uma perda real. Resistir é inútil; recue para o alto. O que é seu volta sem ser procurado.",
"O trovão deixa a pessoa atordoada; se isso a move a agir, nenhum dano. Um golpe do destino que pode paralisar. Deixe que ele o leve a mudar as coisas por dentro.",
"O trovão atolado na lama. O movimento não chega a lugar algum quando não há resistência a combater nem brandura que conquiste: tudo é lento como lama.",
"O trovão vai e vem: perigo, mas nada se perde; há trabalho a fazer. Golpes repetidos, sem pausa. Mantendo-se no centro do movimento, você não perde nada.",
"O trovão deixa a pessoa trêmula, olhando em volta com espanto; avançar traz infortúnio. Atingiu o vizinho, ainda não a si: nenhuma falta, embora haja falatório entre os parentes. Quando o abalo tira de todos a visão clara, fique quieto até a compostura voltar, e retire-se a tempo, mesmo que outros se ressintam."]};
ICX_PT[52]={j:"A quietude, montanha dobrada. Quietas as costas, já não se agarra ao corpo; atravessando o pátio, não se vê quem está nele. Nenhuma falta. Repouso e movimento, cada um a seu tempo. As costas são onde estão os nervos do movimento: quando ficam quietas, o eu inquieto desaparece, e pode-se voltar para o mundo sem ser apanhado em sua luta. Dessa calma nasce a ação correta.",
im:"Montanha sobre montanha. Não deixe que os pensamentos vão além da sua situação. O coração pensa sem parar; mantenha o pensamento no que está de fato à mão.",
l:["Quietude nos dedos dos pés: nenhuma falta; é bom manter-se firme por muito tempo. Parar antes de começar a mover-se, bem no início, quando poucos erros foram cometidos. Mantenha isso com firmeza.",
"Quietude nas panturrilhas; sem poder salvar aquele a quem segue; o coração não está contente. Arrastado por alguém mais forte num rumo errado. Você pode deter-se, e não pode detê-lo.",
"Quietude na cintura, a coluna rígida: perigo; o coração sufoca. Calma forçada. A quietude deve nascer da compostura interior. Imposta com rigidez, ela sufoca.",
"Quietude no tronco: nenhuma falta. O esquecimento de si, o grau mais alto, ainda não foi alcançado, mas os pensamentos e impulsos estão quietos. Está a caminho.",
"Quietude nas mandíbulas; a fala tem ordem; o arrependimento desaparece. Alguém numa situação difícil que fala demais. A reserva dá peso às palavras.",
"Quietude generosa e firme: boa fortuna. Quietude completa: não restrita aos detalhes, mas em repouso no todo. Traz paz e boa fortuna em tudo."]};
ICX_PT[53]={j:"O desenvolvimento, o progresso gradual: uma árvore crescendo numa montanha, devagar, enraizada, visível de longe. O casamento de uma mulher: boa fortuna; a constância é favorável. As coisas que devem durar precisam desdobrar-se passo a passo e na ordem certa, como as formalidades antes de um casamento. A pressa as estragaria. Calma por dentro e adaptabilidade por fora tornam possível um progresso firme. O mesmo vale para qualquer relação que precise crescer, e para toda influência sobre os outros.",
im:"Uma árvore sobre a montanha. Permaneça numa conduta digna, e assim melhore os costumes das pessoas à sua volta. Uma influência desse tipo age aos poucos, pelo peso do próprio caráter.",
l:["Os gansos selvagens avançam por etapas até a margem do rio. O mais novo está em perigo, e há falatório; nenhuma falta. Um primeiro passo, sozinho, sem ninguém para ajudar. Lento e cuidadoso, e criticado por isso. É essa lentidão que o livra do erro.",
"Os gansos selvagens avançam por etapas até a grande rocha; comendo e bebendo satisfeitos: boa fortuna. Um lugar seguro é alcançado, e o primeiro êxito. É partilhado com alegria, não guardado.",
"Os gansos selvagens avançam por etapas até o planalto seco. O marido parte e não volta; a mulher concebe e não dá à luz: infortúnio. Bom para repelir salteadores. Ir longe demais, para um lugar que não lhe convém, forçando as coisas. Não provoque uma luta; mantenha o seu terreno e defenda-o.",
"Os gansos selvagens avançam por etapas até as árvores; talvez um encontre um galho plano: nenhuma falta. Um lugar que não foi feito para você. Sendo sensato e maleável, você encontra nele um canto seguro.",
"Os gansos selvagens avançam por etapas até o alto da colina. Por três anos a mulher não concebe; no fim nada prevalece contra ela: boa fortuna. Numa posição elevada, é fácil ficar isolado, mal compreendido pela própria pessoa de quem se depende. O mal-entendido se desfaz, e vem a união.",
"Os gansos selvagens avançam por etapas até as altas cumeadas; suas penas podem servir na dança ritual: boa fortuna. Uma vida completa. Deixa a terra e permanece como exemplo luminoso para os que olham para ela."]};
ICX_PT[54]={j:"A noiva, a irmã mais nova que se casa: trovão sobre o lago, a mais nova seguindo a mais velha. Partir traz infortúnio; nada é favorável. Uma relação iniciada pela inclinação e a partir de uma posição subordinada, não por direito formal. Tais laços repousam apenas no tato e na afeição. Avançar, reclamar posição ou insistir em direitos agora dá errado. Mantenha à vista o fim duradouro e conserve a reserva.",
im:"Trovão sobre o lago. Tenha em mente o fim distante e saiba o que se desgasta. Todo laço humano pode extraviar-se. Ter presente o propósito duradouro evita os recifes.",
l:["A irmã mais nova casa-se como esposa secundária; coxa, mas capaz de andar; partir traz boa fortuna. Num lugar modesto e subordinado, você ainda pode ser de grande ajuda, adaptando-se com tato.",
"Cega de um olho, mas capaz de ver; boa a constância de quem vive à parte. Decepcionada com aquele a quem se uniu, você mantém a fidelidade sozinha.",
"A irmã mais nova casa-se enquanto espera num lugar humilde; volta e casa-se como esposa secundária. Querer tanto algo que se aceita uma posição abaixo do próprio valor para obtê-lo.",
"A irmã mais nova deixa passar o tempo; um casamento tardio, esperando sua estação. Recusar-se a desperdiçar-se e deixar passar o momento habitual. O que é certo vem, mais tarde.",
"O imperador Yi dá em casamento a irmã mais nova; as mangas da noiva são mais simples que as da sua acompanhante. A lua quase cheia: boa fortuna. Alguém de alta posição que aceita um lugar mais baixo de bom grado, livre de vaidade.",
"A mulher segura um cesto sem nada dentro; o homem corta o carneiro e não sai sangue. Nada é favorável. Forma sem substância: um rito cumprido só pela aparência."]};
ICX_PT[55]={j:"A abundância, a plenitude: trovão e relâmpago chegando juntos, clareza por dentro e movimento por fora. Êxito. O rei a alcança. Não se entristeça; seja digno do sol do meio-dia. Um auge de grandeza e fartura, e por natureza breve. Só alguém interiormente livre de tristeza e de ansiedade pode conduzir tal tempo. Não lamente o declínio que deve seguir-se. Ilumine tudo enquanto dura a hora.",
im:"Trovão e relâmpago chegam juntos. Resolva as disputas e execute as sentenças. Clareza para investigar, e energia para agir conforme o que se encontrou.",
l:["Encontrar o senhor que lhe corresponde; ainda que iguais por dez dias, nenhuma falta; seguir adiante traz honra. Clareza e energia unidas por um ciclo completo. Vá em frente.",
"Uma cortina tão espessa que ao meio-dia se vê a Ursa. Seguir encontra suspeita e antipatia. Com uma confiança que desperta: boa fortuna. Uma intriga se interpôs entre você e quem está no comando. Não force. Mantenha-se na verdade; ela age sem ser vista.",
"Um véu tão denso que ao meio-dia se veem as estrelas pequenas; o braço direito se quebra: nenhuma falta. Um eclipse no seu auge: até os insignificantes avançam. O melhor ajudante é impedido de agir, sem culpa sua.",
"Uma cortina tão espessa que ao meio-dia se vê a Ursa; encontra-se um senhor da mesma índole: boa fortuna. A escuridão já diminui. Energia e sabedoria se encontram.",
"Chega o brilho; há honra e louvor: boa fortuna. Quem está no comando é modesto e aberto ao bom conselho, e por isso se cerca de pessoas que propõem o que deve ser feito.",
"Uma casa grandiosa, a família cercada por muros; espiando pela porta, tudo em silêncio, ninguém; por três anos não se vê ninguém: infortúnio. Pela arrogância e pelo desejo de dominar tudo, alguém termina afastado da sua própria gente, e só."]};
ICX_PT[56]={j:"O viajante: fogo na montanha, seguindo adiante e não ficando. Pequeno êxito; para o viajante, a constância traz boa fortuna. Quem está longe de casa não tem direito a nada de ninguém. Seja cuidadoso e reservado, prestativo com os outros, e fique em bons lugares e com boas pessoas. Não seja duro nem tente subir alto. O viajante não tem em que se apoiar senão a dignidade interior.",
im:"Fogo sobre a montanha. Seja claro e cuidadoso ao aplicar penas, e não deixe as pessoas esperando na prisão. Como fogo em capim seco, tais assuntos devem passar depressa e não tornar-se morada.",
l:["O viajante se ocupa de mesquinharias, e assim atrai a desgraça. Não se rebaixe com piadas e mesquinharias no caminho. Mantenha a dignidade, por humilde que seja a sua posição.",
"O viajante chega a uma hospedaria, guarda o seu dinheiro consigo e ganha um jovem servidor leal. Modesto e reservado, você encontra um lugar de repouso, conserva o que tem e ganha um ajudante de confiança.",
"A hospedaria do viajante pega fogo; ele perde o jovem servidor; a constância é arriscada. Intrometer-se no que não é seu e tratar com frieza quem o serve. Você perde o lugar de repouso e a lealdade deles.",
"O viajante encontra onde ficar, com dinheiro e um machado; meu coração não está tranquilo. Um lugar para ficar, e meios. Mas é preciso estar atento, e você sabe que ali é estrangeiro.",
"Atira num faisão, perde uma flecha; no fim, renome e um encargo. Você se apresenta com algo bem feito, é acolhido e recebe um lugar entre estranhos.",
"O ninho do pássaro pega fogo; o viajante primeiro ri, depois lamenta. O boi é perdido por descuido: infortúnio. Levando as coisas na brincadeira, esquecido de que é estrangeiro, você perde o seu lugar de repouso e a sua própria adaptabilidade."]};
ICX_PT[57]={j:"O suave, o penetrante, vento dobrado. Pequeno êxito; é bom ter para onde ir; é bom ver uma grande pessoa. O vento dispersa as nuvens soprando numa só direção, sem parar. Uma influência que age aos poucos, nunca por um golpe violento. Precisa de um objetivo bem definido e funciona melhor sob a orientação de alguém com autoridade.",
im:"Vento após vento. Repita as suas instruções, depois realize o trabalho. A instrução penetra primeiro pela repetição; a ação vem depois.",
l:["Avançando, recuando; a firmeza de um soldado é favorável. A brandura escorregou para a indecisão. O que se precisa é da resolução de um soldado.",
"Sondando debaixo do leito; recorrendo a adivinhos e exorcistas em grande número: boa fortuna, nenhuma falta. Influências ocultas, agindo no escuro. Rastreie-as até o canto mais secreto e traga-as à luz. Então perdem o seu poder.",
"Sondar e sondar de novo: arrependimento. Revirar um assunto vezes sem conta. A partir de certo ponto, a deliberação só gera novas dúvidas e incapacidade de agir.",
"O arrependimento desaparece; três espécies de caça apanhadas na caçada. Experiência, modéstia e ação enérgica juntas. Êxito para todos os fins.",
"Constância, boa fortuna, o arrependimento desaparece, nada desfavorável. Nenhum bom começo, e no entanto um bom fim. Três dias antes da mudança, três dias depois: boa fortuna. Um mau começo ainda pode ser corrigido. Pense bem antes de mudar e verifique bem depois.",
"Sondando debaixo do leito; perdem-se o dinheiro e o machado; insistir traz infortúnio. Você seguiu o mal até o seu último canto e já não tem força para lidar com ele. Deixe-o."]};
ICX_PT[58]={j:"A alegria, lago dobrado: firme por dentro, maleável na superfície. Êxito; a constância é favorável. A alegria verdadeira repousa na firmeza interior e se mostra como brandura. Conquista as pessoas; elas aceitam as dificuldades de boa vontade, e isso dura. A alegria sem essa firmeza por dentro vira hilaridade sem freio.",
im:"Dois lagos unidos, alimentando-se um ao outro. Reúna-se com amigos para conversar e praticar juntos. O aprendizado se torna vivo, e alegre, quando é partilhado.",
l:["Alegria harmoniosa: boa fortuna. Uma alegria quieta, sem palavras, que nada deseja de fora e não tem gostos nem aversões a defender.",
"Alegria sincera: boa fortuna; o arrependimento desaparece. Prazeres oferecidos que estão abaixo de você. Mantendo a sinceridade, você não é tentado, e a companhia indigna se afasta.",
"Alegria que vem procurar: infortúnio. Sem nada por dentro, a pessoa atrai distrações de fora. Os prazeres vãos chegam sozinhos e você se perde neles.",
"Pesando prazeres, sem paz; uma vez cortado o mal, há alegria. Hesitar entre prazeres mais altos e mais baixos. Decida, e a paz vem.",
"Confiar no que desgasta: perigo. Até a melhor pessoa é abordada pelo que a desgastaria. Veja-o como é, e não lhe dê confiança.",
"Alegria que arrasta. Alguém vaidoso é levado pelo prazer e já não conduz a própria vida. O que lhe acontece fica entregue ao acaso."]};
ICX_PT[59]={j:"A dispersão: vento sobre a água, quebrando o gelo e a espuma. Êxito. O rei vai ao templo dos ancestrais. É bom atravessar o grande rio; a constância é favorável. O que era duro e fechado, o egoísmo que divide as pessoas, se dissolve. Para isso é preciso algo que toque o coração: uma reverência partilhada, um grande empreendimento comum. Então as pessoas voltam a reunir-se.",
im:"O vento move-se sobre a água. Os antigos reis faziam oferendas ao Soberano do Alto e fundavam templos. A dureza do coração se desfaz pela devoção e por aquilo que é sagrado em comum.",
l:["Vir em socorro com um cavalo forte: boa fortuna. Supere o mal-entendido logo no início, antes que endureça, e depressa.",
"Na dispersão, correr para o que o sustenta: o arrependimento desaparece. Notando em si o afastamento, o mau humor e a distância dos outros, vá ao que lhe dá firmeza e recupere a boa vontade.",
"Dispersar o próprio eu: nenhum arrependimento. Um trabalho tão exigente que não sobra espaço para pensar em si. Só sobre o chão de uma grande renúncia nasce essa força.",
"Dispersar a própria facção: grande boa fortuna. Da dispersão, um ajuntamento como uma colina, além do que as mentes comuns concebem. Deixar um círculo estreito, inclusive as amizades privadas, em favor de algo mais amplo.",
"O suor escorre enquanto a grande proclamação se espalha; os celeiros do rei distribuídos: nenhuma falta. Uma grande ideia no momento certo dá às pessoas um ponto em torno do qual se reunir. Age como uma febre que cede.",
"Dispersar o sangue, ir para longe e sair: nenhuma falta. Afastar a si e aos seus do perigo antes que ele chegue."]};
ICX_PT[60]={j:"A limitação, a medida: água sobre o lago, que só comporta tanto. Êxito. Limites amargos não podem ser mantidos. Os limites dão forma às coisas: economia nos tempos bons, medida fixa no que se gasta e se faz. Sem eles, a vida se dissolve no ilimitado. Mas os limites também precisam de limite. Impostos demais a si ou aos outros, ferem e provocam revolta.",
im:"Água sobre o lago. Estabeleça número e medida, e examine o que torna a conduta virtuosa. A liberdade toma forma por limites escolhidos.",
l:["Não passar da porta do pátio interno: nenhuma falta. Diante de limites que você não pode ultrapassar, pare. Guarde também silêncio: a discrição é o que deixa algo amadurecer.",
"Não passar do portão do pátio externo: infortúnio. Chegou o momento de agir. Hesitar agora, quando o obstáculo já se foi, é um erro que não se pode reparar.",
"Não guardar a medida, e depois lamentar: não há outro a quem culpar. Entregue ao prazer e à extravagância, a pessoa acaba se arrependendo. Não procure outro culpado.",
"Medida que vem com naturalidade: êxito. Um limite que condiz com a sua natureza, como a água que desce a encosta. Não custa luta, e a energia poupada vai para o trabalho.",
"Medida agradável: boa fortuna; seguir adiante traz respeito. Aplique o limite primeiro a si e peça pouco aos outros. Então eles seguem de bom grado.",
"Medida amarga; insistir traz infortúnio; o arrependimento desaparece. Uma severidade que as pessoas não suportam por muito tempo. Às vezes, porém, ser duro consigo mesmo é o único modo de salvar o que importa."]};
ICX_PT[61]={j:"A verdade interior: vento sobre o lago, agitando a água; um centro aberto entre linhas firmes. Até porcos e peixes são alcançados: boa fortuna. É bom atravessar o grande rio; a constância é favorável. Mesmo as criaturas menos receptivas podem ser alcançadas por alguém sem preconceito no coração, que deixa a natureza do outro agir sobre si. Sobre esse tipo de veracidade, e não sobre um laço secreto de interesse, podem apoiar-se até empreendimentos arriscados.",
im:"Vento sobre o lago. Delibere sobre os casos judiciais e seja lento em impor a morte. Compreensão a partir de dentro, por isso se julga devagar e com indulgência.",
l:["Estar sereno e preparado: boa fortuna; outra coisa traz inquietação. A firmeza interior é o que importa. Apoiar-se em arranjos ocultos com outros custa a sua independência.",
"Um grou chama da sombra, e o filhote responde. Tenho um bom vinho; vou partilhá-lo com você. O que vem do coração é ouvido sem ser imposto, mesmo à distância. A fonte de toda influência verdadeira.",
"Encontrando um par: tambor, depois silêncio; choro, depois canto. Quando o seu centro de gravidade está em outra pessoa, você é sacudido entre alegria e tristeza. Se isso é uma dor ou a maior felicidade, cada um decide.",
"A lua está quase cheia; um cavalo da parelha se perde: nenhuma falta. Para crescer em verdade, volta-se para o que está acima, como a lua para o sol, e deixam-se os laços de facção.",
"Confiança que une os outros de perto: nenhuma falta. A força do caráter de uma pessoa mantém tudo unido. Sem ela, a unidade é só de superfície.",
"O som de asas subindo ao céu; insistir traz infortúnio. Palavras no lugar da substância. O galo canta alto, e não pode voar até o céu."]};
ICX_PT[62]={j:"Preponderância do pequeno: trovão na montanha, mais próximo e menor do que no céu. Êxito; a constância é favorável. Bom para coisas pequenas, não para grandes. Uma ave em voo deixa para trás o seu grito: não é bom subir, é bom descer; grande boa fortuna. Tempo de modéstia e escrúpulo excepcionais. A força não basta para grandes coisas. A ave não deve tentar voar até o sol: desça à terra, ao ninho.",
im:"Trovão sobre a montanha. Na conduta, incline-se para o excesso de respeito; no luto, para o excesso de dor; nos gastos, para o excesso de economia. Inclinar-se para o lado do pequeno e do simples.",
l:["Uma ave que voa traz infortúnio. Mantenha os modos habituais tanto quanto puder. Tentar algo extraordinário agora só o esgota.",
"Passando pelo avô, encontra-se a avó; não chegando ao senhor, encontra-se o seu ministro: nenhuma falta. Você não chega ao topo. Ocupe o lugar que lhe está aberto e cumpra ali o seu dever, sem forçar além.",
"Sem precaver-se além do habitual, pode-se ser seguido e ferido: infortúnio. Autoconfiança que despreza a precaução como mesquinha. Há perigos que só a atenção às pequenas coisas evita.",
"Nenhuma falta. Sem passar além, encontra-se o que vem. Seguir é perigoso; esteja de guarda. Não aja; mantenha-se firme sempre. Dureza temperada por uma posição maleável. Contenha-se e permaneça firme por dentro; não force rumo a um objetivo.",
"Nuvens densas, nenhuma chuva, vindas dos nossos arredores do oeste. O senhor atira com flecha presa a um cordão e apanha quem está na caverna. Alguém capaz de pôr as coisas em ordem está só. Procure ajudantes pelo mérito real, não pela fama, entre os que se retiraram.",
"Sem encontrar, passando além; a ave em voo cai na armadilha: infortúnio; isto é calamidade. Ultrapassar o alvo, sem saber parar. Má sorte, e provocada por si mesmo."]};
ICX_PT[63]={j:"Depois da conclusão: água sobre o fogo, cada linha no seu devido lugar. Pequeno êxito; a constância é favorável. Boa fortuna no início, desordem no fim. Tudo está em ordem, e por isso mesmo qualquer movimento pode trazer de volta a desordem. A travessia foi feita; restam só detalhes. Aqui o descuido se insinua. Continue atento às pequenas coisas com o mesmo cuidado de antes.",
im:"Água sobre o fogo: uma chaleira no fogão, onde um pode estragar o outro. Pense no problema antes que ele venha, e precavenha-se.",
l:["Freando as rodas; a raposa molha a cauda: nenhuma falta. Todos avançam depois da travessia. Contenha-se a tempo. A pressão geral só o atinge por trás.",
"A mulher perde a cortina da carruagem. Não a procure; em sete dias é encontrada. Não lhe dão a confiança de que precisa para agir. Não saia à procura dela. O que é seu volta.",
"O imperador Gaozong ataca a Terra dos Demônios e a toma depois de três anos. Não empregue pessoas mesquinhas. Depois do êxito, a expansão: longas lutas. Não entregue o que foi conquistado a quem estiver simplesmente à mão.",
"O forro de seda vira trapos; fique atento o dia inteiro. Em meio ao bem-estar, aparece uma fenda que é logo tapada. Não a esqueça. Tome-a como sinal.",
"O vizinho do leste sacrifica um boi; isso não se compara à simples oferenda de primavera do vizinho do oeste, que de fato recebe a bênção. A magnificência tomou o lugar da seriedade interior. A reverência simples e sincera recebe mais.",
"Molhar a cabeça: perigo. Tendo atravessado, não se volte para contemplar o perigo de que escapou. Siga em frente."]};
ICX_PT[64]={j:"Antes da conclusão: fogo sobre a água, cada linha ainda fora do seu lugar, como no fim do inverno. Êxito. A jovem raposa quase atravessou, e então molha a cauda: nada favorável. Um tempo de esperança: prepara-se a passagem da desordem para a ordem. A sua condição é a cautela, como uma raposa velha sobre o gelo, escutando a cada passo se ele racha. Apressar o último trecho desfaz tudo.",
im:"Fogo sobre a água. Discirna as coisas com cuidado e ponha cada uma no seu devido lugar. Para pôr as forças em ordem, conheça primeiro a natureza de cada uma e onde ela pertence.",
l:["Molhar a cauda: arrependimento. Num tempo de desordem, há a tentação de avançar para realizar algo visível. Cedo demais: contenha-se.",
"Freando as rodas; constância, boa fortuna. O tempo de agir ainda não chegou. Mas a espera não deve tornar-se ociosa: construa a força que será necessária e mantenha o objetivo à vista.",
"Ainda não atravessado; avançar traz infortúnio; é bom atravessar o grande rio. Chegou o momento da transição e a sua força sozinha não basta. Forçar fracassa. Crie uma nova situação, com ajudantes capazes, e atravessem juntos.",
"Constância, boa fortuna, o arrependimento desaparece. Erguer-se para atacar a Terra dos Demônios; depois de três anos, recompensas de um grande estado. Agora a luta deve ser travada até o fim, sem dúvidas. Ela lança os alicerces do que vem depois.",
"Constância, boa fortuna, nenhum arrependimento. O resplendor da pessoa nobre; há confiança: boa fortuna. A vitória foi ganha. O brilho de alguém verdadeiro se faz sentir, e as pessoas acreditam.",
"Confiança partilhada bebendo vinho: nenhuma falta. Encharcando a cabeça, a confiança perde o que é correto. No limiar do novo tempo, entre amigos. Celebrar é certo. O excesso joga fora o que foi ganho."]};

window.MOX_PT={
1:{name:"O Céu Imaculado",lead:"Um céu sem mancha alguma. A resposta pede primeiro que você escute: deixe a mente assentar, limpa e equânime, antes de agir.",sign:"O som da tripla vacuidade.",
c:["Nenhum mal atinge a família, os bens ou a vida; haverá contentamento.","A equanimidade não deixa nada no caminho. Esta é a melhor de todas as respostas para afastar forças negativas e maus presságios; problemas anteriores se endireitam, e confiar nos budas e bodhisattvas traz resultados rápidos.","Você os tem agora, mas será difícil conservá-los. Para mantê-los, ofereça flores à Prajñāpāramitā.","Nenhum.","Uma viagem tranquila e confortável.","Você está bem.","Nada o perturba.","Êxito em abandonar hábitos nocivos e na meditação; faltas e obscurecimentos são purificados.","Será encontrado se ainda estiver perto de onde foi deixado; caso contrário, difícil de recuperar.","Chances iguais para os dois lados. Pode ser feito, mas devagar.","Chance mediana para qualquer outra pergunta."],
r:"Tome Vajrasattva como sua deidade e recite o mantra de cem sílabas; recite um sūtra da Prajñāpāramitā, longo, médio ou breve. Ākāśagarbha também é adequado.",k:"A dádiva do destemor"},
2:{name:"Os Raios Flamejantes do Sol",lead:"Luz do sol sem nada à frente. O que você pergunta se resolve com clareza e sem reservas, e se resolve bem.",sign:"Sem poeira e claro.",
c:["Bem, desde que você continue empenhado no que é virtuoso.","Saem bem quando você corta a rede de dúvidas com que se envolveu.","Uma ligeira melhora, ajudada por coisas brilhantes (cristais, gemas) ou vermelhas.","Nenhum.","Viajam com facilidade, e você receberá notícias exatas e agradáveis deles.","Recuperação rápida.","Nenhum problema com espíritos.","A prática aumenta a inteligência, o estudo e a reflexão.","Procure a sudoeste de onde foi perdido; alguém trará notícias.","O sentido da questão se tornará claro para você.","Bastante bom no geral. Ligeiramente desfavorável só para trabalhos com terra, casas e objetos que servem de suporte, como mesas."],
r:"Confie em deidades de sabedoria como Mañjuśrī, ofereça lamparinas de manteiga e bandeiras de oração, e recite sūtras como o que dissipa a escuridão das dez direções.",k:"A partida da escuridão"},
3:{name:"Os Raios de Néctar da Lua",lead:"Luar como néctar pelo céu. Atividades pacíficas, de crescimento e virtuosas têm êxito garantido.",sign:"Desfrutar dos objetos dos sentidos onde nenhum obstáculo se reuniu.",
c:["Rituais de purificação e de ablução favorecem a família; ela pode crescer.","Sem obstáculos. Os meios brandos funcionam; a força e a dureza nada produzem aqui.","Coisas brancas, comida e bebida aumentam.","Nenhum.","Viagem confortável e chegada breve.","Recuperação rápida de males de frio e digestivos.","Absolutamente nenhum.","Uma mente virtuosa, e a virtude cresce.","Peça a uma mulher que procure ao sul ou ao norte de onde foi perdido.","Será realizado.","Bom para tudo o que envolve mulheres e para trabalhos fáceis, sem esforço. Ligeiramente desfavorável para o que envolve fogo."],
r:"Confie em deidades femininas como Tārā Branca e Uṣṇīṣavijayā; recite um sūtra em que mulheres recebem a predição do despertar; oferendas de água e rituais de ablução; oferendas aos nāgas; qualquer guru yoga.",k:"Nuvens densas e boas"},
4:{name:"A Estrela Brilhante",lead:"Uma estrela muito brilhante. Trabalhe com firmeza e cuidado e o resultado será bom.",sign:"O que foi belamente reunido não se dispersa.",
