"Perhaps someone adds to it: a costly tortoise shell that cannot be refused. Great good fortune. Luck that is destined; nothing stands against it and nothing need be feared.",
"Adding without taking from anyone: no fault; constancy, good fortune; somewhere to go. Gaining helpers, no longer a household of one's own. A blessing that benefits everyone. What you gain is put at the service of all."]};
ICX[42]={j:"Increase: wind and thunder, each amplifying the other. Good to have somewhere to go; good to cross the great river. Those above give up something for those below, a sacrifice that strengthens the whole. Such a time does not last. Use it while it is here, even for difficult and risky things.",
im:"Wind with thunder. When you see what is good, move toward it; when you have a fault, change it. The surest increase is of oneself.",
l:["Good for undertaking great work: great good fortune, no fault. Help from above gives you strength you did not have. Use it for something large, and selflessly.",
"Perhaps someone adds to it: a costly tortoise shell that cannot be refused. Lasting constancy brings good fortune; the king makes offering to the Lord on High. Real increase comes when you create the conditions for it in yourself: receptive, and loving the good.",
"Increase that comes through misfortune: no fault, if one is sincere, keeps to the middle, and reports to the lord bearing a jade token. Even hardship turns to advantage for someone acting in truth.",
"Keeping to the middle and reporting, the lord follows; good to be relied on for moving the capital. The go-between who sees that benefits actually reach the people. Trusted on both sides, and needed in large undertakings.",
"With a truly kind heart, there is no need to ask: great good fortune. Others will trust my goodness. Real kindness does not look for thanks, and it is recognised.",
"Nobody adds to him; someone may even strike him. His mind is set on nothing lasting: misfortune. Those above who neglect to give lose everyone's support and stand exposed."]};
ICX[43]={j:"Breakthrough, resolution: the lake has risen to the sky, and a downpour is due. Proclaim it in the king's court; call out with sincerity, aware of the danger. Inform your own town; it does not help to take up arms; it helps to have somewhere to go. One lesser element remains in a high place. Remove it openly and decisively, without compromise and without violence: by naming it, and by starting with yourself. Fighting evil directly only entangles you in it; the best defence is steady progress in the good.",
im:"The lake has climbed into the sky. Share your wealth with those below, and do not rest on your merits. What only piles up will collapse. Distribute as you gather, and keep examining yourself.",
l:["Strength in the front toes; going without being equal to it is a fault. Eager to press ahead at the start, with resistance still strong. Measure your strength first.",
"Alarm cries; armed men at dusk and night; no cause to worry. Readiness is everything. Someone watchful, who has thought through what may come, is not frightened by it.",
"Strength showing in the cheekbones: misfortune. The noble person is resolved, walks alone, meets rain, gets soaked and resented: no fault. You keep a tie with a lesser person while everyone else is against them, and are misjudged. Staying true to yourself, you are without fault.",
"Buttocks without skin, walking falteringly. Led like a sheep, regret would vanish, but the words are heard and not believed. Restless obstinacy: wanting to push forward at any cost and deaf to advice.",
"Purslane in the garden: cut it back decisively; walking in the middle, no fault. The weed keeps returning, and it is close to you. Do not let yourself be turned aside.",
"No outcry: in the end misfortune. Victory seems won and only a remnant is left. Thinking it harmless is the danger: from what remains, the harm grows again. Finish the work."]};
ICX[44]={j:"Encountering: wind under the sky. A woman of great strength; do not take her in marriage. Something dark, driven out above, returns unexpectedly from below and offers itself. It looks small and harmless, and that is why it is let in. Do not bind yourself to it. Yet the same figure also shows what is good in meeting: when two who belong together come halfway to each other, free of hidden motives, great things follow.",
im:"Wind beneath the sky. The ruler sends out decrees and makes them known in all four directions. An influence from above that reaches everywhere, as wind does.",
l:["Tied to a metal brake: constancy, good fortune. Going on, one sees misfortune; a thin pig is bound to fret and rampage. A small, lesser thing has crept in. Stop it now and firmly. It will not stay weak.",
"Fish in the wrapper: no fault; not to be shared with guests. Hold the thing gently in check, in your own keeping, and do not let it reach others.",
"Buttocks without skin, walking falteringly: danger, but no great fault. Tempted to go along with it, and luckily prevented. Painful indecision; if you see it clearly, no serious error.",
"No fish in the wrapper: misfortune arises. Having held aloof from ordinary people, you find nobody there when you need them. Your own doing.",
"Willow leaves wrapped round a gourd; a hidden beauty. Something falls from heaven. Protecting those in your charge without display or lecturing, simply by inner worth. The result ripens and falls into your hands.",
"Meeting with the horns: regret, no fault. Withdrawn from the world and brusque with what is lower. People find it proud. You no longer live in the world, so you can bear that."]};
ICX[45]={j:"Gathering: the lake above the earth, water collecting. Success. The king goes to his ancestral temple. It helps to see a great person; success, with constancy. Large offerings bring good fortune; there is somewhere to go. People gather around a centre, and the gathering needs a person who is collected in themselves, and a shared reverence. Where many come together, be ready for the unexpected too.",
im:"The lake over the land. Keep your tools of defence in good repair, to be ready for the unforeseen. Where things accumulate, conflict and loss can arise. Be prepared.",
l:["Trust that does not last to the end: now confusion, now gathering. Call out, and a single handclasp turns it to laughter. Do not worry; going is no fault. People want to unite and waver. One call to the leader, and the distress is over.",
"Being drawn in: good fortune, no fault. With sincerity, even a small spring offering is welcome. There are hidden forces that bring together those who belong together. Yield to that pull.",
"Gathering with sighs; nothing helps. Going is no fault; small regret. The group is already formed and you feel shut out. Attach yourself to someone near the centre who can bring you in.",
"Great good fortune: no fault. Someone who gathers people in another's name, not for their own advantage. The work is crowned with success.",
"Gathering with a position: no fault. Some do not yet trust; with fundamental, lasting constancy, regret vanishes. Some come only because of your influence. Win their real trust by steady devotion to the task.",
"Sighing and weeping, tears and snivelling: no fault. You wanted to join and were misunderstood. Your grief may bring the other to their senses."]};
ICX[46]={j:"Rising: a tree growing up inside the earth. Fundamental success. Go and see the great person; do not worry. Setting out for the south brings good fortune. A rise that comes from effort and will, through modesty and adaptability, not force. It meets no obstruction. Go and see the people who matter, without anxiety, and then get to work.",
im:"Wood growing within the earth. Accumulate small things, little by little, until they become something high and great. Steady, uninterrupted, yielding around obstacles.",
l:["Rising, welcomed: great good fortune. At the very bottom, with strength drawn from the root, and trusted by those above.",
"With sincerity, even a small spring offering is welcome: no fault. You are strong and somewhat brusque, and do not fit your surroundings well. Since you are upright, people respond anyway.",
"Rising into an empty town. All obstruction falls away and you go forward with ease. No time for misgivings; use the opening.",
"The king makes offering on Mount Qi: good fortune, no fault. You reach the goal: admitted among those who carry things, and given lasting standing there.",
"Constancy, good fortune: climbing the stairs. Going higher, do not let success turn your head. Step by step, skipping nothing.",
"Rising in the dark; good to keep unceasingly steady. Blind advance knows only forward and exhausts itself. Stay conscientious and consistent to avoid loss."]};
ICX[47]={j:"Exhaustion, being hemmed in: the lake has drained away and nothing is left in it. Success. For the great person, constancy brings good fortune and no fault. Words spoken are not trusted. A time of adversity in which the strong are hemmed in by the weak. Whoever stays cheerful under pressure, bending without breaking, comes through stronger. Words achieve nothing now; be strong within and sparing in speech.",
im:"A lake with the water gone. Give your life, if need be, to carry out your purpose. When fate cannot be changed, accept it and remain true to yourself.",
l:["Buttocks pinned under a bare stump; entering a dark valley, for three years seeing no one. Giving in to adversity, sinking under it. The trouble is inner blindness.",
"Hemmed in amid wine and food; the man in red ceremonial dress is about to arrive. Good to make offerings; setting out brings misfortune, no fault. Outwardly all is well and inwardly you are weary of the ordinary. Help comes from above. Prepare inwardly; do not act before the time.",
"Hemmed in by rock, leaning on thistles; entering the house, the wife is not there: misfortune. Restless and undecided: butting against walls and leaning on things that give no support.",
"Coming slowly, hemmed in by a bronze carriage: regret, yet it reaches an end. Someone well placed wants to help those below and is held back by their own circle. Their nature sets it right in the end.",
"Nose and feet cut; hemmed in by the man in crimson ceremonial dress. Slowly there is relief; good to make offerings. Wanting the good of others and blocked from above and below. Slowly things turn. Meanwhile, composure and prayer.",
"Hemmed in by trailing vines, unsteady and uneasy. Saying 'moving brings regret', one has regrets; setting out brings good fortune. Bonds that would break easily. Only the fear left from past failure holds you. Decide, and go."]};
ICX[48]={j:"The well: wood goes down into the water and brings it up. Towns may be moved; the well is not moved. It is never used up and never overflows; people come and go and draw from it. If the rope does not quite reach the water, or the jar breaks just before it surfaces, misfortune. The inexhaustible source beneath every way of life, the same in every age. Two things are needed: to go down to the real foundations, and not to be careless at the last moment, when the water is nearly up.",
im:"Water above wood. Encourage people in their work and urge them to help one another. The whole is organised so that each part serves the others, as in a plant.",
l:["A muddy well, not fit to drink; an old well that no creature visits. Someone who has let themselves go, sunk in the low ground of life. Nobody comes to them any more.",
"Shooting minnows in the well's hollow; the jar is cracked and leaking. Good qualities neglected, in poor company, until nothing can be done with them.",
"The well is cleared, yet nobody drinks: it grieves my heart, for it could be drawn from. A clear-sighted king would share the blessing with all. A capable person is there and is not used. Those who know it grieve.",
"Lining the well with bricks: no fault. While the work is done the well cannot be used. A time of putting yourself in order: nothing for others now, and more later.",
"The well is clear; a cold spring to drink. Real quality is here and available. It only has to be drawn on and put into practice.",
"The well drawn from, left uncovered; trustworthy: great good fortune. The well is there for everyone, and the more people draw on it the greater its wealth."]};

ICX[49]={j:"Revolution, moulting: fire inside the lake, two forces that would each destroy the other. Only when its day has come is it trusted. Fundamental success, constancy favourable; regret vanishes. A radical change, like an animal shedding its skin. It is justified only when it is truly needed and no other way remains; it must come at the right time, be led by someone free of selfish aims, and answer a real need. Then people come to trust it, afterwards.",
im:"Fire in the middle of the lake. Keep an accurate calendar and make the seasons plain. Change has its times. Knowing them, you can prepare for what each asks.",
l:["Bound tight with yellow oxhide. It is too early to do anything. Hold firm, stay restrained, and attempt nothing for now.",
"When the day comes, then change; setting out brings good fortune, no fault. Every reform has been tried. Prepare thoroughly, then act, with the right person leading.",
"Setting out brings misfortune; constancy is risky. When the call for change has been heard three times, there is trust. Neither rush nor hold back out of mere conservatism. Listen to complaints that keep coming back and are well founded.",
"Regret vanishes; there is trust; changing the mandate brings good fortune. A radical change needs inner authority as well as outward position. People support only what they sense is just.",
"The great person transforms like a tiger; trusted before any consultation. The broad lines of the change are plain to everyone, like a tiger's stripes, and win spontaneous assent.",
"The noble person transforms like a leopard; the petty person only changes expression. Setting out brings misfortune; staying steady brings good fortune. After the large change come the small refinements. Do not push further: be content with what can be reached."]};
ICX[50]={j:"The cauldron: fire burning over wood, the vessel in which food is cooked for the wise and offered to what is highest. Fundamental good fortune; success. Where the well was the source for everyone, the cauldron is culture: what is raw is transformed, and the visible is put at the service of what cannot be seen. A person finds their true calling when their work is offered up in that way.",
im:"Fire upon wood. Stand rightly in your place, and so make your destiny firm. Life and destiny brought into agreement, as wood feeds the flame.",
l:["The cauldron upturned, its feet in the air: good for clearing out what is stale. Taking a secondary wife for the sake of a son: no fault. In a time of high culture anyone of good will can find a place, however low they start, once rid of what clogs them.",
"The cauldron holds food. My rival is ill and cannot reach me: good fortune. Real achievement draws envy. Stay with the work itself and envy cannot touch you.",
"The cauldron's ears are altered, so it cannot be carried; the rich pheasant meat goes uneaten. When rain comes, regret fades; in the end, good fortune. Good gifts go unrecognised and unused. If the substance is real, the tension resolves.",
"The cauldron's leg breaks; the lord's stew spills and his form is drenched: misfortune. A heavy task, weak character, little knowledge, and unfit helpers. It ends in disgrace.",
"The cauldron has yellow ears and bronze rings; constancy is favourable. Someone in authority who is approachable and modest finds strong, able helpers.",
"The cauldron with a carrying rod of jade: great good fortune, all things favourable. Counsel given with the hardness and soft lustre of jade: firm, mild and pure."]};
ICX[51]={j:"Shock, thunder doubled: jolt upon jolt. Success. Thunder comes, there is fright, then laughter and talk. The thunder alarms the land for a hundred leagues, and the one making the offering does not spill the ladle of ritual wine. A fright that comes from something greater than oneself and makes a person take stock. Whoever has learned inner reverence stays composed when it breaks, and joy follows the fear.",
im:"Thunder twice over. In fear and trembling, set your life in order and examine yourself. The shock is put to use: to look for whatever in you runs against what is right.",
l:["Thunder comes, there is fright, then laughter and talk: good fortune. You feel it first and more than others, and you are the better for it afterwards.",
"Thunder comes with danger; untold riches are lost; climbing high into the hills. Do not chase them; in seven days they return. A real loss. Resistance is useless; withdraw to high ground. What is yours returns unsought.",
"Thunder leaves one dazed; if it moves you to act, no harm. A blow of fate that can stun. Let it move you to change things from within.",
"Thunder bogged in the mud. Movement gets nowhere when there is neither resistance to fight nor yielding to win by: everything is sluggish as mud.",
"Thunder coming and going: danger, but nothing is lost; there is work to do. Repeated blows with no pause between. Keeping to the centre of the movement, you lose nothing.",
"Thunder leaves one shaking and staring wildly; marching on brings misfortune. It has struck the neighbour, not yet oneself: no fault, though there is talk among one's kin. When shock has robbed everyone of clear sight, keep still until composure returns, and withdraw in time, even if others resent it."]};
ICX[52]={j:"Stillness, mountain doubled. Still in the back, one no longer grasps at the body; walking through the courtyard one does not see the people there. No fault. Rest and movement each at their proper time. The back is where the nerves of movement lie: when it is quiet, the restless self disappears, and one can turn to the world without being caught in its struggle. From that calm, right action follows.",
im:"Mountain upon mountain. Do not let your thoughts stray beyond your situation. The heart thinks constantly; keep the thinking to what is actually at hand.",
l:["Stillness in the toes: no fault; good to stay steady over time. Stopping before you have begun to move, at the very start, when few mistakes have been made. Hold to that firmly.",
"Stillness in the calves; unable to rescue the one it follows; the heart is unhappy. Carried along by someone stronger on a wrong course. You can halt yourself, and you cannot halt them.",
"Stillness at the waist, the spine held rigid: danger; the heart is smothered. Calm that is forced. Quiet must grow from inner composure. Rigidly imposed, it chokes.",
"Stillness in the torso: no fault. Forgetting the self, the highest stage, is not reached yet, but thoughts and impulses are held quiet. That is on the way.",
"Stillness in the jaws; speech has order; regret vanishes. Someone in a difficult spot who talks too freely. Reserve gives speech its weight.",
"Steadfast, generous stillness: good fortune. Stillness complete: not confined to detail but at rest in the whole. That brings peace and good fortune in everything."]};
ICX[53]={j:"Gradual progress: a tree growing on a mountain, slowly, rooted, visible from far off. A woman's marriage: good fortune; constancy favourable. Things meant to last have to unfold step by step and in the proper order, as the formalities before a marriage do. Haste would spoil it. Calm within and adaptability without make steady progress possible. The same holds for any relationship that has to grow, and for any influence on others.",
im:"A tree upon the mountain. Dwell in worthy conduct, and so better the ways of the people around you. Influence of this kind works gradually, through the weight of a person's own character.",
l:["The wild geese advance by stages to the riverbank. The youngest is in danger, and there is talk; no fault. A first step, alone, with nobody to help. Slow and careful, and criticised for it. That slowness is what keeps you from error.",
"The wild geese advance by stages to the great rock; eating and drinking contentedly: good fortune. A secure place is reached, and the first success. It is shared gladly, not hoarded.",
"The wild geese advance by stages to the dry upland. The husband sets out and does not come back; the wife conceives and does not give birth: misfortune. Good for warding off raiders. Going too far, into a place that does not suit you, by forcing things. Do not provoke a struggle; hold your ground and defend it.",
"The wild geese advance by stages to the trees; perhaps one finds a level bough: no fault. A place not really made for you. By being sensible and yielding, you find a safe spot in it.",
"The wild geese advance by stages to the hilltop. For three years the wife does not conceive; in the end nothing prevails against her: good fortune. In a high position one is easily cut off, misjudged by the very person one depends on. The misunderstanding clears, and union comes.",
"The wild geese advance by stages to the high ridges; their feathers can serve in the ritual dance: good fortune. A life completed. It leaves the earth and remains a bright example for those who look up to it."]};
ICX[54]={j:"The marrying younger sister: thunder over the lake, the younger following the elder. Setting out brings misfortune; nothing is favourable. A relationship entered from inclination and from a subordinate place, not through formal right. Such ties rest on tact and affection alone. To push forward, claim a position or insist on rights now goes wrong. Keep the lasting end in view and stay reserved.",
im:"Thunder over the lake. Bear the far end in mind, and know what will wear out. Every human tie can go astray. Keeping the enduring purpose in mind avoids the reefs.",
l:["The younger sister marries as a junior wife; lame, yet able to walk; setting out brings good fortune. In a modest, subordinate place, you can still be of real help by fitting in with tact.",
"Blind in one eye, yet able to see; good for the constancy of one who lives apart. Disappointed in the one you joined with, you keep faith alone.",
"The younger sister marries while waiting in a lowly place; she goes back and marries as a junior wife. Wanting something so much that you accept a position beneath your worth to get it.",
"The younger sister lets the time pass; a late marriage, waiting for its season. Declining to throw yourself away, and letting the usual moment pass. What is right comes, later.",
"Emperor Yi gives his younger sister in marriage; the bride's sleeves are plainer than her attendant's. The moon nearly full: good fortune. Someone of high standing who takes a lower place gladly, free of vanity.",
"The woman holds a basket with nothing in it; the man cuts the sheep and no blood comes. Nothing is favourable. Form without substance: a rite gone through for appearance only."]};
ICX[55]={j:"Abundance, fullness: thunder and lightning arriving together, clarity within and movement without. Success. The king reaches it. Do not grieve; be fit for the noon sun. A peak of greatness and plenty, and by its nature brief. Only someone inwardly free of sorrow and anxiety can lead such a time. Do not mourn the decline that must follow. Light up everything while the hour lasts.",
im:"Thunder and lightning both arrive. Settle disputes and carry out sentences. Clarity to investigate, and energy to act on the finding.",
l:["Meeting one's matching lord; though equals for ten days, no fault; going on earns honour. Clarity and energy joined for a full cycle. Go forward.",
"So thick a screen that at midday the Dipper shows. Going on meets suspicion and dislike. With trust that rouses: good fortune. Intrigue has come between you and the one in charge. Do not force it. Hold to truth; it works unseen.",
"So dense a curtain that at midday the faint stars show; the right arm is broken: no fault. An eclipse at its fullest: even the insignificant push forward. The best helper is prevented from acting, through no fault of their own.",
"So thick a screen that at midday the Dipper shows; meeting a lord of one's own kind: good fortune. The darkness is already lessening. Energy and wisdom find one another.",
"Brilliance arrives; there is honour and praise: good fortune. The one in charge is modest and open to able counsel, and so is surrounded by people who propose what should be done.",
"A grand house, its family walled off; peering through the door, it is silent, no one there; for three years nobody is seen: misfortune. Through arrogance and wanting to master everything, someone ends estranged from their own people, and alone."]};
ICX[56]={j:"The traveller: fire on the mountain, moving on and not staying. Small success; for the traveller, constancy brings good fortune. Someone far from home has no claim on anyone. Be careful and reserved, obliging toward others, and keep to good places and good people. Do not be harsh or reach high. A traveller has nothing to rest on but inner dignity.",
im:"Fire upon the mountain. Be clear and careful in applying penalties, and do not keep people waiting in prison. Like a fire in dry grass, such matters should pass quickly and not become a dwelling place.",
l:["The traveller fusses over petty things, and so brings on disaster. Do not lower yourself with jokes and pettiness on the road. Keep your dignity, however humble your position.",
"The traveller reaches lodgings, keeps his money close, and gains a loyal young servant. Modest and reserved, you find a resting place, keep what you have, and gain one trustworthy helper.",
"The traveller's lodgings burn down; he loses his young servant; constancy is risky. Meddling in things that are not yours, and treating those who serve you coldly. You lose both your resting place and their loyalty.",
"The traveller finds a place to stay, with money and an axe; my heart is not at ease. A place to stay, and means. But you must stay on guard, and you know you are a stranger there.",
"Shooting a pheasant, losing one arrow; in the end, renown and a commission. You introduce yourself with something well done, and are received and given a place among strangers.",
"The bird's nest catches fire; the traveller laughs first and wails after. The ox is lost through carelessness: misfortune. Taking things lightly, forgetting you are a stranger, you lose your resting place and your own adaptability."]};
ICX[57]={j:"The gentle, penetrating, wind doubled. Small success; good to have somewhere to go; good to see a great person. Wind disperses clouds by blowing in one direction without stopping. Influence that works gradually, never by a violent stroke. It needs a clearly defined goal, and does best under the guidance of someone with authority.",
im:"Wind after wind. Repeat your instructions, then carry out the work. The instruction first sinks in through repetition; action follows.",
l:["Advancing, retreating; the steadiness of a soldier is favourable. Gentleness has slipped into indecision. What is needed is a soldier's resolve.",
"Probing beneath the couch; calling on diviners and exorcists in great number: good fortune, no fault. Hidden influences, working in the dark. Trace them to the most secret corner and bring them into the light. Then they lose their power.",
"Probing again and again: regret. Thinking a matter over and over. After a point, deliberation only breeds fresh doubts and the inability to act.",
"Regret vanishes; three kinds of game taken on the hunt. Experience, modesty and energetic action together. Success for every purpose.",
"Constancy, good fortune, regret vanishes, nothing unfavourable. No good start, yet a good finish. Three days before the change, three days after: good fortune. A poor start can still be corrected. Think carefully before making the change, and check carefully afterwards.",
"Probing beneath the couch; money and axe are lost; constancy brings misfortune. You have followed the harmful thing into its last corner and no longer have the strength to deal with it. Leave it alone."]};
ICX[58]={j:"Joy, lake doubled: firm within, yielding at the surface. Success; constancy favourable. True joy rests on inner firmness and shows itself as gentleness. It wins people; they take on hardship willingly, and it lasts. Joy without that steadiness inside turns into unrestrained mirth.",
im:"Two lakes joined, feeding each other. Meet with friends to talk and practise together. Learning becomes alive, and glad, when it is shared.",
l:["Harmonious joy: good fortune. A quiet, wordless gladness that desires nothing from outside and has no likes or dislikes to defend.",
"Sincere joy: good fortune; regret vanishes. Offered pleasures that are beneath you. Staying sincere, you are not tempted, and unworthy company falls away.",
"Joy that comes looking: misfortune. With nothing inside, one draws diversions in from outside. Idle pleasures arrive of themselves and you lose yourself in them.",
"Weighing up pleasures, not at peace; once the ailment is cut off, there is gladness. Wavering between higher and lower pleasures. Decide, and peace follows.",
"Trusting what strips one away: danger. Even the best person is approached by what would wear them down. See it for what it is, and do not give it your trust.",
"Joy that draws one on. Someone vain is pulled along by pleasure and no longer steers their own life. What happens to them is left to chance."]};
ICX[59]={j:"Dispersal: wind passing over the water, breaking up ice and foam. Success. The king goes to his ancestral temple. Good to cross the great river; constancy favourable. What was hard and closed, the egotism that divides people, is dissolved. That takes something that moves the heart: a shared reverence, a great common undertaking. Then people come together again.",
im:"Wind moving over the water. The ancient kings made offerings to the Lord on High and founded temples. Hardness of heart is loosened by devotion and by what is held sacred in common.",
l:["Coming to the rescue with a strong horse: good fortune. Overcome the misunderstanding at the very beginning, before it hardens, and quickly.",
"In the scattering, running to one's support: regret vanishes. Noticing estrangement in yourself, ill humour and distance from others, go to what steadies you and regain good will.",
"Dispersing one's own self: no regret. Work so demanding that there is no room left for thinking about yourself. Only on the ground of great renunciation does this strength arise.",
"Dispersing one's faction: great good fortune. Out of dispersal, a gathering like a hill, beyond what ordinary minds conceive. Leaving a narrow circle, private friendships included, for the sake of something wider.",
"Sweat pours out as the great proclamation is scattered abroad; the king's store dispersed: no fault. A great idea at the right moment gives people a point to gather around. It works like a fever breaking.",
"Scattering the blood, going far away and out: no fault. Removing yourself and those close to you from danger before it arrives."]};
ICX[60]={j:"Measure, limitation: water over the lake, which can hold only so much. Success. Limits that are bitter cannot be held to. Limits give things form: thrift in good times, fixed measure in what you spend and do. Without them a life dissolves into the boundless. But limits need a limit too. Pressed too far on yourself or others, they hurt and provoke revolt.",
im:"Water above the lake. Establish number and measure, and look into what makes conduct virtuous. Freedom takes shape through chosen bounds.",
l:["Not stepping beyond the inner courtyard door: no fault. Faced with limits you cannot pass, stop. Keep silence too: discretion is what lets something ripen.",
"Not stepping beyond the outer courtyard gate: misfortune. The moment for action has come. Hesitating now, after the obstacle is gone, is a mistake that cannot be made good.",
"Not keeping measure, and then sighing over it: no one else to blame. Given over to pleasure and extravagance, one comes to regret it. Do not look for someone else to blame.",
"Measure that comes easily: success. A limit that fits your nature, like water flowing downhill. It costs no struggle, and the energy saved goes into the work.",
"Measure that is pleasant: good fortune; going on earns respect. Apply the limit to yourself first and ask little of others. Then they follow willingly.",
"Bitter measure; constancy brings misfortune; regret vanishes. Severity that people cannot bear for long. Sometimes, though, being hard on oneself is the only way to save what matters."]};
ICX[61]={j:"Inner truth: wind over the lake, stirring the water; an open centre between firm lines. Even pigs and fish are reached: good fortune. Good to cross the great river; constancy favourable. Even the least responsive creatures can be reached by someone without prejudice in their heart, who lets the other's nature act on them. On that kind of truthfulness, and not on a secret bond of interest, even risky undertakings can rest.",
im:"Wind over the lake. Deliberate over legal cases and be slow to impose death. Understanding from within, which is why one judges slowly and with forbearance.",
l:["Being at ease and ready: good fortune; anything else brings unrest. Inner steadiness is what matters. Leaning on hidden arrangements with others costs you your independence.",
"A crane calls from the shade, and its young one answers. I have fine wine; I will share it with you. What comes from the heart is heard without being pushed, even at a distance. The source of all real influence.",
"Finding a partner: drumming, then stopping; weeping, then singing. When your centre of gravity lies in another person, you are tossed between joy and grief. Whether that is a sorrow or the highest happiness, each must decide.",
"The moon is almost full; one horse of the pair is lost: no fault. To grow in truth one turns to what is above, as the moon faces the sun, and lets factional ties go.",
"Trust that binds others close: no fault. The force of one person's character holds everything together. Without it, unity is only on the surface.",
"The sound of wings rising to the sky; constancy brings misfortune. Words in place of substance. The rooster crows high, and cannot fly up to heaven."]};
ICX[62]={j:"Small excess: thunder on the mountain, nearer and smaller than in the sky. Success; constancy favourable. Fine for small matters, not for great ones. A flying bird leaves its call behind: not good to go up, good to come down; great good fortune. A time for exceptional modesty and conscientiousness. Strength is not enough for great things. The bird should not try to fly into the sun: come down to earth, to the nest.",
im:"Thunder upon the mountain. In conduct lean toward too much respect, in mourning toward too much grief, in spending toward too much thrift. Leaning to the side of the small and the simple.",
l:["A bird that flies brings misfortune. Keep to the usual ways as long as you can. Trying something extraordinary now only wears you out.",
"Going past the grandfather, one meets the grandmother; not reaching the lord, one meets his minister: no fault. You do not get to the top. Take the place open to you and do your duty there, without pushing further.",
"Not guarding against it beyond the ordinary, one may be followed and harmed: misfortune. Self-confidence that scorns precaution as petty. There are dangers that only attention to small things avoids.",
"No fault. Not going past, one meets it. Going on is dangerous; be on guard. Do not act; stay steady at all times. Hardness tempered by a yielding place. Hold back and stay firm inside; do not press toward a goal.",
"Thick clouds, no rain, from our western outskirts. The lord shoots with a corded arrow and takes the one in the cave. Someone able to set things right stands alone. Look for helpers by their real merit, not their fame, among those who have withdrawn.",
"Not meeting it, but going past it; the flying bird is snared: misfortune; this is calamity. Overshooting the mark, not knowing how to stop. Bad luck, and brought on oneself."]};
ICX[63]={j:"Already across: water over fire, every line in its proper place. Small success; constancy favourable. Good fortune at first, disorder in the end. Everything is in order, and for that very reason any movement can bring disorder back. The crossing is made; only details remain. Here carelessness creeps in. Keep attending to small things with the same care as before.",
im:"Water over fire: a kettle on the hearth, where each can spoil the other. Think about trouble before it comes, and guard against it.",
l:["Dragging the wheels; the fox wets its tail: no fault. Everyone presses forward after the crossing. Hold back in time. The general pressure touches you only from behind.",
"The woman loses her carriage screen. Do not search for it; in seven days it is found. You are not given the trust you need to act. Do not go looking for it. What is your own returns.",
"Emperor Gaozong attacks the Demon Land and takes it after three years. Do not employ petty people. After success, expansion: long struggles. Do not hand what was won to whoever happens to be available.",
"Silk padding fraying into rags; stay watchful all day. In the midst of well-being a leak shows and is quickly stopped. Do not forget it. Take it as a sign.",
"The eastern neighbour sacrifices an ox; it does not equal the western neighbour's simple spring offering, which truly receives the blessing. Magnificence has replaced inner seriousness. Simple, sincere reverence receives more.",
"Wetting the head: danger. Having crossed, do not turn round to gaze at the peril you escaped. Keep going."]};
ICX[64]={j:"Not yet across: fire over water, each line still out of place, as at the end of winter. Success. The young fox has nearly made it across, then wets its tail: nothing favourable. A hopeful time: the passage from disorder to order is being prepared. Its condition is caution, like an old fox on ice, listening for the crack at every step. Rushing the last stretch undoes everything.",
im:"Fire above water. Discern things with care and put each in its proper place. To bring forces into order, first know the nature of each and where it belongs.",
l:["Wetting the tail: regret. In a time of disorder one is tempted to push ahead to achieve something visible. Too early: hold back.",
"Dragging the wheels; constancy, good fortune. The time to act is not yet. But waiting must not become idle: build the strength that will be needed, and keep the goal in view.",
"Not yet across; marching on brings misfortune; good to cross the great river. The moment of transition has come and your own strength is not enough. Forcing it fails. Make a new situation, with able helpers, and cross together.",
"Constancy, good fortune, regret vanishes. Rousing oneself to attack the Demon Land; after three years, rewards from a great state. Now the struggle must be fought through, with no doubts. It lays the foundation of what comes after.",
"Constancy, good fortune, no regret. The radiance of the noble person; there is trust: good fortune. The victory is won. The brightness of someone true makes itself felt, and people believe.",
"Trust shared while drinking wine: no fault. Soaking the head, trust loses what is right. At the threshold of the new time, among friends. Celebration is right. Excess throws away what was gained."]};

// Mo: condensed readings written for this app. Order of c: family/property/life, intentions and aims,
// friends and wealth, enemies, guests, illness, harmful spirits, spiritual practice, lost article,
// will they come / will the task be done, all remaining matters. r = supports; k = closing name.
window.MOX={
1:{lead:"A sky with no stain in it. The answer asks you first to listen: let the mind settle, clean and even, before you act.",sign:"The sound of threefold emptiness.",
c:["No harm touches household, belongings or life; they will be glad.","Equanimity leaves nothing in the way. This is the best of all answers for turning aside negative forces and bad omens; earlier troubles are set right, and reliance on the buddhas and bodhisattvas brings quick results.","You have them now, but they will be hard to keep. To hold them, offer flowers to the Prajñāpāramitā.","None.","A smooth, comfortable journey.","You are well.","Nothing is troubling you.","Success in dropping unwholesome habits and in meditation; faults and obscurations are purified.","Found if it is still near where you left it; otherwise hard to recover.","An even chance either way. It can be done, but slowly.","An average chance for anything else you ask."],
r:"Take Vajrasattva as your deity and recite the hundred-syllable mantra; recite a long, middle or short Prajñāpāramitā sūtra. Ākāśagarbha is also suitable.",k:"The giving of fearlessness"},
2:{lead:"Sunlight with nothing in front of it. Whatever you ask is settled clearly and without reserve, and settled well.",sign:"Dustless and clear.",
c:["Good, provided you keep working at what is wholesome.","They turn out well once you cut the net of doubt you have wrapped around yourself.","A slight improvement, helped by shining things (crystal, gems) or red things.","None.","They travel easily, and you will receive exact and pleasant news of them.","A quick recovery.","No trouble from spirits.","Practice increases intelligence, learning and reflection.","Search south-west of where it was lost; someone will bring news of it.","The meaning of the matter will become plain to you.","Quite good overall. Slightly poor only for work with earth, houses and things that serve as supports, such as tables."],
r:"Rely on wisdom deities such as Mañjuśrī, offer butter lamps and prayer flags, and recite sūtras such as the one that dispels the darkness of the ten directions.",k:"The departing of darkness"},
3:{lead:"Moonlight like nectar across the sky. Peaceful, increasing and virtuous activity is certain to succeed.",sign:"Enjoying the objects of the senses where no obstacles have gathered.",
c:["Cleansing and washing rituals favour the household; the family can grow.","No obstacles. Gentle means work; force and harshness produce nothing here.","White things, food and drink increase.","None.","A comfortable journey and an early arrival.","Quick recovery from cold and digestive complaints.","None at all.","A virtuous mind, and virtue grows.","Ask a woman to look to the south or north of where it was lost.","It will be accomplished.","Good for anything involving women and for easy, unstrenuous work. Slightly poor for anything involving fire."],
r:"Rely on female deities such as White Tārā and Uṣṇīṣavijayā; recite a sūtra in which women receive the prediction of awakening; water offerings and washing rituals; offerings to nāgas; any guru yoga.",k:"Dense, good clouds"},
4:{lead:"A very bright star. Work steadily and with care and the result is good.",sign:"What has been beautifully gathered does not scatter.",
c:["They go well; hang prayer flags and burn incense.","Good for going, travelling, moving, and for acts of giving.","Wooden things, animals, green cloth, and also news and letters come to you.","None.","A comfortable journey; they arrive very soon.","A wind disorder with mental agitation, not serious. Honouring ancestors and offering to tree spirits helps.","None; the only fault is too many restless, fickle thoughts. Steadiness of mind puts it right.","Any practice bears fruit, especially done somewhere other than your usual place.","Someone has taken it, but a quick search to the north or east may still find it.","It will be accomplished.","Positive, though anything involving water is slightly unfavourable."],
r:"Rely on activity deities such as Green Tārā; offerings to the protectors; as many prayer flags as possible; circumambulation, prostrations, torma rituals; recite the Avataṃsaka and sūtras telling of buddhas and bodhisattvas travelling to other lands.",k:"Increasing the power of wind, like currents turning in the sky"},
5:{lead:"Ground of gold. Steady work is accomplished and gives good results, as good earth does.",sign:"A guess that cannot be made exactly, so the answer waits.",
c:["Very stable and in excellent condition.","Your intention is firm. Stay where you are and the plan will not miscarry.","Good in the long term, but it takes time.","None.","A good journey, but a while before they arrive.","A slight phlegm disorder, not serious but slow to clear. Fire ritual, wind-turned maṇi wheels and prayer flags help.","None. The trouble comes from the unsuitable earth and water of the place.","Good, especially practising continuously in one place.","One of your own people will find it; otherwise look to the east. If not found soon, it will be hard to find later.","It takes time. Do not be over-eager.","Good if done promptly. Unfavourable for anything of the air: sending letters, news and the like."],
r:"Rely on Śākyamuni, Acala and Ratnasambhava; wealth rituals; small clay stūpas, mantras carved on rock, images; offerings to the gods of the earth.",k:"If you stay here, the foundation becomes firm"},
6:{lead:"The vajra's tone, Vajra Sarasvatī. The mind's happiness grows as it does on hearing good news. Excellent for study of sciences, arts and scripture.",sign:"The goddess of mind increases measureless intelligence.",
c:["Life becomes firm and stable with long-life practice and the rituals of female deities.","You will achieve them.","A good chance of happiness.","None will arise; you are protected.","A happy, comfortable journey and a quick arrival.","It subsides.","Definitely none. Even where the omens look unpleasant, the situation is in fact favourable; prayer to your deity clears the confusion.","Practising Vajra Sarasvatī increases intelligence.","Found if you use skilful means.","Accomplished just as you wish.","All favourable. Peaceful activity, and anything involving women, is especially good."],
r:"Take Avalokiteśvara, Mañjuśrī or Vajrapāṇi as your deity; clear-light practice; recite the Samādhirāja Sūtra and the Cakrasaṃvara tantras; offerings to the mamos and to the peaceful protectresses, especially Makzorma and Rematī.",k:"That which moves to gladden and widen the intelligence"},
7:{lead:"A bright lamp. Your own mind is clear and able, as a lamp is able to clear the dark.",sign:"A bright lamp where there is no wind.",
c:["Favourable at present.","Do as you wish; it succeeds.","Good as things now stand.","None will arise; any you hear of are far away and cannot harm you.","Clear news of them, and a comfortable journey.","The illness will get worse.","None. The trouble comes from the force of earlier actions, and no harm follows.","No obstacles to practising on your own.","Search to the south-west of where it was lost.","Begin with diligence and it is accomplished without obstacle.","No fault in whatever you undertake."],
r:"Read sūtras such as the Bhadrakalpika; rely on lotus-family deities such as Amitāyus, Kurukullā and Mārīcī; the protector Tsi'u Marpo; clear roads and paths; fire rituals.",k:"The one who helps oneself"},
8:{lead:"Butter poured onto the flames: Hayagrīva appears. Every activity of power goes well.",sign:"Adding butter again and again to the burning flame of desire.",
c:["They increase, and the body gains in radiance.","Quickly accomplished, with clear news. Completing the mantra count of a ḍākinī practice sharpens and widens your activity.","Dry and red things increase; fire rituals of magnetising add much to your happiness.","None oppose you. If you must contend, the opening is from the east or the centre.","They arrive soon and comfortably.","Heat, blood and contagious illnesses need both treatment and ritual; other illnesses clear quickly.","None; but you are engaged in a large and badly planned undertaking, and that is the trouble. Offerings to the worldly gods help.","Virtue and the activities of power increase.","Found to the south or west of where it was lost.","Quickly accomplished.","All good, except work with firm things, earth and water, which is very bad: like a pond boiled dry."],
r:"Rely on the wrathful lotus family, Hayagrīva and the deities of power; recite the Avalokiteśvara scriptures such as the Amoghapāśa.",k:"Increasing the display of joy"},
9:{lead:"The demon of death. The image is destruction: a spark put out by a little water. What is undertaken now fails.",sign:"Killing, death and ruin.",
c:["Great obstacles, to life itself. Clean the dust from scriptures and have a wrathful torma ritual performed.","Heavily obstructed; they will not succeed. Postpone.","None, and obstacles in seeking them.","There are enemies. Avoid travelling south or north.","An uncomfortable journey with obstacles on the road. Sitātapatrā's ritual helps.","Serious danger, especially with cold disorders or fluid in the body. Mantra and protector rituals must be done quickly and diligently.","Harm through impure drink, dark or black objects, things from a house in mourning, clothes mixed with those of the sick, or broken commitments. A releasing ritual of Tārā or Vajrakīlaya and offerings to nāgas; guard against trouble from where you do not expect it.","Great obstacles. Refuge prayer a hundred thousand times; the Amitāyus sūtra and dhāraṇī as often as possible.","Gone to the south or north; you will not see it again.","A wrong intention is involved; it is blocked.","Bad for everything except acts of destruction."],
r:"Long-life practice above all (Amitāyus), refuge, torma and releasing rituals, recitation of sūtras. Do not begin anything new until these are done.",k:"The activity that accomplishes destruction"},
10:{lead:"The king of power. Strength rises of itself, like a forest fire fanned by wind; forceful activity has a sharp edge now.",sign:"Power given to those who enter here; the roar of tigers and lions.",
c:["Your strength is growing; nothing can harm you.","Whatever you wish is achieved. Act in line with the heart practice of your own deity.","Wealth increases, especially green things and oblong or oval things.","None stand against you; you prevail.","A comfortable journey, a quick arrival, and benefit from the meeting.","The illness flares, but there is no danger. Offer to the protectors.","None; the protectors guard you. What you have offered them so far is not enough: offer more.","Whatever you aim at is well achieved.","Recovered by insistence.","Rely on your deity and they come, and all is done.","Favourable, with increasing strength. Only middling for anything to do with water."],
r:"Vajrakīlaya, the wrathful form of Guru Padmasambhava, and your own deity; praise of the protectors; incense and prayer flags; Gaṇapati, Mahākāla and Rāhula.",k:"Increasing power and strength"},
11:{lead:"A dried-up tree. No result at all, as no fruit comes from dead wood.",sign:"A mind always afflicted never gets what it wants; that is suffering.",
c:["No fault for now, but later they will not go well. Middling overall.","Like a fire that flares and sputters out: hard to accomplish.","None.","Minor ones, unable to do you real harm.","They tire on the road and arrive late.","A passing bile disorder, not harmful.","Trouble arising from attachment to relatives who have died, without real harm. Do something for them out of gratitude; repair your relation to the gods of the place and the earth.","Too many wishes at once: like a child chasing a rainbow.","Stolen and hidden; hard to recover.","Your wishes are steered by others and your activity is dreamlike; results will be hard to see.","Not good, least of all for obtaining happiness or some particular thing. Postponing brings benefit."],
r:"Recite the Daśacakra Kṣitigarbha Sūtra and the Suvarṇaprabhāsa Sūtra; the Mañjuśrī root tantra; wealth rituals; gather merit.",k:"Without essence, beyond grasping"},
12:{lead:"The door of auspicious visions, guarded from the south. A good answer: the eye of wisdom opens.",sign:"Calling the goddess of the west as a friend.",
c:["Fortune increases and the quality of life is good.","Success if you follow the advice of a good friend. Divination with mirrors and the like also succeeds.","Gained through diligence.","None.","A comfortable journey; they arrive soon.","Rituals done for the sick person improve the chance of a quick recovery.","None.","Good, especially any practice that purifies and restores the precepts.","Search south or west of where it was lost.","It will be accomplished.","All good; turn your mind quickly away from anything unsuitable."],
r:"Red Yamāntaka; the lotus family, Mārīcī, the protector Dorje Lekpa; read sūtras and tantras; many butter lamps; the prayer to Guru Padmasambhava as often as you can.",k:"Advice from a helpful friend"},
13:{lead:"A vase of nectar. Peaceful activity is accomplished, as a vase fills with nectar.",sign:"Drink the nectar and gain deathlessness.",
c:["Good.","No obstruction; you achieve your aim. Great benefit in fulfilling the teacher's wishes exactly.","As from a wish-granting vase: friends and means serve you.","None; minds are at peace.","Safe and quick, though a child among them may meet a difficulty and come later.","Treatment and ritual work like nectar and help quickly.","None at all.","Peaceful activity is good; rely on Vairocana, the Medicine Buddha, Akṣobhya and other deities that purify obscurations.","Look to the south, or near a pond or stream.","Done, and without regret, though less satisfying than you had imagined.","All turns out well, except anything involving poison."],
r:"Washing rituals, rituals for the dying and the dead, confession and other purification.",k:"The activity of relatives and peaceful people"},
14:{lead:"A pool with no spring feeding it. Resources decline, as a stream stops when its source is cut.",sign:"What use is a castle built on the sand of the shore?",
c:["No problem in the near term; slightly unfavourable in the long run. Gather merit.","Middling; no help can come from friends.","Something is obtained, but it neither lasts nor helps.","More numerous and stronger than you think, yet unable actually to harm you.","They regret the journey without failing in it, and arrive late.","Physical disturbance and marked ill health. Repayment and substitute rituals, as many as possible.","A little trouble from an object once owned by a couple who parted in resentment; since it cannot be traced, the harm is small.","No good result: indecision, mixed motives and unsound method. Confession, the Prayer of Samantabhadra, the sūtras, and above all the prayer and mantra of Guru Padmasambhava. Where faith is lacking, it must be raised.","Unusable even if found.","You will begin, but a good result is hard to obtain.","Unfavourable, especially for forming relationships. A change of place or of timing helps."],
r:"Offer food and necessities to the Saṅgha; rely on the ḍākinīs, such as Siṃhamukhā; burnt-food offerings, substitute and repayment rituals.",k:"The lessening of happiness"},
15:{lead:"An ocean of nectar. Resources increase as the great ocean is full of water.",sign:"The summer river rises (words of Uṣṇīṣavijayā).",
c:["Good now, and increasing.","Much prosperity and favourable conditions.","Inexhaustible, like the sea.","None arise; old ones are reconciled.","A comfortable journey; on time.","A cold disorder is not serious; with a water disorder the prospect is only fair.","None; the only danger is attachment growing through company.","Very good; peaceful practice brings its accomplishment.","Found by a relative, or by searching north or south.","Everyone concerned is in harmony; it is done without effort.","Favourable; food and drink increase, and anything with water is good. Betrothal and marriage, and work with fire, are less good."],
r:"Recite the Avataṃsaka and dhāraṇīs; clean images; offerings to nāgas. Lesser illnesses and disturbances can be calmed.",k:"The washing that cleanses"},
16:{lead:"The demon of the afflictions. Happiness is undermined, as currents tear away the seabed.",sign:"The ocean stirred to mud by the tail of a malicious nāga.",
c:["Obstruction and great disturbance.","Whatever you aim at brings unrest and unhappiness.","Unfavourable: dust carried off by the wind.","Probably there is one; harm from the east or north, and possibly a legal dispute.","Danger on the road: losing the way, breakage, a fall.","Wind disorders and trouble in the channels and tendons that hampers movement. Torma offerings, the Prayer of Samantabhadra, releasing animals, the four-maṇḍala ritual of Tārā, Acala.","Harm linked to quarrels, hostile talk and gatherings where people fight; perhaps ill will directed at you.","The mind is disturbed and commitments are at risk. Rely on Acala, hang prayer flags, clean the dust from Dharma books.","In the wrong hands; not recovered.","With the mind this disturbed, hard to accomplish.","Unfavourable; mental agitation is great. Only divisive acts would succeed."],
r:"Build small yellow clay stūpas; Acala; Tārā; quieten the mind before deciding anything.",k:"The boiling of agitation"},
17:{lead:"A golden lotus. Any aim succeeds, as green crops ripen to gold: the harvest that needed no plough.",sign:"A garden of mandārava flowers wet with a rain of nectar.",
c:["Excellent conditions.","They get better and better.","They increase and help you greatly; rituals of Vasudhārā, Vaiśravaṇa and Jambhala add to it.","None.","Comfortable and successful, though rather slow.","Cured gradually.","None. Many people look to you, and you can be of use to them.","Good intentions grow, and your teaching gathers people like bees. Rely on peaceful deities such as white Vajravārāhī; recite the Lalitavistara.","It will be found, if not now then later.","Accomplished gradually.","Not so strong for the moment; it becomes good by degrees."],
r:"Wealth deities; an image of a protector; the Lalitavistara and the Bodhisattvapiṭaka sūtras for happiness to come.",k:"Increasing happiness"},
18:{lead:"Medicine like nectar, at the northern door. Benefit comes through it: clouds of the essence of gold are gathering.",sign:"Arriving at the happy stream in the golden south.",
c:["All good.","Accomplished exactly as you picture it, and the fulfilment nourishes you. Pratisarā supports this.","Gains and means increase greatly.","None.","A comfortable journey; on time.","Cured if you follow the doctor's advice.","None now; what was troubling you has gone.","Your conduct is pleasing, and practice goes as you wish.","Search south or north and you will certainly find it.","They come, and the task is done.","As successful as everything above. Helping others let go of ill intent is good."],
r:"Peaceful activity through Akṣobhya, Vajravidāraṇa and Amṛtakuṇḍalin; Guru Padmasambhava, the jewel family and wealth deities; White Mahākāla; blue prayer flags.",k:"Goodness alike throughout"},
19:{lead:"The white umbrella of good fortune. Fortune rises as the umbrella lifts and flutters.",sign:"A flower garden that ripens in its season.",
c:["In good condition.","Fulfilled, with good news; Siṃhamukhā's practice helps. But some of your decisions will come to nothing and others' promises leave no trace, like a bird's track in the sky.","Good news is likely, with offerings to the wealth deities.","None; no need for apprehension.","Comfortable; they arrive soon.","A quick recovery.","Nothing but your own imputations: the trouble has no cause beyond the habits of your own thinking.","Successful.","An average chance.","There is an obstruction: this particular undertaking will not take place.","Called 'giving breath': relief and renewed life for what you ask about."],
r:"Dhvajāgrakeyūrā, Tashi Lhamo, Mahāmāyūrī; prayer flags and prayer wheels; the protector Pehar.",k:"Whatever road one wishes to take, one arrives safely"},
20:{lead:"The great fiery weapon. Success, as one is rewarded for courage after prevailing over everything.",sign:"Yamāntaka's roar: defeat the enemy, subdue Māra.",
c:["Very good, with steady protector practice.","Victory in every direction, most of all for forceful Dharma activity.","Obtained by effort and force.","All are overcome.","They come quickly, having succeeded.","Cured.","They cannot so much as look at you. You are strong enough to hold other minds in your sway; meet them with compassion.","Activities of power give clear results.","Found.","Certain to be accomplished.","Strength shown in every matter. Work with earth and water meets difficulty."],
r:"Yamāntaka, Hayagrīva, Mahākāla, Vajrakīlaya, Vajrapāṇi and the activity family (Amoghasiddhi); practices of inner heat.",k:"Subduing all others by being fully endowed"},
21:{lead:"Empty of intelligence. Thoughts are hollow, like wind passing through an empty valley.",sign:"Who can catch a sheet of white paper carried off by the wind?",
c:["Unfavourable conditions, with danger of separation and scattering; ritual still helps.","You are worrying and wearing yourself out over something small.","Even what is in your hand leaks away like water through cupped fingers.","Someone friendly at first, later hostile. Nothing is worse than arguing with them: keep your distance and be generous.","They return empty-handed or struggle to do what they came for.","A slight cold or wind disorder, the elements out of balance. Afflictive states are fed by poor company; stepping away brings relief.","No great harm; a substitute ritual is still advised.","The mind is very agitated; wishes are hard to fulfil.","Hard to recover.","Hard to accomplish.","Not achieved as you wish; people will probably not listen to your advice."],
r:"Steady the mind, gather merit, read the Vinaya and recite collections of sūtras.",k:"Scattering the mind into pieces"},
22:{lead:"The streamer of fame. Renown increases, as the drum of the gods sounds after victory: the young garuḍa in flight.",sign:"Time to proclaim in every direction, like a flag raised on a summit.",
c:["Positive, and fortune grows. Where excess piles on excess, though, take things in small pieces.","Wishes are fulfilled; with diligent protector practice, whatever has been begun is completed.","Probably obtained quickly.","There may be a contest; you prevail.","Comfortable journey, quick return, and news of them.","A wind imbalance; no danger.","None.","Great success, and wide recognition.","Probably found soon, to the north-east.","They will come.","Successful and stable. Good for travel, speed and for clearing things out; difficult for work with earth and water."],
r:"Offerings and praises; protection against ill will; Nīladaṇḍa and the activity deities; offerings such as tea and scarves.",k:"Quick settlement and fame"},
23:{lead:"The māra of the aggregates. Household, life, friends and means are not favoured, like a tree cut through the middle. Long mantra recitation and torma rituals are called for.",sign:"Cut the plants with a sickle.",
c:["Unfavourable.","A great obstruction; the wind-horse does not run. Recite Guru Padmasambhava's prayer that clears obstacles from the path, and Tārā.","Poor, both for helpful friends and for gathering means.","Probably there is one; you may be pressed down if you stay in the east or centre. Think ahead to avoid a reprimand from those above you.","Obstacles on the road, a late arrival, regret at having set out.","A strong phlegm disorder with difficult breathing; rituals are needed.","Trouble from the spirits of earth and place, tied to a yellow object, a square house or thing, or something received from a priest's hand; behind it, rivalry with those who were there before you. A washing ritual.","You think of the path and are drawn off it. Clear roads, mend paths, rely on Tārā.","The meat is already in the lion's mouth.","Much commotion; not accomplished.","Not favourable."],
r:"Long recitation of mantra, torma rituals, the Barché Lamsel prayer, Tārā, washing rituals.",k:"Pressed down by a great hill"},
24:{lead:"The house of good tidings, at the eastern gate. Good work is accomplished: the wish-granting tree.",sign:"Adorn your work with the streamers of enlightened activity.",
c:["Good and sudden results; informing others is especially good.","Successful and quick; relations with others are good.","Success with immediate effect; passing on news is especially good.","None; a pleasant time.","Comfortable, in good company, and soon.","Cured.","None.","Good intentions; your practice grows.","Found to the east or north.","Completed, and matters are settled.","Success in line with your wishes. Good to study and to teach the Dharma."],
r:"Activity-family deities such as Tārā, Uṣṇīṣavijayā and Parṇaśavarī; four-armed Mahākāla; sūtras of the Ratnakūṭa; conch shells sounded, streamers raised.",k:"Joyful news spread abroad; arrival at the summit"},
25:{lead:"The golden mountain. Firmness and stability, as a golden mountain is seen rising high.",sign:"The unchanging auspicious emblem.",
c:["Firm and steady.","Excellent; they will bring stability to your life.","What you already have stays, held by steadiness.","None; your position is secure.","Neither lost nor harmed, but slow to arrive.","None.","None at all.","Firm and good through strength and constancy.","It has not passed into other hands.","What is already begun succeeds, even if set aside for a while in favour of something else.","Generally successful; travel elsewhere meets delay."],
r:"The Avataṃsaka and Vinaya sūtras; the vajra family; Kṣitigarbha; mantras of Locanā, Vaiśravaṇa and Jambhala; images and stūpas; steady activity.",k:"Holding one's own place and not moving"},
26:{lead:"The māra of the son of the gods. An ill fall of the dice, like fire taking a good house.",sign:"When the fire of desire blazes, it is oneself that burns.",
c:["Instability and great obstruction.","Even if completed, the result is empty.","Like the ash of burnt silk.","There are some; harm comes especially from the south-west.","Great danger to people and goods on the road.","A hot, blood or contagious illness, and serious.","Harm linked to a red or triangular object, or to meat and blood from the west; do not burn refuse in the hearth.","A great obstacle: many peaceful fire rituals and washing rituals, medicines, and the prayers and mantra of Guru Padmasambhava.","Not found.","In danger of failing; the obstacle is large.","Not successful."],
r:"Peaceful fire and washing rituals; severance (chö) practice; Guru Padmasambhava.",k:"The person's aggregates harmed by suffering"},
27:{lead:"The jewelled vessel brimming with grain. Prosperity increases: the wish-granting cow.",sign:"The golden vase and the nectar in it, beautiful together (words of White Mañjuśrī).",
c:["Positive and happy.","The mind's happiness grows.","Food, means and friends return and increase.","Neither thieves nor enemies.","Their purpose succeeds; a little late, they arrive happily.","Cured, and gladness follows.","None. What looks like an attack is in fact a favourable condition.","Good, and successful.","Found in the east or centre of your area, or south of where it was lost.","If not yet come or begun there is some regret, but it will be done as wished.","Stay glad and content."],
r:"Receive empowerments; wealth deities and the jewel family; the development stage and essence-extraction practice; feast offerings; offerings to protectors and nāgas; the Vairocana tantra; Gaṇapati.",k:"The good field that increases happiness"},
28:{lead:"A mountain of sand. The results of your aims are spoiled and blown about like dust.",sign:"The golden house is levelled, little by little, into dust.",
c:["Steadily diminishing.","Great changes, ending in decline.","Nothing new comes, and what was gathered shrinks.","Your prosperity may be struck suddenly; protective rituals are needed.","You will be glad to see them, but their news brings regret and sorrow.","Slight, and curable through ritual.","No great spirit, but your perceptions are stirred and unsettled by ingrained habits of faulty action and decision. A peaceful fire ritual; verses of auspiciousness recited by the Saṅgha.","The outlook is poor; goals are hard to reach.","Harder to find the longer it is left.","Difficult; and no benefit even if done.","No meaningful result, except for work of taking apart."],
r:"Recite the Ratnakūṭa and Maṅgala sūtras and prayers to Guru Padmasambhava many times; build a bridge; have scriptures written in gold.",k:"The mountain dwindling into dust"},
29:{lead:"The mansion of gold. Everything is good, ample and stable, like a celestial palace.",sign:"A jewel mountain set on a ground of gold: a wonder.",
c:["Like an inexhaustible treasure; excellent through steadfastness.","Firm as earth and mountain, so good; delay is possible. Offer to the deities of wealth and earth.","Very ample in time to come.","None.","Delayed, but they arrive safely and the trip succeeds.","Long and serious, yet without lasting harm; and no further illness readily follows.","No cause for any harm.","Steadfast in vows; wishes fulfilled.","Still where it was lost. If it has been moved, hard to recover.","Likely delayed unless settled quickly.","Good if not delayed. Poor for unsettling moves: leaving a post, relocating, new places, petitions. Good for securing, binding and increasing."],
r:"Shrines to wealth deities such as Vasudhārā; stūpas; a treasure vase in the house; mantras of Locanā and Kṣitigarbha; Bernakchen Mahākāla.",k:"One great thing set upon another"},
30:{lead:"The treasury of jewels, at the western gate. Complete prosperity, like a treasury thrown open.",sign:"Opening the treasury door in the east; butter from milk, gems from the sea.",
c:["No changes ahead; good.","Excellent and firm; the outlook is positive.","Whatever you wish is fulfilled.","None arise.","A successful and comfortable journey.","It clears gradually.","None whatever.","Very good. Rely on the vajra family and the three lords of the families, and on Mahākāla.","Close to where it was lost.","Accomplished in the long run.","Successful."],
r:"Seek the blessing of the jewel family; offerings to nāgas, earth deities and local deities.",k:"A building of many storeys"},
31:{lead:"Mañjuśrī appears. Whatever is wished for is fulfilled, like a gem dropping into the hand.",sign:"The play of primordial wisdom, pure awareness, spreads in every direction.",
c:["Firm and unobstructed.","Have no doubt: an authority without deceit is present here. Study and contemplate the teachings, especially mantra.","They keep increasing.","Opponents come to you with respect.","Comfortable and successful.","It heals of itself.","None now and none to come; nothing to fear.","Good; happiness of mind increases and wishes are fulfilled.","Found.","They come, and it is done.","All your aims are fulfilled."],
r:"Mañjuśrī, Padmasambhava, Kālacakra; the illusory body and the Great Perfection; Nyenchen Thanglha and Mahākāla as protectors; establish images, scriptures and stūpas.",k:"Lord of the thirty-six cities; wisdom increased, excellence accomplished"},
32:{lead:"The endless knot. A sight that delights the mind, as on entering a flower garden.",sign:"Intelligent one, look at this wonder with your own eyes.",
c:["Not just good: excellent.","Your intentions are fitting and succeed. Good fortune for the people, home and events around you; whatever you decide, harmony follows.","Both come, with joy.","None.","Comfortable; they arrive soon.","Cured soon.","None, and no cause for any; be at ease.","Wishes fulfilled; progress begins to show.","Found quickly.","Done, and they come.","Do what you think right."],
r:"Sarvanivāraṇaviṣkambhin, Uṣṇīṣavijayā, Sitātapatrā; Cakrasaṃvara and Vajrasattva; Guru Padmasambhava's prayer for the spontaneous fulfilment of wishes. Simply continuing with the deities and protectors you already hold dear brings good fortune.",k:"Friendly desire"},
33:{lead:"The golden fish. Agility and good luck increase, like a fish darting through the sea.",sign:"Bathing in nectar, happiness grows.",
c:["Good prospects.","Favourable and successful.","They come in plenty.","No chance to harm you.","Comfortable; they arrive quickly.","Cured.","None.","Good; progress is made.","Recovered.","It comes to fruition in time.","Smooth, good and successful. Studying medicine is favoured."],
r:"The Ratnakūṭa and Smṛtyupasthāna sūtras and other short sūtras; peaceful and increasing fire rituals; Maitreya as your deity.",k:"Acting in line with one's intentions, wishes and aims"},
34:{lead:"The white conch of the Dharma. Renown and fortune grow like the conch's clear sound.",sign:"One's thoughts become known like a pleasing melody.",
c:["Positive; good news arrives.","Successful, with good tidings. Teaching languages, debate and logic is favoured.","Very clear news comes.","None.","They arrive with good news.","No danger to life, though the mind is agitated and unsettled.","None.","Recognition comes.","Clear news of it.","They come, and it is done.","Do as you wish; others will agree with you."],
r:"Samantabhadra as your deity; the Dhvajāgra sūtra and dhāraṇīs; four-faced Mahākāla.",k:"Increasing good news and fame"},
35:{lead:"The golden wheel. Prosperity and well-being, like a prince coming into a kingdom.",sign:"The wonder of finding a treasure without effort.",
c:["Stable and good.","Steady over the long run; you will stand foremost in worldly affairs.","They increase.","They come under your control.","Successful and glad.","No danger, but slow to mend.","None.","Good fortune and success.","Possibly found at a later time.","Some delay; the future is good.","Success in the long run."],
r:"Yamāntaka, Heruka, Vairocana; Uṣṇīṣacakravartin; the dhāraṇī of victory over Māra; Pañjaranātha and four-faced Mahākāla.",k:"Ascending the throne"},
36:{lead:"The jewelled banner of victory. You prevail and excel, the banner raised over every direction; whatever you wish to do can be done.",sign:"Rely on the wish-fulfilling king and results grow greater and greater: a wonder.",
c:["Nothing diminishes; the life force is firm as diamond, with no present concern about illness or death.","Very well fulfilled.","Gathered; your aims are met beyond what you expected.","None.","A comfortable journey and a safe arrival.","It heals of itself.","None, and no cause for any.","Clear and bright as the moon among stars; diligent practice of your deity brings great attainment, and the study of logic goes especially well.","Found if you follow a close friend's advice.","Everything works out smoothly.","All succeed; do as you wish."],
r:"Gather more virtue; Vajrakīlaya, Hevajra, Guhyasamāja, Vajrapāṇi; six-armed Mahākāla; the Great Perfection texts and the Mañjuśrīnāmasaṃgīti; Gesar as protector.",k:"Hoisting the jewelled banner of victory"}
};

window.ICX_PT={};var ICX_PT=window.ICX_PT;
ICX_PT[1]={j:"Pura força criativa, seis linhas inteiras. O que você começa agora tem poder para seguir da origem à conclusão, com uma condição: manter-se fiel ao que é correto e perseverar. O êxito aqui não é sorte; nasce da força usada com constância.",
im:"O movimento do céu nunca se detém. Tome-o como modelo: torne-se forte sem trégua, por meio de um esforço constante, renovado a cada dia, e não de um único impulso heroico.",
l:["Um dragão escondido nas profundezas; não o use. A força é real, mas seu tempo ainda não chegou. Não aja ainda, e não deixe que a impaciência ou a opinião alheia o façam mostrar-se cedo demais.",
"Um dragão aparece nos campos; é bom encontrar uma grande pessoa. Sua capacidade começa a ser vista. Procure alguém de real estatura, uma pessoa ou um ensinamento com que se medir.",
"Ativo e incansável do amanhecer ao entardecer, vigilante à noite: há risco, mas nenhuma falta. O trabalho e a responsabilidade crescem, e com eles o perigo de deixar-se levar. Manter-se atento e autocrítico o protege.",
"Talvez salte, talvez permaneça nas profundezas: nenhuma falta. Uma escolha real entre sair para o mundo e recolher-se para aprofundar-se. Ambas são corretas se forem fiéis à sua natureza.",
"Um dragão em voo pelo céu; é bom encontrar uma grande pessoa. O ponto mais alto: uma influência natural e visível, e os que se pertencem encontram-se.",
"O dragão que vai longe demais tem motivo de arrependimento. A ambição que perdeu o contato com o chão, com os outros e com os limites acaba só. Saiba quando parar."],
all:"Quando as seis linhas mudam (todas noves): um bando de dragões, nenhum à frente. Força que não precisa pôr-se em primeiro lugar. Grande poder unido à brandura traz boa fortuna."};
ICX_PT[2]={j:"Pura força receptiva, seis linhas abertas. O caminho agora é o da égua: forte, incansável e disposta a ser guiada. Se tentar liderar, você se perde; se seguir e responder, encontra a direção. Busque companheiros onde está o trabalho e aceite a solidão onde as decisões são tomadas. A constância serena traz boa fortuna.",
im:"A terra é vasta e sustenta tudo, o bom e o mau. Conceda a si mesmo essa amplidão, para suportar pessoas e circunstâncias sem perder a forma.",
l:["Pisa-se a geada; o gelo duro virá. Um primeiro pequeno sinal de declínio ou frieza. Leia-o agora, enquanto ainda é fácil responder a ele.",
"Reto, quadrado e grande; sem necessidade de prática, nada sai errado. Seja simplesmente o que você é e faça o que a situação pede; nenhuma técnica é necessária.",
"Guardar o próprio brilho por dentro; é possível manter-se firme. Se você serve a uma causa maior, não busque o crédito; apenas leve o trabalho até o fim.",
"Um saco com a boca amarrada: nem falta, nem louvor. Tempo de completa reserva. Diga pouco, mostre pouco e mantenha-se longe do perigo.",
"Uma saia amarela: a maior boa fortuna. Valor real usado com discrição, numa posição que não é a primeira. Qualidade interior que se expressa pela modéstia.",
"Dragões combatem na planície aberta; seu sangue é negro e amarelo. O receptivo tentou governar em vez de servir, e ambos os lados saem feridos. Não transforme um papel de apoio numa disputa pela liderança."],
all:"Quando as seis linhas mudam (todas seis): a constância duradoura é favorável. Nem avançar, nem ceder: a força da resistência."};
ICX_PT[3]={j:"Dificuldade inicial: um broto que rompe a terra dura. A situação está cheia de possibilidades e ainda em desordem. O êxito vem pela constância, mas não tente ir a lugar algum ainda. Fique onde está, organize as coisas e encontre ajudantes; não tente fazê-lo sozinho.",
im:"Nuvens acima, trovão abaixo: a tempestade antes da chuva. Use este tempo para tirar ordem da confusão, separando e unindo os fios como quem prepara um tear.",
l:["Hesitante, rodeando: é bom permanecer e manter-se firme; é bom nomear ajudantes. Mantenha o objetivo à vista sem forçar o caminho, e aproxime-se das pessoas sem superioridade.",
"Preso e voltando atrás, cavalos dando voltas. Não são salteadores, são pretendentes. A jovem não se compromete; depois de dez anos, sim. Uma oferta de ajuda chega de um lado inesperado e não é o que parece. Não se comprometa ainda; a ligação certa vem a seu tempo.",
"Caçar o cervo sem um guarda-florestal que guie só leva ao fundo da mata. Vendo os sinais, é mais sábio desistir do que avançar para o que você não conhece.",
"Cavalos dando voltas; procure a união. Ir traz boa fortuna. Você não consegue sozinho, e existe uma abertura. Dê o primeiro passo em sua direção, ainda que custe algum orgulho.",
"Dificuldade em repartir a própria generosidade. Suas boas intenções ainda não inspiram confiança. Trabalhe em pequenos passos constantes; forçar algo grande agora termina mal.",
"Cavalos dando voltas; lágrimas de sangue correm. Alguém preso às primeiras dificuldades que desiste. Não permaneça aí: esse estado não deve prolongar-se."]};
