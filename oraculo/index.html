c:["Corre bem; pendure bandeiras de oração e queime incenso.","Bom para ir, viajar, mudar-se e para atos de generosidade.","Chegam objetos de madeira, animais, tecido verde, e também notícias e cartas.","Nenhum.","Viagem confortável; chegam muito em breve.","Um distúrbio de vento com agitação mental, nada grave. Honrar os ancestrais e fazer oferendas aos espíritos das árvores ajuda.","Nenhum; a única falha é o excesso de pensamentos inquietos e volúveis. A firmeza da mente corrige isso.","Qualquer prática dá fruto, sobretudo feita em lugar diferente do habitual.","Alguém o levou, mas uma busca rápida ao norte ou ao leste ainda pode encontrá-lo.","Será realizado.","Positivo, embora tudo o que envolve água seja ligeiramente desfavorável."],
r:"Confie em deidades de atividade como Tārā Verde; oferendas aos protetores; o maior número possível de bandeiras de oração; circum-ambulações, prostrações, rituais de torma; recite o Avataṃsaka e sūtras que narram budas e bodhisattvas viajando a outras terras.",k:"O aumento do poder do vento, como correntes girando no céu"},
5:{name:"O Chão de Ouro",lead:"Chão de ouro. O trabalho firme se realiza e dá bons resultados, como a boa terra.",sign:"Um palpite que não se pode fazer com exatidão; a resposta fica em suspenso.",
c:["Muito estáveis e em excelente estado.","Sua intenção é firme. Fique onde está e o plano não abortará.","Bons a longo prazo, mas leva tempo.","Nenhum.","Boa viagem, mas demorará até chegarem.","Um leve distúrbio de fleuma, não grave, mas lento para passar. Ritual de fogo, rodas de oração movidas a vento e bandeiras de oração ajudam.","Nenhum. O problema vem da terra e da água inadequadas do lugar.","Bom, sobretudo praticando continuamente num só lugar.","Alguém dos seus o encontrará; caso contrário, procure a leste. Se não for achado logo, será difícil depois.","Leva tempo. Não se entusiasme demais.","Bom se feito prontamente. Desfavorável para as coisas do ar: enviar cartas, notícias e afins."],
r:"Confie em Śākyamuni, Acala e Ratnasambhava; rituais de prosperidade; pequenas stūpas de argila, mantras gravados em pedra, imagens; oferendas aos deuses da terra.",k:"Se você ficar aqui, a base se torna firme"},
6:{name:"O Tom do Vajra",lead:"O tom do vajra, Vajra Sarasvatī. A alegria da mente cresce como ao ouvir boas notícias. Excelente para o estudo das ciências, das artes e das escrituras.",sign:"A deusa da mente faz crescer uma inteligência sem medida.",
c:["A vida se torna firme e estável com práticas de longevidade e rituais de deidades femininas.","Você os alcançará.","Boa chance de felicidade.","Nenhum surgirá; você está protegido.","Viagem feliz e confortável e chegada rápida.","Abranda-se.","Certamente nenhum. Mesmo onde os presságios parecem desagradáveis, a situação é na verdade favorável; a oração à sua deidade dissipa a confusão.","Praticar Vajra Sarasvatī aumenta a inteligência.","Encontrado se você usar meios hábeis.","Realizado exatamente como você deseja.","Tudo favorável. A atividade pacífica, e tudo o que envolve mulheres, é especialmente bom."],
r:"Tome Avalokiteśvara, Mañjuśrī ou Vajrapāṇi como sua deidade; prática da luz clara; recite o Samādhirāja Sūtra e os tantras de Cakrasaṃvara; oferendas às mamos e às protetoras pacíficas, sobretudo Makzorma e Rematī.",k:"O que se move para alegrar e ampliar a inteligência"},
7:{name:"A Lamparina Brilhante",lead:"Uma lamparina brilhante. A sua própria mente é clara e capaz, como a lamparina é capaz de dissipar o escuro.",sign:"Uma lamparina brilhante onde não há vento.",
c:["Favoráveis no momento.","Faça como deseja; há êxito.","Bom do jeito que as coisas estão.","Nenhum surgirá; os de que ouvir falar estão longe e não podem prejudicá-lo.","Notícias claras deles, e uma viagem confortável.","A doença vai piorar.","Nenhum. O problema vem da força de ações passadas, e nenhum dano resulta.","Nenhum obstáculo para praticar sozinho.","Procure a sudoeste de onde foi perdido.","Comece com diligência e se realiza sem obstáculos.","Nenhuma falha no que quer que empreenda."],
r:"Leia sūtras como o Bhadrakalpika; confie em deidades da família do lótus como Amitāyus, Kurukullā e Mārīcī; o protetor Tsi'u Marpo; limpe estradas e caminhos; rituais de fogo.",k:"Aquele que ajuda a si mesmo"},
8:{name:"Manteiga sobre as Chamas",lead:"Manteiga derramada sobre as chamas: aparece Hayagrīva. Toda atividade de poder corre bem.",sign:"Acrescentar manteiga vez após vez à chama ardente do desejo.",
c:["Crescem, e o corpo ganha em esplendor.","Realizados depressa, com notícias claras. Completar a contagem de mantras de uma prática de ḍākinī aguça e amplia a sua atividade.","Coisas secas e vermelhas aumentam; rituais de fogo de magnetização aumentam muito a sua felicidade.","Nenhum se opõe. Se precisar enfrentar, a abertura está a leste ou no centro.","Chegam logo e com conforto.","Males de calor, de sangue e contagiosos pedem tratamento e ritual; os demais passam depressa.","Nenhum; mas você está envolvido num empreendimento grande e mal planejado, e esse é o problema. Oferendas aos deuses mundanos ajudam.","A virtude e as atividades de poder aumentam.","Encontrado ao sul ou a oeste de onde foi perdido.","Realizado depressa.","Tudo bom, exceto trabalhos com coisas firmes, terra e água, que são muito ruins: como um lago que ferve até secar."],
r:"Confie na família do lótus em sua forma irada, em Hayagrīva e nas deidades de poder; recite as escrituras de Avalokiteśvara como o Amoghapāśa.",k:"O aumento da manifestação da alegria"},
9:{name:"O Demônio da Morte",lead:"O demônio da morte. A imagem é destruição: uma faísca apagada por um pouco de água. O que se empreende agora fracassa.",sign:"Matança, morte e ruína.",
c:["Grandes obstáculos, até à própria vida. Tire o pó das escrituras e mande fazer um ritual irado de torma.","Muito obstruídos; não terão êxito. Adie.","Nenhum, e obstáculos ao buscá-los.","Há inimigos. Evite viajar para o sul ou para o norte.","Viagem desconfortável, com obstáculos no caminho. O ritual de Sitātapatrā ajuda.","Perigo sério, sobretudo com males de frio ou acúmulo de líquido no corpo. Mantras e rituais aos protetores devem ser feitos depressa e com diligência.","Dano por bebida impura, objetos escuros ou pretos, coisas de uma casa enlutada, roupas misturadas às de doentes ou compromissos quebrados. Um ritual de libertação de Tārā ou Vajrakīlaya e oferendas aos nāgas; proteja-se do problema que vem de onde não se espera.","Grandes obstáculos. A oração de refúgio cem mil vezes; o sūtra e a dhāraṇī de Amitāyus tantas vezes quanto possível.","Foi para o sul ou para o norte; não voltará a vê-lo.","Há uma intenção errada envolvida; está bloqueado.","Ruim para tudo, exceto atos de destruição."],
r:"Prática de longevidade acima de tudo (Amitāyus), refúgio, rituais de torma e de libertação, recitação de sūtras. Não comece nada novo antes de fazê-los.",k:"A atividade que realiza a destruição"},
10:{name:"O Rei do Poder",lead:"O rei do poder. A força surge por si, como um incêndio na floresta atiçado pelo vento; a atividade enérgica tem um gume afiado agora.",sign:"Poder dado aos que aqui entram; o rugido de tigres e leões.",
c:["A sua força cresce; nada pode prejudicá-lo.","Tudo o que deseja é alcançado. Aja de acordo com a prática essencial da sua própria deidade.","A riqueza aumenta, sobretudo coisas verdes e coisas oblongas ou ovais.","Nenhum se opõe a você; você prevalece.","Viagem confortável, chegada rápida, e benefício do encontro.","A doença se agrava, mas não há perigo. Faça oferendas aos protetores.","Nenhum; os protetores o guardam. O que lhes ofereceu até agora não basta: ofereça mais.","O que quer que vise é bem alcançado.","Recuperado pela insistência.","Confie na sua deidade e eles vêm, e tudo se realiza.","Favorável, com força crescente. Apenas medíocre para o que se relaciona à água."],
r:"Vajrakīlaya, a forma irada de Guru Padmasambhava e a sua própria deidade; louvor aos protetores; incenso e bandeiras de oração; Gaṇapati, Mahākāla e Rāhula.",k:"O aumento do poder e da força"},
11:{name:"A Árvore Seca",lead:"Uma árvore seca. Nenhum resultado, como nenhum fruto vem da madeira morta.",sign:"Uma mente sempre aflita nunca alcança o que quer; isso é sofrimento.",
c:["Sem falha por ora, mas depois não irão bem. Medíocre no conjunto.","Como um fogo que se acende e logo se apaga: difíceis de realizar.","Nenhum.","Alguns menores, incapazes de causar dano real.","Cansam-se no caminho e chegam atrasados.","Um distúrbio passageiro de bile, não nocivo.","Problema nascido do apego a parentes falecidos, sem dano real. Faça algo por eles, por gratidão; repare a sua relação com os deuses do lugar e da terra.","Desejos demais ao mesmo tempo: como uma criança perseguindo um arco-íris.","Roubado e escondido; difícil de recuperar.","Os seus desejos são conduzidos por outros e a sua atividade é como um sonho; os resultados serão difíceis de ver.","Nada bom, sobretudo para obter felicidade ou alguma coisa em particular. Adiar traz benefício."],
r:"Recite o Daśacakra Kṣitigarbha Sūtra e o Suvarṇaprabhāsa Sūtra; o tantra-raiz de Mañjuśrī; rituais de prosperidade; acumule mérito.",k:"Sem essência, além de toda apreensão"},
12:{name:"A Porta das Visões Auspiciosas",lead:"A porta das visões auspiciosas, guardada do sul. Uma boa resposta: abre-se o olho da sabedoria.",sign:"Chamar a deusa do oeste como amiga.",
c:["A fortuna aumenta e a qualidade de vida é boa.","Êxito se você seguir o conselho de um bom amigo. A adivinhação com espelhos e afins também tem êxito.","Obtidos com diligência.","Nenhum.","Viagem confortável; chegam logo.","Rituais feitos pelo doente aumentam a chance de recuperação rápida.","Nenhum.","Bom, sobretudo qualquer prática que purifique e restaure os preceitos.","Procure ao sul ou a oeste de onde foi perdido.","Será realizado.","Tudo bom; afaste depressa a mente de tudo o que é impróprio."],
r:"Yamāntaka Vermelho; a família do lótus, Mārīcī, o protetor Dorje Lekpa; leia sūtras e tantras; muitas lamparinas de manteiga; a oração a Guru Padmasambhava tantas vezes quanto puder.",k:"O conselho de um amigo benéfico"},
13:{name:"O Vaso de Néctar",lead:"Um vaso de néctar. A atividade pacífica se realiza, como um vaso que se enche de néctar.",sign:"Beba o néctar e alcance a imortalidade.",
c:["Bons.","Nenhuma obstrução; você alcança o seu objetivo. Grande benefício em cumprir exatamente os desejos do mestre.","Como de um vaso que realiza desejos: amigos e meios o servem.","Nenhum; as mentes estão em paz.","Chegam salvos e depressa, embora uma criança entre eles possa ter alguma dificuldade e chegar depois.","Tratamento e ritual agem como néctar e ajudam depressa.","Absolutamente nenhum.","A atividade pacífica é boa; confie em Vairocana, no Buda da Medicina, em Akṣobhya e em outras deidades que purificam os obscurecimentos.","Procure ao sul, ou perto de um lago ou riacho.","Feito, e sem arrependimento, embora menos satisfatório do que você imaginava.","Tudo sai bem, exceto o que envolve veneno."],
r:"Rituais de ablução, rituais pelos moribundos e pelos mortos, confissão e outras purificações.",k:"A atividade de parentes e de pessoas pacíficas"},
14:{name:"O Lago sem Nascente",lead:"Um lago sem nascente que o alimente. Os recursos declinam, como um riacho para quando a fonte é cortada.",sign:"De que serve um castelo construído na areia da praia?",
c:["Sem problema no curto prazo; ligeiramente desfavorável a longo prazo. Acumule mérito.","Medíocres; nenhuma ajuda pode vir dos amigos.","Algo se obtém, mas não dura nem ajuda.","Mais numerosos e fortes do que você pensa, e no entanto incapazes de prejudicá-lo de fato.","Arrependem-se da viagem sem fracassar nela, e chegam atrasados.","Perturbação física e saúde frágil. Rituais de reparação e de substituição, tantos quanto possível.","Um pequeno problema ligado a um objeto que pertenceu a um casal que se separou com ressentimento; como não pode ser identificado, o dano é pequeno.","Nenhum bom resultado: indecisão, motivos misturados e método inadequado. Confissão, a Oração de Samantabhadra, os sūtras e, sobretudo, a oração e o mantra de Guru Padmasambhava. Onde falta fé, é preciso despertá-la.","Inútil, mesmo que encontrado.","Você começará, mas um bom resultado é difícil de obter.","Desfavorável, sobretudo para formar relações. Mudar de lugar ou de momento ajuda."],
r:"Ofereça alimentos e necessidades ao Saṅgha; confie nas ḍākinīs, como Siṃhamukhā; oferendas de alimento queimado, rituais de substituição e de reparação.",k:"A diminuição da felicidade"},
15:{name:"O Oceano de Néctar",lead:"Um oceano de néctar. Os recursos aumentam como o grande oceano está cheio de água.",sign:"O rio de verão sobe (palavras de Uṣṇīṣavijayā).",
c:["Bons agora, e crescendo.","Muita prosperidade e condições favoráveis.","Inesgotáveis, como o mar.","Nenhum surge; os antigos se reconciliam.","Viagem confortável; no horário.","Um mal de frio não é grave; com um mal de água, a perspectiva é apenas razoável.","Nenhum; o único perigo é o apego que cresce pelo convívio.","Muito bom; a prática pacífica traz a sua realização.","Encontrado por um parente, ou procurando ao norte ou ao sul.","Todos os envolvidos estão em harmonia; realiza-se sem esforço.","Favorável; comida e bebida aumentam, e tudo o que envolve água é bom. Noivado e casamento, e trabalhos com fogo, são menos bons."],
r:"Recite o Avataṃsaka e dhāraṇīs; limpe imagens; oferendas aos nāgas. Doenças e perturbações menores podem ser acalmadas.",k:"A ablução que purifica"},
16:{name:"O Demônio das Aflições",lead:"O demônio das aflições. A felicidade é minada, como correntes que arrancam o fundo do mar.",sign:"O oceano revolvido em lama pela cauda de um nāga malicioso.",
c:["Obstrução e grande perturbação.","Tudo o que você visa traz inquietação e infelicidade.","Desfavoráveis: poeira levada pelo vento.","Provavelmente há um; dano vindo do leste ou do norte, e possivelmente uma disputa judicial.","Perigo no caminho: perder-se, quebras, uma queda.","Males de vento e problemas nos canais e tendões que dificultam o movimento. Oferendas de torma, a Oração de Samantabhadra, libertar animais, o ritual das quatro maṇḍalas de Tārā, Acala.","Dano ligado a brigas, palavras hostis e reuniões em que as pessoas brigam; talvez má vontade dirigida a você.","A mente está perturbada e os compromissos correm risco. Confie em Acala, pendure bandeiras de oração, tire o pó dos livros de Dharma.","Em mãos erradas; não será recuperado.","Com a mente tão perturbada, difícil de realizar.","Desfavorável; a agitação mental é grande. Só atos de divisão teriam êxito."],
r:"Construa pequenas stūpas amarelas de argila; Acala; Tārā; aquiete a mente antes de decidir qualquer coisa.",k:"A fervura da agitação"},
17:{name:"O Lótus de Ouro",lead:"Um lótus de ouro. Qualquer objetivo tem êxito, como as plantações verdes amadurecem em ouro: a colheita que não precisou de arado.",sign:"Um jardim de flores de mandārava molhado por uma chuva de néctar.",
c:["Condições excelentes.","Ficam cada vez melhores.","Aumentam e o ajudam muito; rituais de Vasudhārā, Vaiśravaṇa e Jambhala os ampliam.","Nenhum.","Confortável e bem-sucedida, embora um tanto lenta.","Curada gradualmente.","Nenhum. Muitas pessoas olham para você, e você pode ser-lhes útil.","As boas intenções crescem, e o seu ensino reúne pessoas como abelhas. Confie em deidades pacíficas como Vajravārāhī branca; recite o Lalitavistara.","Será encontrado, se não agora, depois.","Realizado gradualmente.","Não tão forte no momento; torna-se bom aos poucos."],
r:"Deidades de prosperidade; uma imagem de um protetor; o Lalitavistara e o Bodhisattvapiṭaka para a felicidade futura.",k:"O aumento da felicidade"},
18:{name:"O Remédio como Néctar",lead:"Remédio como néctar, na porta do norte. O benefício chega por ele: reúnem-se nuvens da essência do ouro.",sign:"Chegar à corrente feliz no sul dourado.",
c:["Tudo bom.","Realizado exatamente como você imagina, e a realização o nutre. Pratisarā apoia isso.","Ganhos e meios aumentam muito.","Nenhum.","Viagem confortável; no horário.","Curada se você seguir o conselho do médico.","Nenhum agora; o que o perturbava foi embora.","A sua conduta agrada, e a prática corre como você deseja.","Procure ao sul ou ao norte e certamente o encontrará.","Eles vêm, e a tarefa se realiza.","Tão bem-sucedido quanto tudo acima. Ajudar os outros a abandonar más intenções é bom."],
r:"Atividade pacífica por meio de Akṣobhya, Vajravidāraṇa e Amṛtakuṇḍalin; Guru Padmasambhava, a família da joia e as deidades de prosperidade; Mahākāla Branco; bandeiras de oração azuis.",k:"A bondade semelhante em tudo"},
19:{name:"O Guarda-sol Branco da Boa Fortuna",lead:"O guarda-sol branco da boa fortuna. A fortuna cresce como o guarda-sol que se ergue e tremula.",sign:"Um jardim de flores que amadurece em sua estação.",
c:["Em boas condições.","Realizados, com boas notícias; a prática de Siṃhamukhā ajuda. Mas algumas das suas decisões não darão em nada, e as promessas alheias não deixarão rastro, como a pegada de um pássaro no céu.","Boas notícias são prováveis, com oferendas às deidades de prosperidade.","Nenhum; não há motivo de apreensão.","Confortável; chegam logo.","Recuperação rápida.","Nada além das suas próprias imputações: o problema não tem outra causa senão os hábitos do seu próprio pensamento.","Bem-sucedida.","Chance mediana.","Há uma obstrução: este empreendimento em particular não acontecerá.","Chamada 'dar alento': alívio e vida renovada para o que você pergunta."],
r:"Dhvajāgrakeyūrā, Tashi Lhamo, Mahāmāyūrī; bandeiras e rodas de oração; o protetor Pehar.",k:"Qualquer que seja o caminho que se deseje tomar, chega-se a salvo"},
20:{name:"A Grande Arma Flamejante",lead:"A grande arma flamejante. Êxito, como quem é recompensado pela coragem depois de prevalecer sobre tudo.",sign:"O rugido de Yamāntaka: derrotar o inimigo, subjugar Māra.",
c:["Muito bem, com prática constante aos protetores.","Vitória em todas as direções, sobretudo para a atividade irada do Dharma.","Obtidos pelo esforço e pela força.","Todos são vencidos.","Vêm depressa, tendo tido êxito.","Curada.","Nem sequer conseguem olhar para você. Você é forte o bastante para manter outras mentes sob a sua influência; responda-lhes com compaixão.","As atividades de poder dão resultados claros.","Encontrado.","Certamente será realizado.","Força mostrada em todos os assuntos. Trabalhos com terra e água encontram dificuldade."],
r:"Yamāntaka, Hayagrīva, Mahākāla, Vajrakīlaya, Vajrapāṇi e a família da atividade (Amoghasiddhi); práticas do calor interior.",k:"Subjugar todos os outros por ser plenamente dotado"},
21:{name:"Vazio de Inteligência",lead:"Vazio de inteligência. Os pensamentos são ocos, como o vento que passa por um vale vazio.",sign:"Quem consegue apanhar uma folha de papel branco levada pelo vento?",
c:["Condições desfavoráveis, com perigo de separação e dispersão; o ritual ainda ajuda.","Você está se preocupando e se desgastando por algo pequeno.","Até o que está na sua mão escorre como água entre os dedos.","Alguém amigável no início, depois hostil. Nada é pior do que discutir com essa pessoa: mantenha distância e seja generoso.","Voltam de mãos vazias ou têm dificuldade em fazer o que vieram fazer.","Um leve mal de frio ou de vento, os elementos em desequilíbrio. Os estados aflitivos são alimentados por más companhias; afastar-se delas traz alívio.","Nenhum grande dano; ainda assim, aconselha-se um ritual de substituição.","A mente está muito agitada; os desejos são difíceis de realizar.","Difícil de recuperar.","Difícil de realizar.","Não se alcança como você deseja; provavelmente as pessoas não ouvirão o seu conselho."],
r:"Firme a mente, acumule mérito, leia o Vinaya e recite coletâneas de sūtras.",k:"A mente espalhada em pedaços"},
22:{name:"A Flâmula da Fama",lead:"A flâmula da fama. O renome cresce, como o tambor dos deuses soa depois da vitória: o jovem garuḍa em voo.",sign:"Tempo de proclamar em todas as direções, como uma bandeira erguida num cume.",
c:["Positivos, e a fortuna cresce. Onde o excesso se acumula sobre o excesso, porém, tome as coisas em pequenas porções.","Os desejos se realizam; com prática diligente aos protetores, o que foi começado se completa.","Provavelmente obtidos depressa.","Pode haver disputa; você prevalece.","Viagem confortável, volta rápida e notícias deles.","Um desequilíbrio de vento; sem perigo.","Nenhum.","Grande êxito, e amplo reconhecimento.","Provavelmente encontrado logo, a nordeste.","Eles virão.","Bem-sucedidos e estáveis. Bons para viagem, rapidez e para expulsar o que incomoda; difíceis para trabalhos com terra e água."],
r:"Oferendas e louvores; proteção contra a má vontade; Nīladaṇḍa e as deidades de atividade; oferendas como chá e echarpes.",k:"Resolução rápida e fama"},
23:{name:"O Māra dos Agregados",lead:"O māra dos agregados. Família, vida, amigos e meios não são favorecidos, como uma árvore cortada pelo meio. Pede-se longa recitação de mantras e rituais de torma.",sign:"Corte as plantas com a foice.",
c:["Desfavoráveis.","Uma grande obstrução; o cavalo de vento não corre. Recite a oração de Guru Padmasambhava que remove obstáculos do caminho, e Tārā.","Fracos, tanto para amigos que ajudem quanto para reunir meios.","Provavelmente há um; você pode ser oprimido se ficar no leste ou no centro. Pense adiante para evitar uma repreensão dos superiores.","Obstáculos no caminho, chegada tardia, arrependimento por ter partido.","Um forte distúrbio de fleuma com dificuldade respiratória; são necessários rituais.","Problemas com os espíritos da terra e do lugar, ligados a um objeto amarelo, uma casa ou coisa quadrada, ou algo recebido da mão de um sacerdote; por trás, a rivalidade com os que estavam ali antes de você. Um ritual de ablução.","Você pensa no caminho e é desviado dele. Limpe estradas, conserte caminhos, confie em Tārā.","A carne já está na boca do leão.","Muita agitação; não se realiza.","Não favoráveis."],
r:"Longa recitação de mantra, rituais de torma, a oração Barché Lamsel, Tārā, rituais de ablução.",k:"Esmagado por uma grande colina"},
24:{name:"A Casa das Boas-Novas",lead:"A casa das boas-novas, na porta do leste. A boa obra se realiza: a árvore que realiza desejos.",sign:"Adorne a sua obra com as flâmulas da atividade iluminada.",
c:["Resultados bons e repentinos; informar os outros é especialmente bom.","Bem-sucedidos e rápidos; as relações com os outros são boas.","Êxito com efeito imediato; transmitir notícias é especialmente bom.","Nenhum; um tempo agradável.","Confortável, em boa companhia, e logo.","Curada.","Nenhum.","Boas intenções; a sua prática cresce.","Encontrado a leste ou ao norte.","Concluído, e as questões se resolvem.","Êxito de acordo com os seus desejos. Bom estudar e ensinar o Dharma."],
r:"Deidades da família da atividade como Tārā, Uṣṇīṣavijayā e Parṇaśavarī; Mahākāla de quatro braços; sūtras do Ratnakūṭa; soar conchas, erguer flâmulas.",k:"Boas-novas espalhadas; chegada ao cume"},
25:{name:"A Montanha de Ouro",lead:"A montanha de ouro. Firmeza e estabilidade, como uma montanha de ouro que se ergue alta.",sign:"O emblema auspicioso que não muda.",
c:["Firmes e estáveis.","Excelentes; trarão estabilidade à sua vida.","O que você já tem permanece, sustentado pela firmeza.","Nenhum; a sua posição é segura.","Nem perdidos nem feridos, mas lentos para chegar.","Nenhuma.","Absolutamente nenhum.","Firme e boa pela força e pela constância.","Não passou para outras mãos.","O que já foi começado tem êxito, ainda que posto de lado por algum tempo em favor de outra coisa.","Em geral bem-sucedidos; viagens a outros lugares encontram atraso."],
r:"O Avataṃsaka e os sūtras do Vinaya; a família vajra; Kṣitigarbha; mantras de Locanā, Vaiśravaṇa e Jambhala; imagens e stūpas; atividade constante.",k:"Manter o próprio lugar sem se mover"},
26:{name:"O Māra do Filho dos Deuses",lead:"O māra do filho dos deuses. Uma queda funesta dos dados, como o fogo que toma uma boa casa.",sign:"Quando arde o fogo do desejo, é a si mesmo que se queima.",
c:["Instabilidade e grande obstrução.","Mesmo se concluído, o resultado é vazio.","Como a cinza da seda queimada.","Há alguns; o dano vem sobretudo do sudoeste.","Grande perigo para pessoas e bens no caminho.","Um mal de calor, de sangue ou contagioso, e grave.","Dano ligado a um objeto vermelho ou triangular, ou a carne e sangue vindos do oeste; não queime restos no fogão.","Um grande obstáculo: muitos rituais de fogo pacíficos e de ablução, remédios, e as orações e o mantra de Guru Padmasambhava.","Não será encontrado.","Em perigo de fracassar; o obstáculo é grande.","Sem êxito."],
r:"Rituais de fogo pacíficos e de ablução; a prática de chö (corte); Guru Padmasambhava.",k:"Os agregados da pessoa feridos pelo sofrimento"},
27:{name:"O Vaso de Joias Transbordante",lead:"O vaso de joias transbordando de grãos. A prosperidade cresce: a vaca que realiza desejos.",sign:"O vaso de ouro e o néctar nele, belos juntos (palavras de Mañjuśrī Branco).",
c:["Positivos e felizes.","A felicidade da mente cresce.","Alimento, meios e amigos voltam e aumentam.","Nem ladrões nem inimigos.","O propósito tem êxito; um pouco atrasados, chegam felizes.","Curada, e segue-se a alegria.","Nenhum. O que parece um ataque é na verdade uma condição favorável.","Boa, e bem-sucedida.","Encontrado no leste ou no centro da sua região, ou ao sul de onde foi perdido.","Se ainda não vieram nem começaram, há algum arrependimento, mas será feito como se deseja.","Mantenha-se alegre e contente."],
r:"Receba iniciações; deidades de prosperidade e a família da joia; o estágio de geração e a prática de extração da essência; oferendas de banquete; oferendas aos protetores e aos nāgas; o tantra de Vairocana; Gaṇapati.",k:"O bom campo que faz crescer a felicidade"},
28:{name:"A Montanha de Areia Dispersa",lead:"Uma montanha de areia. Os resultados dos seus objetivos se estragam e são espalhados como poeira.",sign:"A casa de ouro é nivelada, pouco a pouco, em pó.",
c:["Diminuindo continuamente.","Grandes mudanças, que terminam em declínio.","Nada novo vem, e o que se reuniu encolhe.","A sua prosperidade pode ser atingida de repente; são necessários rituais de proteção.","Você ficará feliz em vê-los, mas as notícias que trazem causam arrependimento e tristeza.","Leve, e curável por ritual.","Nenhum grande espírito, mas as suas percepções estão agitadas e inquietas por hábitos arraigados de ação e decisão equivocadas. Um ritual de fogo pacífico; versos de auspiciosidade recitados pelo Saṅgha.","A perspectiva é fraca; os objetivos são difíceis de alcançar.","Mais difícil de achar quanto mais tempo passar.","Difícil; e sem benefício mesmo que feito.","Nenhum resultado significativo, exceto para trabalhos de desmontar."],
r:"Recite o Ratnakūṭa e o Maṅgala Sūtra e orações a Guru Padmasambhava muitas vezes; construa uma ponte; mande escrever escrituras em ouro.",k:"A montanha reduzida a pó"},
29:{name:"A Mansão de Ouro",lead:"A mansão de ouro. Tudo é bom, amplo e estável, como um palácio celestial.",sign:"Uma montanha de joias assentada sobre um chão de ouro: uma maravilha.",
c:["Como um tesouro inesgotável; excelentes pela firmeza.","Firmes como a terra e a montanha, e por isso bons; é possível algum atraso. Faça oferendas às deidades de prosperidade e da terra.","Muito amplos no futuro.","Nenhum.","Atrasados, mas chegam salvos e a viagem tem êxito.","Longa e séria, mas sem dano duradouro; e outra doença não vem facilmente depois.","Nenhuma causa para dano algum.","Firme nos votos; desejos realizados.","Ainda está onde foi perdido. Se foi mudado de lugar, difícil de recuperar.","Provavelmente atrasado, a menos que se resolva depressa.","Bom se não houver atraso. Fraco para mudanças instáveis: deixar um cargo, mudar-se, ir a lugares novos, petições. Bom para firmar, atar e fazer crescer."],
r:"Altares para deidades de prosperidade como Vasudhārā; stūpas; um vaso de tesouro na casa; mantras de Locanā e Kṣitigarbha; Bernakchen Mahākāla.",k:"Uma grande coisa posta sobre outra"},
30:{name:"O Tesouro de Joias",lead:"O tesouro de joias, na porta do oeste. Prosperidade completa, como um tesouro aberto de par em par.",sign:"Abrir a porta do tesouro no leste; manteiga do leite, gemas do mar.",
c:["Sem mudanças à frente; bons.","Excelentes e firmes; a perspectiva é positiva.","O que você deseja se realiza.","Nenhum surge.","Uma viagem bem-sucedida e confortável.","Melhora gradualmente.","Absolutamente nenhum.","Muito boa. Confie na família vajra e nos três senhores das famílias, e em Mahākāla.","Perto de onde foi perdido.","Realizado com o tempo.","Bem-sucedidos."],
r:"Busque a bênção da família da joia; oferendas aos nāgas, às deidades da terra e às deidades locais.",k:"Um edifício de muitos andares"},
31:{name:"Mañjuśrī Aparece",lead:"Mañjuśrī aparece. O que se deseja se realiza, como uma gema que cai na mão.",sign:"O jogo da sabedoria primordial, a consciência pura, espalha-se em todas as direções.",
c:["Firmes e sem obstrução.","Não tenha dúvidas: há aqui uma autoridade sem engano. Estude e contemple os ensinamentos, sobretudo os do mantra.","Continuam a crescer.","Os opositores vêm a você com respeito.","Confortável e bem-sucedida.","Cura-se por si.","Nenhum agora e nenhum por vir; nada a temer.","Boa; a felicidade da mente cresce e os desejos se realizam.","Encontrado.","Eles vêm, e se realiza.","Todos os seus objetivos se realizam."],
r:"Mañjuśrī, Padmasambhava, Kālacakra; o corpo ilusório e a Grande Perfeição; Nyenchen Thanglha e Mahākāla como protetores; erga imagens, escrituras e stūpas.",k:"Senhor das trinta e seis cidades; sabedoria crescente, excelência realizada"},

["The Vase of Nectar","g",65],["The Pool Without a Source of Water","m",68],["The Ocean of Nectar","g",71],["The Demon of Afflictions","b",74],["The Golden Lotus","g",77],["The Nectar-like Medicine","g",80],
["The White Umbrella of Good Fortune","g",83],["The Great Fiery Weapon","g",86],["Empty of Intelligence","b",89],["The Streamer of Fame","g",92],["The Māra Demon of the Aggregates","b",95],["The House of Good Tidings","g",98],
["The Golden Mountain","g",101],["The Demon of the Heavenly Son","b",104],["The Overflowing Jeweled Vessel","g",107],["The Scattered Mountain of Sand","b",110],["The Mansion of Gold","g",113],["The Treasury of Jewels","g",116],
["Mañjuśrī Appears","g",118],["The Endless Auspicious Knot","g",121],["The Golden Female Fish","g",124],["The White Conch","g",126],["The Golden Wheel","g",128],["The Jeweled Banner of Victory","g",130]];
function moName(n){return LANG==="pt"?window.MOX_PT[n].name:MO[n-1][0]}
function MOL(){return LANG==="pt"?window.MOX_PT:window.MOX}

/* ---------- helpers ---------- */
function rnd(n){var a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hexNumber(bits){return GRID[ORDER.indexOf(bits.slice(0,3).join(""))][ORDER.indexOf(bits.slice(3).join(""))]}
function HEXBITS(n){for(var a=0;a<8;a++)for(var b=0;b<8;b++)if(GRID[a][b]===n)return (ORDER[a]+ORDER[b]).split("").map(Number);return [0,0,0,0,0,0]}
function castIC(vals){
  var bits=vals.map(function(v){return v%2});
  var moving=[];vals.forEach(function(v,i){if(v===6||v===9)moving.push(i)});
  var bits2=vals.map(function(v,i){return v===6?1:v===9?0:bits[i]});
  return{bits:bits,n1:hexNumber(bits),moving:moving,bits2:bits2,n2:moving.length?hexNumber(bits2):null};
}
function moNumber(a,b){return a*6+b+1}
window.__oracle={castIC:castIC,moNumber:moNumber};
function lineHTML(v){
  var yang=(v===7||v===9||v===1);
  var mk=v===9?'<b class="mk mk9"></b>':v===6?'<b class="mk mk6">×</b>':"";
  return '<div class="ln">'+(yang?"<i></i>":"<i></i><i></i>")+mk+"</div>";
}
function figHTML(arr){return '<div class="fig" aria-hidden="true">'+arr.map(lineHTML).join("")+"</div>"}

/* ---------- state ---------- */
var S={mode:"ic",vals:[],casts:[],busy:false,fromJournal:false,look:null};
var KEY="mo-iching-journal-v1",MODEKEY="mo-iching-mode";
function loadJ(){try{var j=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(j)?j:[]}catch(e){return[]}}
function saveJ(j){try{localStorage.setItem(KEY,JSON.stringify(j.slice(0,60)))}catch(e){}}
var J=loadJ();

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=LANG==="pt"?"pt-BR":"en";
  $("lang-pt").setAttribute("aria-pressed",LANG==="pt");$("lang-en").setAttribute("aria-pressed",LANG==="en");
  [].forEach.call(document.querySelectorAll("[data-t]"),function(el){el.innerHTML=t(el.getAttribute("data-t"))});
  $("j-clear").textContent=t("jClear");
  var sel=$("ic-sel"),v=sel.value||"1",o="";
  for(var n=1;n<=64;n++)o+='<option value="'+n+'">'+n+". "+HEX[n][1]+" · "+esc(hexTitle(n))+"</option>";
  sel.innerHTML=o;sel.value=v;
  var th="<tr>"+t("sylHead").map(function(h){return"<th>"+h+"</th>"}).join("")+"</tr>";
  SYL.forEach(function(s){var a=s[LANG];th+='<tr><td><span class="syl" lang="bo">'+s.t+"</span> "+s.i+"</td><td>"+a[0]+"</td><td>"+a[1]+"</td><td>"+a[2]+"</td><td>"+a[3]+"</td><td>"+s.n+"</td></tr>"});
  $("syl-table").innerHTML=th;
  $("mo-sel-a").setAttribute("aria-label",LANG==="pt"?"Primeira sílaba":"First syllable");
  $("mo-sel-b").setAttribute("aria-label",LANG==="pt"?"Segunda sílaba":"Second syllable");
  renderBuild();renderMo();renderJournal();
  if(S.look)showHex(S.look,true);
}
function setLang(l){LANG=l==="en"?"en":"pt";try{localStorage.setItem(LANGKEY,LANG)}catch(e){}applyLang()}
$("lang-pt").addEventListener("click",function(){setLang("pt")});
$("lang-en").addEventListener("click",function(){setLang("en")});

/* ---------- mode ---------- */
function setMode(m,fromHash){
  S.mode=m;$("app").setAttribute("data-mode",m);
  $("panel-ic").hidden=m!=="ic";$("panel-mo").hidden=m!=="mo";
  $("tab-ic").setAttribute("aria-selected",m==="ic");$("tab-mo").setAttribute("aria-selected",m==="mo");
  try{localStorage.setItem(MODEKEY,m)}catch(e){}
  if(!fromHash){try{history.replaceState(null,"","#"+(m==="mo"?"mo":"iching"))}catch(e){}}
}
$("tab-ic").addEventListener("click",function(){setMode("ic")});
$("tab-mo").addEventListener("click",function(){setMode("mo")});
window.addEventListener("hashchange",function(){var h=location.hash;if(h==="#mo")setMode("mo",true);else if(h==="#iching")setMode("ic",true)});

/* ---------- I Ching ---------- */
var coins=[].slice.call(document.querySelectorAll(".coin")),rot=[0,0,0];
function spinCoins(faces){
  coins.forEach(function(c,i){
    var base=rot[i]+1080+360*rnd(2);
    var yangUp=(base/180)%2===0;
    if((faces[i]===3)!==yangUp)base+=180;
    rot[i]=base;c.style.transitionDelay=(i*70)+"ms";c.style.transform="rotateX("+base+"deg)";
  });
}
function renderBuild(){
  var h="";
  for(var i=0;i<6;i++){
    var v=S.vals[i];
    h+='<div class="row"><span class="pos">'+(i+1)+"</span>"+(v?lineHTML(v):'<div class="ln empty"></div>')+'<span class="val">'+(v||"")+"</span></div>";
  }
  $("ic-build").innerHTML=h;
  var n=S.vals.length,done=n===6;
  $("ic-throw").textContent=done?t("newR"):t("throwC");
  $("ic-status").textContent=done?t("sixCast"):t("throwN",{n:n+1})+(n===0?t("firstBottom"):".");
  [].forEach.call(document.querySelectorAll("#panel-ic .manual button"),function(b){b.disabled=done||S.busy});
  if(done)renderICResult();else if(!S.look){$("ic-result").hidden=true;$("ic-result").innerHTML=""}
}
function hexCardHTML(n,figArr,bits,kicker){
  var H=HEX[n],lo=bits.slice(0,3).join(""),up=bits.slice(3).join(""),tg=t("trig");
  return '<div class="hexcard">'+figHTML(figArr)+'<div class="meta">'+
    '<p class="kicker">'+kicker+"</p>"+
    "<h3>"+n+' <span class="zh" lang="zh">'+H[0]+"</span> "+H[1]+"</h3>"+
    '<p class="en">'+esc(hexTitle(n))+"</p>"+
    '<p class="small">'+t("above")+" "+TRI[up]+" ("+tg[up]+"), "+t("below")+" "+TRI[lo]+" ("+tg[lo]+"). "+t("wilhelmSp")+": "+esc(H[2])+", <i>"+esc(H[3])+"</i>.</p>"+
    "</div></div>";
}
function lineLab(bit,i){return (bit?t("nine"):t("six"))+t("place")[i]}
function interpHTML(n,opt){
  var X=ICL()[n],H=HEX[n];opt=opt||{};
  if(!X)return "";
  var h='<div class="interp">';
  h+="<div><h4>"+t("judgment")+"</h4><p>"+esc(X.j)+"</p></div>";
  h+="<div><h4>"+t("image")+"</h4><p>"+esc(X.im)+"</p></div>";
  if(opt.lines){
    var bits=HEXBITS(n),li="";
    for(var i=0;i<6;i++){
      var on=opt.moving&&opt.moving.indexOf(i)>=0;
      li+='<li class="'+(on?"on":"")+'"><span class="no">'+(i+1)+'</span><div class="tx"><span class="lab">'+lineLab(bits[i],i)+(on?" · "+t("moving"):"")+"</span>"+esc(X.l[i])+"</div></li>";
    }
    if(opt.open)h+="<div><h4>"+t("sixLines")+'</h4><ol class="lines">'+li+"</ol></div>";
    else h+="<details><summary>"+t("allSix")+'</summary><ol class="lines">'+li+"</ol></details>";
  }
  h+='<p class="pages">'+t("fullW",{a:H[4],b:H[5]})+"</p>";
  return h+"</div>";
}
function movingHTML(n,vals,moving){
  var X=ICL()[n];if(!X)return "";
  var h='<div class="moving"><h3>'+(moving.length===1?t("mvOne"):t("mvMany"))+"</h3>";
  if(moving.length===6&&X.all)h+='<p class="small">'+t("allMoveNote")+"</p><p>"+esc(X.all)+"</p>";
  h+='<ol class="lines">';
  moving.forEach(function(i){h+='<li class="on"><span class="no">'+(i+1)+'</span><div class="tx"><span class="lab">'+lineLab(vals[i]===9?1:0,i)+"</span>"+esc(X.l[i])+"</div></li>"});
  return h+"</ol></div>";
}
function renderICResult(){
  S.look=null;
  var r=castIC(S.vals),h="";
  h+=hexCardHTML(r.n1,S.vals,r.bits,t("yourHex"));
  h+=interpHTML(r.n1,{lines:true,moving:r.moving});
  if(r.moving.length){
    h+=movingHTML(r.n1,S.vals,r.moving);
    h+=hexCardHTML(r.n2,r.bits2,r.bits2,t("changesInto"));
    h+=interpHTML(r.n2,{lines:true});
  }else{
    h+='<div class="moving"><h3>'+t("noMv")+"</h3><p>"+t("noMvTx")+"</p></div>";
  }
  $("ic-result").innerHTML=h;$("ic-result").hidden=false;
}
function showHex(n,quiet){
  if(!quiet){S.vals=[];S.fromJournal=false;$("ic-sum").textContent="";}
  S.look=n;renderBuild();
  var b=HEXBITS(n),X=ICL()[n];
  $("ic-result").innerHTML=hexCardHTML(n,b,b,t("lookedUp"))+interpHTML(n,{lines:true,open:true})+
    ((X&&X.all)?'<div class="moving"><h3>'+t("ifAll")+"</h3><p>"+esc(X.all)+"</p></div>":"");
  $("ic-result").hidden=false;
  if(!quiet)$("ic-result").scrollIntoView({behavior:reduce?"auto":"smooth"});
}
$("ic-show").addEventListener("click",function(){if(!S.busy)showHex(+$("ic-sel").value)});
function addLine(v){
  S.look=null;S.vals.push(v);
  if(S.vals.length===6&&!S.fromJournal){var r=castIC(S.vals);journalAdd({m:"ic",v:S.vals.slice(),n1:r.n1,n2:r.n2})}
  renderBuild();
}
function resetIC(){S.vals=[];S.look=null;S.fromJournal=false;$("ic-sum").textContent="";renderBuild()}
$("ic-throw").addEventListener("click",function(){
  if(S.busy)return;
  if(S.vals.length>=6){resetIC();return}
  S.look=null;
  var f=[2+rnd(2),2+rnd(2),2+rnd(2)],sum=f[0]+f[1]+f[2];
  S.busy=true;$("ic-throw").disabled=true;$("ic-sum").textContent="";spinCoins(f);
  setTimeout(function(){
    S.busy=false;$("ic-throw").disabled=false;
    $("ic-sum").textContent=f.join(" + ")+" = "+sum;
    addLine(sum);
  },reduce?60:1150);
});
[].forEach.call(document.querySelectorAll("#panel-ic .manual button"),function(b){
  b.addEventListener("click",function(){if(S.busy||S.vals.length>=6)return;$("ic-sum").textContent="";addLine(+b.getAttribute("data-v"))});
});

/* ---------- Mo ---------- */
function setDie(el,idx){var s=SYL[idx];el.classList.remove("blank");el.querySelector(".tib").textContent=s.t;var l=el.querySelector(".lat");if(l)l.textContent=s.i}
function blankDie(el){el.classList.add("blank");el.querySelector(".tib").textContent="";var l=el.querySelector(".lat");if(l)l.textContent=""}
function rollDie(el,cb){
  var final=rnd(6);
  if(reduce){setDie(el,final);cb(final);return}
  el.classList.add("rolling");
  var tm=setInterval(function(){setDie(el,rnd(6))},75);
  setTimeout(function(){clearInterval(tm);el.classList.remove("rolling");setDie(el,final);cb(final)},850);
}
function renderMo(){
  var n=S.casts.length,done=n===2;
  for(var k=0;k<2;k++){if(S.casts[k]===undefined)blankDie($("die-"+k));else setDie($("die-"+k),S.casts[k])}
  $("mo-cast").textContent=done?t("newR"):t("castDie");
  $("mo-status").textContent=done?t("bothCast"):n===0?t("firstC"):t("secondC");
  [].forEach.call(document.querySelectorAll("#mo-manual button"),function(b){b.disabled=done||S.busy});
  if(done)renderMoResult();else{$("mo-result").hidden=true;$("mo-result").innerHTML=""}
}
function moBodyHTML(num,M){
  var X=MOL()[num],cats=t("cats");
  var h='<p class="lead">'+esc(X.lead)+"</p>"+'<p class="sign">'+t("theSign")+": “"+esc(X.sign)+"”</p>";
  h+='<dl class="cats">';
  X.c.forEach(function(s,i){h+="<div><dt>"+cats[i]+"</dt><dd>"+esc(s)+"</dd></div>"});
  h+="</dl>";
  h+='<div class="interp"><div><h4>'+t("supports")+"</h4><p>"+esc(X.r)+"</p></div><div><h4>"+t("knownAs")+"</h4><p><i>"+esc(X.k)+"</i></p></div></div>";
  h+='<p class="pages">'+t("fullMo",{a:M[2],b:M[2]+1})+"</p>";
  return h;
}
function renderMoResult(){
  var a=S.casts[0],b=S.casts[1],num=moNumber(a,b),M=MO[num-1],ten=M[1];
  var h='<div class="mocard">'+
    '<p class="kicker">'+t("answerOf",{n:num})+"</p>"+
    '<p class="big" lang="bo">'+SYL[a].t+" "+SYL[b].t+"</p>"+
    "<h3>"+esc(moName(num))+"</h3>"+
    '<p class="small">'+SYL[a].i+" "+SYL[b].i+". "+t("inBook")+": "+SYL[a].b+" "+SYL[b].b+(LANG==="pt"?", <i>"+esc(M[0])+"</i>":"")+".</p>"+
    '<span class="pill '+({g:"good",m:"mixed",b:"bad"})[ten]+'">'+t("tenor")[ten]+"</span>"+
    moBodyHTML(num,M)+"</div>"+
    '<div class="moving"><h3>'+t("firmQ")+"</h3>"+
    '<p class="small">'+t("firmTx")+"</p>"+
    '<div class="firm"><div class="die sm blank" id="fd-0"><span class="tib"></span></div><div class="die sm blank" id="fd-1"><span class="tib"></span></div>'+
    '<button class="ghost" id="firm-btn">'+t("firmBtn")+'</button><span id="firm-out" aria-live="polite"></span></div></div>';
  $("mo-result").innerHTML=h;$("mo-result").hidden=false;
  $("firm-btn").addEventListener("click",function(){
    if(S.busy)return;S.busy=true;this.disabled=true;$("firm-out").textContent="";
    blankDie($("fd-0"));blankDie($("fd-1"));
    var btn=this;
    rollDie($("fd-0"),function(x){rollDie($("fd-1"),function(y){
      S.busy=false;btn.disabled=false;
      $("firm-out").textContent=(x===a&&y===b)?t("firmSame"):(x===b&&y===a)?t("firmRev"):t("firmOther");
    })});
  });
}
function addCast(idx){
  S.casts.push(idx);
  if(S.casts.length===2&&!S.fromJournal)journalAdd({m:"mo",c:S.casts.slice()});
  renderMo();
}
function resetMo(){S.casts=[];S.fromJournal=false;renderMo()}
$("mo-cast").addEventListener("click",function(){
  if(S.busy)return;
  if(S.casts.length>=2)resetMo();
  var el=$("die-"+S.casts.length),btn=this;
  S.busy=true;btn.disabled=true;
  rollDie(el,function(v){S.busy=false;btn.disabled=false;addCast(v)});
});
(function(){
  var box=$("mo-manual");
  SYL.forEach(function(s,idx){
    var b=document.createElement("button");b.innerHTML='<span class="syl" lang="bo">'+s.t+"</span> "+s.i;
    b.setAttribute("aria-label",s.i);
    b.addEventListener("click",function(){if(S.busy||S.casts.length>=2)return;addCast(idx)});
    box.appendChild(b);
  });
  var oa="";SYL.forEach(function(s,i){oa+='<option value="'+i+'">'+s.i+"</option>"});
  $("mo-sel-a").innerHTML=oa;$("mo-sel-b").innerHTML=oa;
  $("mo-show").addEventListener("click",function(){
    if(S.busy)return;S.casts=[+$("mo-sel-a").value,+$("mo-sel-b").value];S.fromJournal=true;renderMo();
    $("mo-result").scrollIntoView({behavior:reduce?"auto":"smooth"});
  });
})();

/* ---------- journal ---------- */
function journalAdd(e){
  e.t=Date.now();e.q=$("question").value.trim().slice(0,200);
  J.unshift(e);J=J.slice(0,60);saveJ(J);renderJournal();
}
function renderJournal(){
  var ul=$("j-list");ul.innerHTML="";
  $("j-empty").hidden=J.length>0;$("j-clear").hidden=J.length===0;
  J.forEach(function(e){
    var li=document.createElement("li"),b=document.createElement("button");
    var d=new Date(e.t),ds="";
    try{ds=d.toLocaleDateString(t("locale"),{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString(t("locale"),{hour:"2-digit",minute:"2-digit"})}catch(x){ds=""}
    var label;
    if(e.m==="ic"){label="I Ching: "+e.n1+" "+hexTitle(e.n1)+(e.n2?" → "+e.n2+" "+hexTitle(e.n2):"")}
    else{var n=moNumber(e.c[0],e.c[1]);label="Mo: "+SYL[e.c[0]].i+" "+SYL[e.c[1]].i+", "+moName(n)}
    var s1=document.createElement("span");s1.className="d";s1.textContent=ds;
    var s2=document.createElement("span");s2.className="r";s2.textContent=label;
    if(e.q){var qq=document.createElement("span");qq.className="qq";qq.textContent=e.q;s2.appendChild(qq)}
    b.appendChild(s1);b.appendChild(s2);
    b.addEventListener("click",function(){
      if(S.busy)return;
      $("question").value=e.q||"";
      if(e.m==="ic"){setMode("ic");S.look=null;S.vals=e.v.slice();S.fromJournal=true;$("ic-sum").textContent="";renderBuild();$("panel-ic").scrollIntoView({behavior:reduce?"auto":"smooth"})}
      else{setMode("mo");S.casts=e.c.slice();S.fromJournal=true;renderMo();$("panel-mo").scrollIntoView({behavior:reduce?"auto":"smooth"})}
    });
    li.appendChild(b);ul.appendChild(li);
  });
}
var clearArmed=false;
$("j-clear").addEventListener("click",function(){
  if(!clearArmed){clearArmed=true;this.textContent=t("jConfirm");var self=this;setTimeout(function(){clearArmed=false;self.textContent=t("jClear")},4000);return}
  clearArmed=false;this.textContent=t("jClear");J=[];saveJ(J);renderJournal();
});

/* ---------- boot ---------- */
function start(d){
  d=d||{};
  var l=d.lang;if(!l){try{l=localStorage.getItem(LANGKEY)}catch(e){}}
  LANG=l==="en"?"en":"pt";
  var m=d.mode;
  if(!m){if(location.hash==="#mo")m="mo";else if(location.hash==="#iching")m="ic";else{try{m=localStorage.getItem(MODEKEY)}catch(e){}}}
  setMode(m==="mo"?"mo":"ic",true);
  if(Array.isArray(d.vals))S.vals=d.vals.filter(function(v){return v>=6&&v<=9}).slice(0,6);
  if(Array.isArray(d.casts))S.casts=d.casts.filter(function(v){return v>=0&&v<=5}).slice(0,2);
  if(S.vals.length===6||S.casts.length===2)S.fromJournal=true;
  if(typeof d.q==="string")$("question").value=d.q;
  applyLang();
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(function(){return{mode:S.mode,lang:LANG,vals:S.vals,casts:S.casts,q:$("question").value}})}catch(e){}}
if(hot&&hot.ready){hot.ready(start)}else{start((hot&&hot.data)||{})}
})();
</script>
